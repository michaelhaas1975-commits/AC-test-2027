<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: Prüfungsraum am iPad. Feste Kopfleiste mit Uhr, Nummernleiste, eine Aufgabe je Bildschirm, große Antwortflächen. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #18232f; --muted: #5b6876; --line: #d6dde4;
  --accent: #1d4e6b; --accent-soft: #e3edf3; --mark: #b86b12; --mark-soft: #fbefdf;
  --ok: #2d7a46; --ok-soft: #e2f1e6; --bad: #b23a2e; --bad-soft: #f8e4e1;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10171e; --surface: #18222c; --ink: #e6edf3; --muted: #9aa8b5; --line: #2c3a47;
  --accent: #7fb6d6; --accent-soft: #1f3341; --mark: #e2a24e; --mark-soft: #3a2a14;
  --ok: #6fc28a; --ok-soft: #173223; --bad: #ef8a7d; --bad-soft: #3a1c18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10171e; --surface: #18222c; --ink: #e6edf3; --muted: #9aa8b5; --line: #2c3a47;
  --accent: #7fb6d6; --accent-soft: #1f3341; --mark: #e2a24e; --mark-soft: #3a2a14;
  --ok: #6fc28a; --ok-soft: #173223; --bad: #ef8a7d; --bad-soft: #3a1c18; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--f-body); -webkit-tap-highlight-color: transparent }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h1 { font-size: 2rem } h2 { font-size: 1.35rem } h3 { font-size: 1.05rem }
.eyebrow { font: 700 .74rem/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none }
button:focus-visible, .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 18px; min-height: 48px; font-weight: 700 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.btn.warn { color: var(--mark); border-color: var(--mark) }
.btn.on { background: var(--mark-soft); border-color: var(--mark); color: var(--mark) }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center }
.muted { color: var(--muted) }

/* Startseite */
.hero { display: grid; gap: 10px; padding-block: 18px 26px }
.hero p { max-width: 62ch; margin: 0 }
.tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 10px; align-content: start }
.card .meta { font-family: var(--f-mono); font-size: .85rem; color: var(--muted) }
.card .last { font-size: .9rem; border-top: 1px solid var(--line); padding-top: 10px; min-height: 2.8em }
.rules { margin-top: 26px; background: var(--accent-soft); border-radius: 14px; padding: 18px 20px }
.rules ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 4px }

/* Testansicht */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar .in { max-width: 920px; margin: 0 auto; display: flex; gap: 14px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar .title { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.clock { font: 700 1.35rem/1 var(--f-mono); font-variant-numeric: tabular-nums; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent) }
.clock.low { background: var(--bad-soft); color: var(--bad) }
.strip { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 5px; margin-block: 16px 20px }
.strip button { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font: 700 .9rem var(--f-mono); position: relative; padding: 0 }
.strip button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.strip button.cur { outline: 3px solid var(--ink); outline-offset: 1px }
.strip button.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--mark) }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(8, minmax(0, 1fr)) } }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 14px; min-width: 0 }
.panel p { margin: 0 }
.passage { background: var(--bg); border-left: 4px solid var(--accent); border-radius: 6px; padding: 14px 16px; display: grid; gap: 8px }
.passage .t { font-weight: 700 }
.tbl { overflow-x: auto } table { border-collapse: collapse; font-size: .92rem; margin: 0 auto; font-variant-numeric: tabular-nums }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left } th { background: var(--accent-soft) }
.fig { text-align: center } .fig img { max-width: 100%; border-radius: 6px; background: #fff; cursor: zoom-in }
.fig.m img { width: 640px } body.k-fig .fig.m img { width: 360px } .fig.o img { width: 100% }
.stmts { display: grid; gap: 8px } .stmt { display: grid; grid-template-columns: 2.2em 1fr; gap: 6px }
.stmt b { font-family: var(--f-mono) }
.opts { display: grid; gap: 10px } .opts.grid8 { grid-template-columns: repeat(8, minmax(0, 1fr)) } .opts.grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)) }
@media (max-width: 560px) { .opts.grid8 { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.opt { display: flex; gap: 14px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px; min-height: 56px }
.opt .l { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 1rem var(--f-mono); background: var(--bg) }
.opt.sel { border-color: var(--accent); background: var(--accent-soft) } .opt.sel .l { background: var(--accent); color: var(--surface) }
.opts.grid8 .opt, .opts.grid4 .opt { justify-content: center; padding: 10px 4px }
.nav { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; margin-top: 18px }

/* Dialog und Zoom */
.veil { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 22, .55); display: grid; place-items: center; padding: 20px }
.dialog { background: var(--surface); border-radius: 16px; padding: 24px; max-width: 460px; width: 100%; display: grid; gap: 14px }
.zoom { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 22, .9); overflow: auto; display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 16px }
.zoom img { max-width: none; width: min(1500px, 220vw); background: #fff; border-radius: 6px }
.zoom .close { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); z-index: 31 }

/* Auswertung */
.score { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px }
.score .big { font: 700 3.2rem/1 var(--f-display) } .score .big small { font-size: 1.4rem; color: var(--muted) }
.bars { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 4px; margin-top: 10px }
.bars span { height: 12px; border-radius: 3px; background: var(--line) } .bars .r { background: var(--ok) } .bars .f { background: var(--bad) }
.list { display: grid; gap: 10px; margin-top: 20px }
.res { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.res > button { width: 100%; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 0; background: none; text-align: left }
.tag { font: 700 .78rem var(--f-mono); padding: 4px 8px; border-radius: 6px; flex: none }
.tag.r { background: var(--ok-soft); color: var(--ok) } .tag.f { background: var(--bad-soft); color: var(--bad) } .tag.e { background: var(--bg); color: var(--muted) }
.res .body { padding: 0 16px 16px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px }
.res .body p { margin: 0 }
.res .q { font-size: .92rem; color: var(--muted) }
.solimg img { width: 220px; max-width: 100% }
@media (prefers-reduced-motion: no-preference) { .opt, .strip button { transition: background .12s, border-color .12s } }
</style>
</head>

<script>
const DATA = {"key": "text", "label": "Texte analysieren", "tests": [{"name": "Übungstest 1", "level": "Niveau der Probetests", "minutes": 30, "intro": "Welche der folgenden Aussagen lässt bzw. lassen sich aus den Informationen des jeweiligen Textes ableiten?", "items": [{"num": 1, "stem": [], "question": null, "statements": ["Sinken die fixen Kosten bei unverändertem Deckungsbeitrag je Stück, wird die Gewinnschwelle bei einer geringeren Menge erreicht.", "Ein Produkt mit positivem Deckungsbeitrag erwirtschaftet einen Gewinn."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 1 · Aufgaben 1 und 2", "title": "Deckungsbeitrag", "paras": ["Der Deckungsbeitrag eines Produkts ist die Differenz zwischen seinem Verkaufspreis und den variablen Kosten je Stück. Variable Kosten verändern sich mit der Produktionsmenge, fixe Kosten fallen unabhängig von ihr an. Die Summe der Deckungsbeiträge aller verkauften Einheiten dient zunächst dazu, die fixen Kosten zu decken; erst der darüber hinausgehende Betrag ist Gewinn. Die Menge, bei der die Summe der Deckungsbeiträge genau den fixen Kosten entspricht, heißt Gewinnschwelle.", "Ein Unternehmen, das kurzfristig nicht ausgelastet ist, nimmt nach dieser Logik einen Zusatzauftrag bereits dann an, wenn dessen Preis über den variablen Stückkosten liegt, weil die fixen Kosten ohnehin anfallen."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Die Gewinnschwelle ist die Menge, bei der Menge × Deckungsbeitrag den fixen Kosten entspricht. Sinken die fixen Kosten, genügt eine kleinere Menge.", "**II ist nicht ableitbar.** Gewinn entsteht erst, wenn die Summe der Deckungsbeiträge die fixen Kosten übersteigt. Ein positiver Deckungsbeitrag allein sagt darüber nichts."]}, {"num": 2, "stem": [], "question": null, "statements": ["Lehnt ein nicht ausgelastetes Unternehmen nach dieser Logik einen Zusatzauftrag ab, liegt dessen Preis nicht über den variablen Stückkosten.", "Verdoppeln sich Verkaufspreis und variable Stückkosten zugleich, verdoppelt sich der Deckungsbeitrag je Stück."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 1 · Aufgaben 1 und 2", "title": "Deckungsbeitrag", "paras": ["Der Deckungsbeitrag eines Produkts ist die Differenz zwischen seinem Verkaufspreis und den variablen Kosten je Stück. Variable Kosten verändern sich mit der Produktionsmenge, fixe Kosten fallen unabhängig von ihr an. Die Summe der Deckungsbeiträge aller verkauften Einheiten dient zunächst dazu, die fixen Kosten zu decken; erst der darüber hinausgehende Betrag ist Gewinn. Die Menge, bei der die Summe der Deckungsbeiträge genau den fixen Kosten entspricht, heißt Gewinnschwelle.", "Ein Unternehmen, das kurzfristig nicht ausgelastet ist, nimmt nach dieser Logik einen Zusatzauftrag bereits dann an, wenn dessen Preis über den variablen Stückkosten liegt, weil die fixen Kosten ohnehin anfallen."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Der Text sagt: Preis über den variablen Stückkosten → Annahme. Die Aussage ist die Kontraposition dieser Regel (keine Annahme → Preis nicht über den variablen Stückkosten) und damit gültig. Nicht ableitbar wäre dagegen der Umkehrschluss „Wird angenommen, liegt der Preis über den variablen Stückkosten“.", "**II ist ableitbar.** Der Deckungsbeitrag ist eine Differenz: 2p − 2v = 2 · (p − v)."]}, {"num": 3, "stem": [], "question": null, "statements": ["Eine Beschäftigte, die seit sechs Jahren im Betrieb arbeitet, kann ohne abweichende Vertragsregelung mit einer Frist von vier Wochen kündigen.", "Kündigt der Arbeitgeber einem Beschäftigten mit sieben Jahren Betriebszugehörigkeit am 10. März, endet das Arbeitsverhältnis frühestens am 31. Mai."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 2 · Aufgaben 3 und 4", "title": "Kündigungsfristen", "paras": ["In einem Land gelten für Arbeitsverhältnisse folgende Regeln: In der Probezeit, die höchstens sechs Monate dauern darf, können beide Seiten mit einer Frist von zwei Wochen kündigen. Danach beträgt die Grundfrist für beide Seiten vier Wochen zum Fünfzehnten oder zum Ende eines Kalendermonats.", "Für eine Kündigung durch den Arbeitgeber verlängert sich die Frist mit der Dauer der Betriebszugehörigkeit: nach zwei Jahren auf einen Monat, nach fünf Jahren auf zwei Monate, nach acht Jahren auf drei Monate, jeweils zum Ende eines Kalendermonats. Für Kündigungen durch Beschäftigte bleibt es bei der Grundfrist, sofern der Arbeitsvertrag nichts anderes bestimmt. Der Vertrag darf für Beschäftigte jedoch keine längere Frist vorsehen als für den Arbeitgeber."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Die Verlängerung nach Betriebszugehörigkeit gilt nur für Kündigungen durch den Arbeitgeber. Für Beschäftigte bleibt es ohne abweichenden Vertrag bei der Grundfrist von vier Wochen.", "**II ist ableitbar.** Nach fünf Jahren gilt eine Frist von zwei Monaten zum Ende eines Kalendermonats. Zwei Monate ab dem 10. März reichen bis zum 10. Mai, das nächste Monatsende ist der 31. Mai."]}, {"num": 4, "stem": [], "question": null, "statements": ["Übernimmt ein Arbeitsvertrag für den Arbeitgeber die genannten Fristen, darf er einen Beschäftigten im vierten Jahr der Betriebszugehörigkeit nicht an eine Kündigungsfrist von zwei Monaten binden.", "In der Probezeit ist die Kündigungsfrist für den Arbeitgeber kürzer als für Beschäftigte."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 2 · Aufgaben 3 und 4", "title": "Kündigungsfristen", "paras": ["In einem Land gelten für Arbeitsverhältnisse folgende Regeln: In der Probezeit, die höchstens sechs Monate dauern darf, können beide Seiten mit einer Frist von zwei Wochen kündigen. Danach beträgt die Grundfrist für beide Seiten vier Wochen zum Fünfzehnten oder zum Ende eines Kalendermonats.", "Für eine Kündigung durch den Arbeitgeber verlängert sich die Frist mit der Dauer der Betriebszugehörigkeit: nach zwei Jahren auf einen Monat, nach fünf Jahren auf zwei Monate, nach acht Jahren auf drei Monate, jeweils zum Ende eines Kalendermonats. Für Kündigungen durch Beschäftigte bleibt es bei der Grundfrist, sofern der Arbeitsvertrag nichts anderes bestimmt. Der Vertrag darf für Beschäftigte jedoch keine längere Frist vorsehen als für den Arbeitgeber."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Im vierten Jahr sind mehr als zwei, aber weniger als fünf Jahre erreicht: Für den Arbeitgeber gilt ein Monat. Zwei Monate für den Beschäftigten wären länger und damit unzulässig.", "**II ist nicht ableitbar.** In der Probezeit gelten für beide Seiten zwei Wochen."]}, {"num": 5, "stem": [], "question": null, "statements": ["Senkt ein Anbieter bei unelastischer Nachfrage den Preis, steigt sein Umsatz.", "Steigt der Preis eines Gutes um 5 Prozent und sinkt die nachgefragte Menge daraufhin um 4 Prozent, ist die Nachfrage elastisch."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 3 · Aufgaben 5 und 6", "title": "Preiselastizität der Nachfrage", "paras": ["Die Preiselastizität der Nachfrage gibt an, um wie viel Prozent sich die nachgefragte Menge eines Gutes ändert, wenn sein Preis um ein Prozent steigt. Da die Menge bei steigendem Preis in der Regel sinkt, ist der Wert meist negativ; betrachtet wird daher häufig sein Betrag. Ist der Betrag größer als 1, spricht man von elastischer Nachfrage: Die Menge reagiert prozentual stärker als der Preis. Ist er kleiner als 1, heißt die Nachfrage unelastisch.", "Der Umsatz ist das Produkt aus Preis und Menge. Bei elastischer Nachfrage führt eine Preiserhöhung deshalb zu sinkendem Umsatz, bei unelastischer Nachfrage zu steigendem. Güter des täglichen Bedarfs, für die es kaum Ersatz gibt, weisen meist eine unelastische Nachfrage auf."]}, "answer": 3, "answer_label": "D (Keine)", "solution": ["**I ist nicht ableitbar.** Bei unelastischer Nachfrage reagiert die Menge prozentual schwächer als der Preis. Die Preissenkung wird durch den Mengenzuwachs nicht ausgeglichen, der Umsatz sinkt.", "**II ist nicht ableitbar.** Die Elastizität beträgt dem Betrag nach 4 : 5 = 0,8. Das ist kleiner als 1, die Nachfrage ist unelastisch."]}, {"num": 6, "stem": [], "question": null, "statements": ["Für jedes Gut des täglichen Bedarfs führt eine Preiserhöhung zu steigendem Umsatz.", "Reagiert die nachgefragte Menge überhaupt nicht auf den Preis, ist die Nachfrage nach der genannten Definition unelastisch."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 3 · Aufgaben 5 und 6", "title": "Preiselastizität der Nachfrage", "paras": ["Die Preiselastizität der Nachfrage gibt an, um wie viel Prozent sich die nachgefragte Menge eines Gutes ändert, wenn sein Preis um ein Prozent steigt. Da die Menge bei steigendem Preis in der Regel sinkt, ist der Wert meist negativ; betrachtet wird daher häufig sein Betrag. Ist der Betrag größer als 1, spricht man von elastischer Nachfrage: Die Menge reagiert prozentual stärker als der Preis. Ist er kleiner als 1, heißt die Nachfrage unelastisch.", "Der Umsatz ist das Produkt aus Preis und Menge. Bei elastischer Nachfrage führt eine Preiserhöhung deshalb zu sinkendem Umsatz, bei unelastischer Nachfrage zu steigendem. Güter des täglichen Bedarfs, für die es kaum Ersatz gibt, weisen meist eine unelastische Nachfrage auf."]}, "answer": 1, "answer_label": "B (Nur II)", "solution": ["**I ist nicht ableitbar.** Der Text sagt „meist“ und schränkt auf Güter ein, für die es kaum Ersatz gibt. Eine Aussage über jedes Gut des täglichen Bedarfs geht darüber hinaus.", "**II ist ableitbar.** Die Elastizität ist dann 0. Der Betrag ist kleiner als 1, damit ist die Definition der unelastischen Nachfrage erfüllt."]}, {"num": 7, "stem": [], "question": null, "statements": ["Geben Erwerbslose die Arbeitssuche entmutigt auf, sinkt die Erwerbslosenquote, obwohl niemand zusätzlich Arbeit gefunden hat.", "Die Erwerbstätigenquote kann nicht höher sein als die Erwerbsquote."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 4 · Aufgaben 7 und 8", "title": "Kennzahlen des Arbeitsmarkts", "paras": ["Die Bevölkerung im erwerbsfähigen Alter eines Landes lässt sich in drei Gruppen teilen: Erwerbstätige, Erwerbslose und Nichterwerbspersonen. Erwerbslos ist, wer keine Arbeit hat, aber aktiv eine sucht und kurzfristig verfügbar ist. Wer weder arbeitet noch sucht, etwa Studierende ohne Nebentätigkeit, zählt zu den Nichterwerbspersonen. Erwerbstätige und Erwerbslose bilden zusammen die Erwerbspersonen.", "Die Erwerbslosenquote ist der Anteil der Erwerbslosen an den Erwerbspersonen, die Erwerbsquote der Anteil der Erwerbspersonen an der Bevölkerung im erwerbsfähigen Alter. Die Erwerbstätigenquote schließlich setzt die Erwerbstätigen ins Verhältnis zur Bevölkerung im erwerbsfähigen Alter."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Wer nicht mehr sucht, wird zur Nichterwerbsperson. Zähler und Nenner der Quote sinken um dieselbe Zahl; bei einem Bruch kleiner als 1 wird der Wert dadurch kleiner. Beispiel: 10 von 100 werden zu 8 von 98.", "**II ist ableitbar.** Beide Quoten haben denselben Nenner. Im Zähler der Erwerbsquote stehen die Erwerbstätigen zuzüglich der Erwerbslosen, also mindestens so viele Personen."]}, {"num": 8, "stem": [], "question": null, "statements": ["Steigt die Erwerbslosenquote, so ist die Zahl der Erwerbstätigen gesunken.", "Nimmt ein Student, der bisher weder gearbeitet noch Arbeit gesucht hat, eine Stelle an, steigen Erwerbsquote und Erwerbstätigenquote."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 4 · Aufgaben 7 und 8", "title": "Kennzahlen des Arbeitsmarkts", "paras": ["Die Bevölkerung im erwerbsfähigen Alter eines Landes lässt sich in drei Gruppen teilen: Erwerbstätige, Erwerbslose und Nichterwerbspersonen. Erwerbslos ist, wer keine Arbeit hat, aber aktiv eine sucht und kurzfristig verfügbar ist. Wer weder arbeitet noch sucht, etwa Studierende ohne Nebentätigkeit, zählt zu den Nichterwerbspersonen. Erwerbstätige und Erwerbslose bilden zusammen die Erwerbspersonen.", "Die Erwerbslosenquote ist der Anteil der Erwerbslosen an den Erwerbspersonen, die Erwerbsquote der Anteil der Erwerbspersonen an der Bevölkerung im erwerbsfähigen Alter. Die Erwerbstätigenquote schließlich setzt die Erwerbstätigen ins Verhältnis zur Bevölkerung im erwerbsfähigen Alter."]}, "answer": 1, "answer_label": "B (Nur II)", "solution": ["**I ist nicht ableitbar.** Die Quote steigt auch dann, wenn bisherige Nichterwerbspersonen mit der Arbeitssuche beginnen. Die Zahl der Erwerbstätigen kann dabei gleich bleiben.", "**II ist ableitbar.** Er wechselt von den Nichterwerbspersonen zu den Erwerbstätigen. Die Zähler beider Quoten wachsen um eins, der gemeinsame Nenner bleibt gleich."]}, {"num": 9, "stem": [], "question": null, "statements": ["Im Beispiel ist der Restbuchwert nach zwei Jahren bei degressiver Abschreibung um 16 000 Euro niedriger als bei linearer.", "Im Beispiel ist der degressive Abschreibungsbetrag erstmals im vierten Jahr niedriger als der lineare."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 5 · Aufgaben 9 und 10", "title": "Abschreibung", "paras": ["Abnutzbare Anlagegüter verlieren über ihre Nutzungsdauer an Wert. Dieser Wertverlust wird als Abschreibung erfasst und mindert den Gewinn des jeweiligen Jahres. Bei der linearen Abschreibung werden die Anschaffungskosten gleichmäßig auf die Jahre der Nutzungsdauer verteilt; der jährliche Betrag bleibt also gleich. Bei der geometrisch-degressiven Abschreibung wird in jedem Jahr ein fester Prozentsatz vom jeweiligen Restbuchwert abgeschrieben, sodass die Beträge von Jahr zu Jahr sinken. Der Restbuchwert ist der Anschaffungswert abzüglich aller bisherigen Abschreibungen.", "Beispiel: Eine Maschine, die 100 000 Euro kostet und zehn Jahre genutzt wird, verliert linear jährlich 10 000 Euro, degressiv mit 20 Prozent im ersten Jahr 20 000 Euro und im zweiten Jahr 16 000 Euro."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Linear: 100 000 − 2 × 10 000 = 80 000 Euro. Degressiv: 100 000 − 20 000 − 16 000 = 64 000 Euro. Die Differenz beträgt 16 000 Euro.", "**II ist nicht ableitbar.** Die degressiven Beträge lauten 20 000, 16 000, 12 800, 10 240 und 8 192 Euro. Im vierten Jahr liegt der Betrag noch über 10 000 Euro, erst im fünften darunter."]}, {"num": 10, "stem": [], "question": null, "statements": ["Bei geometrisch-degressiver Abschreibung erreicht der Restbuchwert am Ende der Nutzungsdauer den Wert null.", "Wählt das Unternehmen im Beispiel die degressive statt der linearen Methode, fällt sein Gewinn im ersten Nutzungsjahr unter sonst gleichen Umständen um 10 000 Euro niedriger aus."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 5 · Aufgaben 9 und 10", "title": "Abschreibung", "paras": ["Abnutzbare Anlagegüter verlieren über ihre Nutzungsdauer an Wert. Dieser Wertverlust wird als Abschreibung erfasst und mindert den Gewinn des jeweiligen Jahres. Bei der linearen Abschreibung werden die Anschaffungskosten gleichmäßig auf die Jahre der Nutzungsdauer verteilt; der jährliche Betrag bleibt also gleich. Bei der geometrisch-degressiven Abschreibung wird in jedem Jahr ein fester Prozentsatz vom jeweiligen Restbuchwert abgeschrieben, sodass die Beträge von Jahr zu Jahr sinken. Der Restbuchwert ist der Anschaffungswert abzüglich aller bisherigen Abschreibungen.", "Beispiel: Eine Maschine, die 100 000 Euro kostet und zehn Jahre genutzt wird, verliert linear jährlich 10 000 Euro, degressiv mit 20 Prozent im ersten Jahr 20 000 Euro und im zweiten Jahr 16 000 Euro."]}, "answer": 1, "answer_label": "B (Nur II)", "solution": ["**I ist nicht ableitbar.** Abgeschrieben wird stets ein Prozentsatz des Restbuchwerts. Es bleibt deshalb immer ein Rest; im Beispiel sind nach jedem Jahr noch 80 Prozent des Vorjahreswerts vorhanden.", "**II ist ableitbar.** Die Abschreibung mindert den Gewinn. Im ersten Jahr stehen 20 000 Euro degressiv gegen 10 000 Euro linear."]}, {"num": 11, "stem": [], "question": null, "statements": ["Mindestens ein Viertel der Befragten liest sowohl Nachrichten im Internet als auch eine gedruckte Tageszeitung.", "60 Prozent der Befragten haben ein Digitalabonnement vor allem wegen der Lokalberichterstattung abgeschlossen."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 6 · Aufgaben 11 und 12", "title": "Mediennutzung", "paras": ["Eine Befragung unter 2 000 Erwachsenen eines Landes ergab: 80 Prozent der Befragten lesen mindestens einmal in der Woche Nachrichten im Internet, 45 Prozent lesen eine gedruckte Tageszeitung. 35 Prozent der Befragten haben ein kostenpflichtiges Digitalabonnement einer Zeitung; 60 Prozent dieser Abonnenten gaben an, das Abonnement vor allem wegen der Lokalberichterstattung abgeschlossen zu haben.", "Unter den Befragten bis 29 Jahre lesen 92 Prozent Nachrichten im Internet, unter den Befragten ab 60 Jahren 61 Prozent. In der Altersgruppe von 30 bis 59 Jahren liegt der Anteil zwischen diesen beiden Werten."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Mindestüberschneidung: 80 % + 45 % − 100 % = 25 %. Mindestens ein Viertel der Befragten tut beides.", "**II ist nicht ableitbar.** Die 60 Prozent beziehen sich auf die Abonnenten, nicht auf alle Befragten. Bezogen auf alle Befragten sind es 0,6 × 35 % = 21 %."]}, {"num": 12, "stem": [], "question": null, "statements": ["In der Altersgruppe von 30 bis 59 Jahren lesen mehr als 80 Prozent der Befragten Nachrichten im Internet.", "Mehr als 450 Befragte haben ihr Digitalabonnement vor allem wegen der Lokalberichterstattung abgeschlossen."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 6 · Aufgaben 11 und 12", "title": "Mediennutzung", "paras": ["Eine Befragung unter 2 000 Erwachsenen eines Landes ergab: 80 Prozent der Befragten lesen mindestens einmal in der Woche Nachrichten im Internet, 45 Prozent lesen eine gedruckte Tageszeitung. 35 Prozent der Befragten haben ein kostenpflichtiges Digitalabonnement einer Zeitung; 60 Prozent dieser Abonnenten gaben an, das Abonnement vor allem wegen der Lokalberichterstattung abgeschlossen zu haben.", "Unter den Befragten bis 29 Jahre lesen 92 Prozent Nachrichten im Internet, unter den Befragten ab 60 Jahren 61 Prozent. In der Altersgruppe von 30 bis 59 Jahren liegt der Anteil zwischen diesen beiden Werten."]}, "answer": 3, "answer_label": "D (Keine)", "solution": ["**I ist nicht ableitbar.** Bekannt ist nur, dass der Anteil zwischen 61 und 92 Prozent liegt. Ob er über dem Gesamtwert von 80 Prozent liegt, hängt davon ab, wie groß die drei Altersgruppen sind; das nennt der Text nicht. Ein Durchschnittsargument greift hier nicht, weil eine Gruppe über und eine unter dem Gesamtwert liegt.", "**II ist nicht ableitbar.** 35 % von 2 000 sind 700 Abonnenten, davon 60 %: 420 Personen. Das sind weniger als 450."]}, {"num": 13, "stem": [], "question": null, "statements": ["Bei einem tatsächlichen Kurs von 2 Kronen je Taler gilt der Taler als überbewertet.", "Steigt der Preis des Warenkorbs im Ausland auf 300 Kronen, während er im Inland unverändert bleibt, sinkt der Paritätskurs."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 7 · Aufgaben 13 und 14", "title": "Kaufkraftparität", "paras": ["Der nominale Wechselkurs gibt an, wie viele Einheiten einer Fremdwährung man für eine Einheit der eigenen Währung erhält. Nach der Theorie der Kaufkraftparität pendelt er sich langfristig so ein, dass ein bestimmter Warenkorb in beiden Ländern, in dieselbe Währung umgerechnet, gleich viel kostet. Kostet der Warenkorb im Inland 100 Taler und im Ausland 250 Kronen, läge der Paritätskurs demnach bei 2,5 Kronen je Taler.", "Liegt der tatsächliche Kurs darüber, gilt der Taler als überbewertet: Wer Taler tauscht, kann im Ausland mehr kaufen als zu Hause. Liegt er darunter, gilt der Taler als unterbewertet. Steigen die Preise im Ausland schneller als im Inland, müsste der Taler nach dieser Theorie auf lange Sicht gegenüber der Krone an Wert gewinnen."]}, "answer": 3, "answer_label": "D (Keine)", "solution": ["**I ist nicht ableitbar.** 2 Kronen je Taler liegen unter dem Paritätskurs von 2,5. Der Taler gilt damit als unterbewertet.", "**II ist nicht ableitbar.** Der Paritätskurs ist der Quotient der Preise: 300 : 100 = 3 Kronen je Taler. Er steigt, was auch zum letzten Satz des Textes passt."]}, {"num": 14, "stem": [], "question": null, "statements": ["Ist der Taler überbewertet, kostet der Warenkorb im Ausland, in Taler umgerechnet, weniger als im Inland.", "Nach der Theorie der Kaufkraftparität entspricht der tatsächliche Kurs zu jedem Zeitpunkt dem Paritätskurs."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 7 · Aufgaben 13 und 14", "title": "Kaufkraftparität", "paras": ["Der nominale Wechselkurs gibt an, wie viele Einheiten einer Fremdwährung man für eine Einheit der eigenen Währung erhält. Nach der Theorie der Kaufkraftparität pendelt er sich langfristig so ein, dass ein bestimmter Warenkorb in beiden Ländern, in dieselbe Währung umgerechnet, gleich viel kostet. Kostet der Warenkorb im Inland 100 Taler und im Ausland 250 Kronen, läge der Paritätskurs demnach bei 2,5 Kronen je Taler.", "Liegt der tatsächliche Kurs darüber, gilt der Taler als überbewertet: Wer Taler tauscht, kann im Ausland mehr kaufen als zu Hause. Liegt er darunter, gilt der Taler als unterbewertet. Steigen die Preise im Ausland schneller als im Inland, müsste der Taler nach dieser Theorie auf lange Sicht gegenüber der Krone an Wert gewinnen."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Überbewertung heißt: Der Kurs liegt über 2,5 Kronen je Taler. Bei 3 Kronen je Taler kosten 250 Kronen nur rund 83 Taler statt 100. Der Text sagt dasselbe in Worten.", "**II ist nicht ableitbar.** Der Text spricht von einem langfristigen Einpendeln und beschreibt ausdrücklich Abweichungen (Über- und Unterbewertung)."]}, {"num": 15, "stem": [], "question": null, "statements": ["Verdoppelt sich bei sonst unveränderten Einkommen das Einkommen der reichsten Person, ändert sich die Zahl der Armutsgefährdeten nicht.", "Liegt das arithmetische Mittel über dem Median, verdient mindestens die Hälfte der Personen weniger als das arithmetische Mittel."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 8 · Aufgabe 15", "title": "Mittelwert und Median", "paras": ["Zur Beschreibung von Einkommensverteilungen werden zwei Kennwerte verwendet. Das arithmetische Mittel ist die Summe aller Einkommen, geteilt durch die Zahl der Personen. Der Median ist das Einkommen jener Person, die genau in der Mitte steht, wenn man alle Personen nach der Höhe ihres Einkommens ordnet; die eine Hälfte verdient höchstens so viel, die andere mindestens so viel. Sehr hohe Einzeleinkommen ziehen das arithmetische Mittel nach oben, lassen den Median jedoch unberührt. Als armutsgefährdet gilt in vielen Statistiken, wer weniger als 60 Prozent des Medianeinkommens zur Verfügung hat."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Der Median bleibt unberührt, damit auch die Schwelle von 60 Prozent des Medians. Die Einkommen aller übrigen Personen sind unverändert, also auch ihre Lage zur Schwelle.", "**II ist ableitbar.** Die eine Hälfte verdient höchstens den Median. Liegt das Mittel darüber, verdient diese Hälfte weniger als das Mittel."]}]}, {"name": "Übungstest 2", "level": "Niveau der Probetests, mehr Kennzahlen und Rechnungen", "minutes": 30, "intro": "Welche der folgenden Aussagen lässt bzw. lassen sich aus den Informationen des jeweiligen Textes ableiten?", "items": [{"num": 1, "stem": [], "question": null, "statements": ["Ein Unternehmen mit 400 000 Euro Eigenkapital, 600 000 Euro Fremdkapital zu 6 Prozent Zins und einer Gesamtkapitalrentabilität von 10 Prozent erzielt eine Eigenkapitalrentabilität von 16 Prozent.", "Ein Unternehmen ohne Fremdkapital hat eine Eigenkapitalrentabilität, die seiner Gesamtkapitalrentabilität entspricht."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 1 · Aufgaben 1 und 2", "title": "Leverage-Effekt", "paras": ["Unternehmen finanzieren ihre Investitionen mit Eigenkapital und Fremdkapital. Die Gesamtkapitalrentabilität setzt den Gewinn vor Abzug der Fremdkapitalzinsen ins Verhältnis zum gesamten eingesetzten Kapital. Die Eigenkapitalrentabilität bezieht dagegen den Gewinn nach Abzug der Zinsen auf das Eigenkapital.", "Liegt die Gesamtkapitalrentabilität über dem Zinssatz für Fremdkapital, erhöht jeder zusätzlich aufgenommene Kredit die Eigenkapitalrentabilität, weil das geliehene Geld mehr einbringt, als es kostet. Diesen Zusammenhang nennt man Leverage-Effekt. Er wirkt in beide Richtungen: Sinkt die Gesamtkapitalrentabilität unter den Fremdkapitalzins, schmälert die Verschuldung die Eigenkapitalrentabilität umso stärker, je höher der Anteil des Fremdkapitals ist. Als Verschuldungsgrad bezeichnet man das Verhältnis von Fremdkapital zu Eigenkapital."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Gewinn vor Zinsen: 10 Prozent von 1 000 000 Euro = 100 000 Euro. Zinsen: 6 Prozent von 600 000 Euro = 36 000 Euro. Es bleiben 64 000 Euro, bezogen auf 400 000 Euro Eigenkapital sind das 16 Prozent.", "**II ist ableitbar.** Ohne Fremdkapital fallen keine Zinsen an, und Eigenkapital und Gesamtkapital sind identisch. Zähler und Nenner beider Kennzahlen stimmen überein."]}, {"num": 2, "stem": [], "question": null, "statements": ["Ein höherer Verschuldungsgrad geht stets mit einer höheren Eigenkapitalrentabilität einher.", "Entspricht die Gesamtkapitalrentabilität genau dem Fremdkapitalzins, verändert die Aufnahme weiterer Kredite die Eigenkapitalrentabilität nicht."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 1 · Aufgaben 1 und 2", "title": "Leverage-Effekt", "paras": ["Unternehmen finanzieren ihre Investitionen mit Eigenkapital und Fremdkapital. Die Gesamtkapitalrentabilität setzt den Gewinn vor Abzug der Fremdkapitalzinsen ins Verhältnis zum gesamten eingesetzten Kapital. Die Eigenkapitalrentabilität bezieht dagegen den Gewinn nach Abzug der Zinsen auf das Eigenkapital.", "Liegt die Gesamtkapitalrentabilität über dem Zinssatz für Fremdkapital, erhöht jeder zusätzlich aufgenommene Kredit die Eigenkapitalrentabilität, weil das geliehene Geld mehr einbringt, als es kostet. Diesen Zusammenhang nennt man Leverage-Effekt. Er wirkt in beide Richtungen: Sinkt die Gesamtkapitalrentabilität unter den Fremdkapitalzins, schmälert die Verschuldung die Eigenkapitalrentabilität umso stärker, je höher der Anteil des Fremdkapitals ist. Als Verschuldungsgrad bezeichnet man das Verhältnis von Fremdkapital zu Eigenkapital."]}, "answer": 1, "answer_label": "B (Nur II)", "solution": ["**I ist nicht ableitbar.** Das gilt nur, solange die Gesamtkapitalrentabilität über dem Fremdkapitalzins liegt. Im umgekehrten Fall drückt die Verschuldung die Eigenkapitalrentabilität.", "**II ist ableitbar.** Das geliehene Geld bringt dann genau so viel ein, wie es kostet. Der Gewinn nach Zinsen bleibt gleich, das Eigenkapital ebenfalls. Rechnerisch: Bei 8 Prozent Rendite und 8 Prozent Zins bleibt die Eigenkapitalrentabilität bei jeder Kredithöhe 8 Prozent."]}, {"num": 3, "stem": [], "question": null, "statements": ["Bei einem Monatsumsatz von 120 000 Euro beträgt die Vergütung ohne Prämie 6 200 Euro.", "Ein Mitarbeiter, der seinen Monatsumsatz von 40 000 auf 80 000 Euro verdoppelt, verdoppelt damit auch seine Provision."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 2 · Aufgaben 3 und 4", "title": "Provisionsmodell", "paras": ["Ein Handelsunternehmen vergütet seine Außendienstmitarbeiter nach folgendem Modell: Jeder erhält ein monatliches Fixum von 2 000 Euro. Hinzu kommt eine Provision auf den selbst erzielten Monatsumsatz. Sie beträgt 2 Prozent für den Teil des Umsatzes bis 50 000 Euro, 4 Prozent für den Teil zwischen 50 000 und 100 000 Euro und 6 Prozent für jeden Euro darüber.", "Wer in drei aufeinanderfolgenden Monaten jeweils mehr als 100 000 Euro umsetzt, bekommt im dritten Monat zusätzlich eine Prämie von 1 500 Euro. Umsätze, die ein Kunde innerhalb von 30 Tagen storniert, werden im Monat der Stornierung vom Umsatz abgezogen. Die Provision eines Monats kann nicht negativ werden."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Provision: 2 Prozent von 50 000 = 1 000 Euro, 4 Prozent von 50 000 = 2 000 Euro, 6 Prozent von 20 000 = 1 200 Euro, zusammen 4 200 Euro. Mit dem Fixum von 2 000 Euro ergeben sich 6 200 Euro.", "**II ist nicht ableitbar.** Bei 40 000 Euro beträgt die Provision 800 Euro, bei 80 000 Euro sind es 1 000 + 1 200 = 2 200 Euro. Sie steigt auf mehr als das Doppelte."]}, {"num": 4, "stem": [], "question": null, "statements": ["Setzen zwei Mitarbeiter zusammen 200 000 Euro um, ist die Summe ihrer Provisionen am höchsten, wenn jeder genau 100 000 Euro umsetzt.", "Wird ein Umsatz von 30 000 Euro aus dem Januar im Februar storniert, mindert das nachträglich die Provision für den Januar."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 2 · Aufgaben 3 und 4", "title": "Provisionsmodell", "paras": ["Ein Handelsunternehmen vergütet seine Außendienstmitarbeiter nach folgendem Modell: Jeder erhält ein monatliches Fixum von 2 000 Euro. Hinzu kommt eine Provision auf den selbst erzielten Monatsumsatz. Sie beträgt 2 Prozent für den Teil des Umsatzes bis 50 000 Euro, 4 Prozent für den Teil zwischen 50 000 und 100 000 Euro und 6 Prozent für jeden Euro darüber.", "Wer in drei aufeinanderfolgenden Monaten jeweils mehr als 100 000 Euro umsetzt, bekommt im dritten Monat zusätzlich eine Prämie von 1 500 Euro. Umsätze, die ein Kunde innerhalb von 30 Tagen storniert, werden im Monat der Stornierung vom Umsatz abgezogen. Die Provision eines Monats kann nicht negativ werden."]}, "answer": 3, "answer_label": "D (Keine)", "solution": ["**I ist nicht ableitbar.** Weil die Sätze mit dem Umsatz steigen, bringt eine ungleiche Verteilung mehr: Zweimal 100 000 Euro ergeben 2 × 3 000 = 6 000 Euro, 200 000 und 0 Euro dagegen 9 000 Euro.", "**II ist nicht ableitbar.** Der stornierte Umsatz wird im Monat der Stornierung abgezogen, hier also im Februar. Die Januar-Provision bleibt unberührt."]}, {"num": 5, "stem": [], "question": null, "statements": ["Die Opportunitätskosten einer Einheit Wein betragen in Nordland zwei Einheiten Tuch.", "Südland hat einen komparativen Vorteil bei Wein."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 3 · Aufgaben 5 und 6", "title": "Komparativer Vorteil", "paras": ["Zwei Länder, Nordland und Südland, können jeweils Tuch und Wein herstellen; Arbeit ist der einzige Produktionsfaktor. In Nordland benötigt man für eine Einheit Tuch 2 Arbeitsstunden und für eine Einheit Wein 4 Arbeitsstunden. In Südland sind es 6 Stunden für Tuch und 6 Stunden für Wein. Nordland ist damit bei beiden Gütern produktiver, es besitzt einen absoluten Vorteil.", "Für den Handel entscheidend sind jedoch die Opportunitätskosten: die Menge des anderen Gutes, auf die ein Land verzichten muss, um eine zusätzliche Einheit eines Gutes herzustellen. Ein Land hat einen komparativen Vorteil bei dem Gut, das es zu geringeren Opportunitätskosten herstellt als das andere Land. Spezialisiert sich jedes Land auf dieses Gut und tauscht, können beide mehr konsumieren als ohne Handel."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Eine Einheit Wein bindet in Nordland 4 Arbeitsstunden. In dieser Zeit ließen sich 4 : 2 = 2 Einheiten Tuch herstellen.", "**II ist ableitbar.** In Südland kostet eine Einheit Wein den Verzicht auf eine Einheit Tuch (6 : 6), in Nordland auf zwei. Südland stellt Wein zu geringeren Opportunitätskosten her."]}, {"num": 6, "stem": [], "question": null, "statements": ["Da Nordland bei beiden Gütern produktiver ist, kann es vom Handel mit Südland nicht profitieren.", "Bei einem Tauschverhältnis von 1,5 Einheiten Tuch je Einheit Wein erhält jedes Land das eingetauschte Gut günstiger, als es dieses selbst herstellen könnte."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 3 · Aufgaben 5 und 6", "title": "Komparativer Vorteil", "paras": ["Zwei Länder, Nordland und Südland, können jeweils Tuch und Wein herstellen; Arbeit ist der einzige Produktionsfaktor. In Nordland benötigt man für eine Einheit Tuch 2 Arbeitsstunden und für eine Einheit Wein 4 Arbeitsstunden. In Südland sind es 6 Stunden für Tuch und 6 Stunden für Wein. Nordland ist damit bei beiden Gütern produktiver, es besitzt einen absoluten Vorteil.", "Für den Handel entscheidend sind jedoch die Opportunitätskosten: die Menge des anderen Gutes, auf die ein Land verzichten muss, um eine zusätzliche Einheit eines Gutes herzustellen. Ein Land hat einen komparativen Vorteil bei dem Gut, das es zu geringeren Opportunitätskosten herstellt als das andere Land. Spezialisiert sich jedes Land auf dieses Gut und tauscht, können beide mehr konsumieren als ohne Handel."]}, "answer": 1, "answer_label": "B (Nur II)", "solution": ["**I ist nicht ableitbar.** Der Text sagt das Gegenteil: Maßgeblich sind die Opportunitätskosten, und bei Spezialisierung können beide Länder mehr konsumieren.", "**II ist ableitbar.** Nordland zahlt für eine Einheit Wein 1,5 Einheiten Tuch statt 2 bei Eigenherstellung. Südland erhält für eine Einheit Wein 1,5 Einheiten Tuch statt 1 bei Eigenherstellung."]}, {"num": 7, "stem": [], "question": null, "statements": ["Die Liquidität dritten Grades eines Unternehmens ist nie niedriger als seine Liquidität ersten Grades.", "Bezahlt ein Kunde eine kurzfristige Forderung per Überweisung, steigt die Liquidität ersten Grades, während die Liquidität zweiten Grades unverändert bleibt."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 4 · Aufgaben 7 und 8", "title": "Liquiditätsgrade", "paras": ["Die Zahlungsfähigkeit eines Unternehmens wird häufig anhand von Liquiditätsgraden beurteilt. Die Liquidität ersten Grades setzt die flüssigen Mittel (Kasse und Bankguthaben) ins Verhältnis zu den kurzfristigen Verbindlichkeiten. Bei der Liquidität zweiten Grades werden im Zähler zusätzlich die kurzfristigen Forderungen berücksichtigt, bei der Liquidität dritten Grades außerdem die Vorräte. Flüssige Mittel, kurzfristige Forderungen und Vorräte bilden zusammen das Umlaufvermögen.", "Als Faustregel gilt, dass die Liquidität zweiten Grades mindestens 100 Prozent und die Liquidität dritten Grades mindestens 200 Prozent betragen sollte. Das Nettoumlaufvermögen (Working Capital) ist die Differenz aus Umlaufvermögen und kurzfristigen Verbindlichkeiten."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Der Nenner ist bei allen drei Graden gleich. Der Zähler des dritten Grades enthält die flüssigen Mittel und zusätzlich Forderungen und Vorräte.", "**II ist ableitbar.** Die Forderung wird zu Bankguthaben. Die flüssigen Mittel wachsen, die Summe aus flüssigen Mitteln und Forderungen bleibt gleich."]}, {"num": 8, "stem": [], "question": null, "statements": ["Ist das Nettoumlaufvermögen positiv, liegt die Liquidität dritten Grades über 100 Prozent.", "Erfüllt ein Unternehmen die Faustregel für die Liquidität dritten Grades, erfüllt es auch die Faustregel für die Liquidität zweiten Grades."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 4 · Aufgaben 7 und 8", "title": "Liquiditätsgrade", "paras": ["Die Zahlungsfähigkeit eines Unternehmens wird häufig anhand von Liquiditätsgraden beurteilt. Die Liquidität ersten Grades setzt die flüssigen Mittel (Kasse und Bankguthaben) ins Verhältnis zu den kurzfristigen Verbindlichkeiten. Bei der Liquidität zweiten Grades werden im Zähler zusätzlich die kurzfristigen Forderungen berücksichtigt, bei der Liquidität dritten Grades außerdem die Vorräte. Flüssige Mittel, kurzfristige Forderungen und Vorräte bilden zusammen das Umlaufvermögen.", "Als Faustregel gilt, dass die Liquidität zweiten Grades mindestens 100 Prozent und die Liquidität dritten Grades mindestens 200 Prozent betragen sollte. Das Nettoumlaufvermögen (Working Capital) ist die Differenz aus Umlaufvermögen und kurzfristigen Verbindlichkeiten."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Positives Nettoumlaufvermögen heißt: Umlaufvermögen größer als kurzfristige Verbindlichkeiten. Der Quotient aus beiden, die Liquidität dritten Grades, ist dann größer als 1.", "**II ist nicht ableitbar.** Gegenbeispiel: Vorräte 180, Forderungen 15, flüssige Mittel 5, kurzfristige Verbindlichkeiten 100. Der dritte Grad beträgt 200 Prozent, der zweite nur 20 Prozent."]}, {"num": 9, "stem": [], "question": null, "statements": ["Bei einem Einkommen von 50 000 Dukaten beträgt der Durchschnittssteuersatz 30 Prozent.", "Wer durch eine Gehaltserhöhung die Grenze von 60 000 Dukaten überschreitet, kann danach nach Steuern weniger haben als zuvor."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 5 · Aufgaben 9 und 10", "title": "Stufentarif", "paras": ["In einem Staat wird das Jahreseinkommen nach einem Stufentarif besteuert. Die ersten 10 000 Dukaten bleiben steuerfrei. Der Teil des Einkommens zwischen 10 000 und 30 000 Dukaten wird mit 20 Prozent besteuert, der Teil zwischen 30 000 und 60 000 Dukaten mit 30 Prozent und jeder darüber hinausgehende Dukat mit 40 Prozent.", "Der Grenzsteuersatz ist der Satz, mit dem der zuletzt verdiente Dukat belastet wird. Der Durchschnittssteuersatz ist die gesamte Steuerschuld, geteilt durch das gesamte Einkommen. Ein Tarif heißt progressiv, wenn der Durchschnittssteuersatz mit dem Einkommen steigt."]}, "answer": 3, "answer_label": "D (Keine)", "solution": ["**I ist nicht ableitbar.** Steuerschuld: 20 Prozent von 20 000 = 4 000 und 30 Prozent von 20 000 = 6 000, zusammen 10 000 Dukaten. Das sind 20 Prozent des Einkommens. 30 Prozent ist der Grenzsteuersatz.", "**II ist nicht ableitbar.** Der höhere Satz trifft nur den Teil oberhalb der Grenze. Von jedem zusätzlichen Dukaten bleiben mindestens 60 Prozent übrig."]}, {"num": 10, "stem": [], "question": null, "statements": ["Verdoppelt sich ein Einkommen von 30 000 auf 60 000 Dukaten, verdoppelt sich auch die Steuerschuld.", "Der Durchschnittssteuersatz liegt bei jedem Einkommen über 10 000 Dukaten unter dem Grenzsteuersatz."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 5 · Aufgaben 9 und 10", "title": "Stufentarif", "paras": ["In einem Staat wird das Jahreseinkommen nach einem Stufentarif besteuert. Die ersten 10 000 Dukaten bleiben steuerfrei. Der Teil des Einkommens zwischen 10 000 und 30 000 Dukaten wird mit 20 Prozent besteuert, der Teil zwischen 30 000 und 60 000 Dukaten mit 30 Prozent und jeder darüber hinausgehende Dukat mit 40 Prozent.", "Der Grenzsteuersatz ist der Satz, mit dem der zuletzt verdiente Dukat belastet wird. Der Durchschnittssteuersatz ist die gesamte Steuerschuld, geteilt durch das gesamte Einkommen. Ein Tarif heißt progressiv, wenn der Durchschnittssteuersatz mit dem Einkommen steigt."]}, "answer": 1, "answer_label": "B (Nur II)", "solution": ["**I ist nicht ableitbar.** Bei 30 000 Dukaten beträgt die Steuer 4 000, bei 60 000 Dukaten 4 000 + 9 000 = 13 000. Sie steigt auf mehr als das Dreifache.", "**II ist ableitbar.** Der Durchschnitt mischt den aktuellen Grenzsatz mit den niedrigeren Sätzen der unteren Stufen, darunter die steuerfreien ersten 10 000 Dukaten. Ein solcher Durchschnitt liegt immer unter dem höchsten beteiligten Satz."]}, {"num": 11, "stem": [], "question": null, "statements": ["Zwischen 6 und 9 Uhr befördern die Schiffe von Altdorf nach Brandt mehr als dreimal so viele Fahrgäste wie zwischen 9 und 16 Uhr.", "Wer um 9.05 Uhr am Anleger in Altdorf ankommt, erreicht Brandt frühestens um 10.25 Uhr."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 6 · Aufgaben 11 und 12", "title": "Fährverbindung", "paras": ["Eine Fähre verbindet die Orte Altdorf und Brandt über einen See; die Überfahrt dauert 25 Minuten. Werktags fahren in jede Richtung zwischen 6 und 9 Uhr alle 30 Minuten Schiffe mit 180 Plätzen, zwischen 9 und 16 Uhr stündlich Schiffe mit 120 Plätzen und zwischen 16 und 19 Uhr wieder alle 30 Minuten Schiffe mit 180 Plätzen. Die erste Abfahrt eines Zeitraums liegt jeweils zur vollen Stunde an seinem Beginn, die letzte vor seinem Ende.", "Zwischen 6 und 9 Uhr sind die Schiffe von Altdorf nach Brandt im Durchschnitt zu 90 Prozent ausgelastet, zwischen 9 und 16 Uhr die Schiffe beider Richtungen zu 40 Prozent und zwischen 16 und 19 Uhr die Schiffe von Brandt nach Altdorf zu 85 Prozent."]}, "answer": 1, "answer_label": "B (Nur II)", "solution": ["**I ist nicht ableitbar.** Morgens: 6 Abfahrten (6.00 bis 8.30 Uhr) × 180 Plätze × 0,9 = 972 Fahrgäste. Tagsüber: 7 Abfahrten (9.00 bis 15.00 Uhr) × 120 × 0,4 = 336 Fahrgäste. 972 : 336 ≈ 2,9; das ist weniger als das Dreifache.", "**II ist ableitbar.** Ab 9 Uhr fahren die Schiffe stündlich zur vollen Stunde. Das nächste Schiff legt um 10.00 Uhr ab und ist 25 Minuten später in Brandt."]}, {"num": 12, "stem": [], "question": null, "statements": ["Führen zwischen 9 und 16 Uhr die Schiffe von Altdorf nach Brandt nur noch alle zwei Stunden, reichten die Plätze für die durchschnittliche Zahl der Fahrgäste dieses Zeitraums aus.", "Zwischen 16 und 19 Uhr sind die Schiffe von Altdorf nach Brandt zu mindestens 85 Prozent ausgelastet."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 6 · Aufgaben 11 und 12", "title": "Fährverbindung", "paras": ["Eine Fähre verbindet die Orte Altdorf und Brandt über einen See; die Überfahrt dauert 25 Minuten. Werktags fahren in jede Richtung zwischen 6 und 9 Uhr alle 30 Minuten Schiffe mit 180 Plätzen, zwischen 9 und 16 Uhr stündlich Schiffe mit 120 Plätzen und zwischen 16 und 19 Uhr wieder alle 30 Minuten Schiffe mit 180 Plätzen. Die erste Abfahrt eines Zeitraums liegt jeweils zur vollen Stunde an seinem Beginn, die letzte vor seinem Ende.", "Zwischen 6 und 9 Uhr sind die Schiffe von Altdorf nach Brandt im Durchschnitt zu 90 Prozent ausgelastet, zwischen 9 und 16 Uhr die Schiffe beider Richtungen zu 40 Prozent und zwischen 16 und 19 Uhr die Schiffe von Brandt nach Altdorf zu 85 Prozent."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Abfahrten um 9, 11, 13 und 15 Uhr: 4 × 120 = 480 Plätze für durchschnittlich 336 Fahrgäste.", "**II ist nicht ableitbar.** Die 85 Prozent nennt der Text nur für die Gegenrichtung, von Brandt nach Altdorf. Für die Richtung nach Brandt fehlt am Abend jede Angabe."]}, {"num": 13, "stem": [], "question": null, "statements": ["Nach der genannten Näherung entspricht die Bedingung „3 Prozent Skonto innerhalb von 10 Tagen, sonst 40 Tage netto“ einem Jahreszins von 36 Prozent.", "Je länger das Zahlungsziel bei unveränderter Skontofrist und unverändertem Skontosatz ist, desto niedriger ist der nach der Näherung berechnete Jahreszins."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 7 · Aufgaben 13 und 14", "title": "Skonto", "paras": ["Lieferanten räumen ihren Kunden häufig ein Zahlungsziel ein, etwa 30 Tage ab Rechnungsdatum. Wer früher zahlt, darf vom Rechnungsbetrag einen prozentualen Abzug vornehmen, das Skonto. Lautet die Bedingung „2 Prozent Skonto bei Zahlung innerhalb von 10 Tagen, sonst 30 Tage netto“, verzichtet ein Kunde, der erst am 30. Tag zahlt, auf 2 Prozent, um den Betrag 20 Tage länger behalten zu können.", "Dieser Lieferantenkredit ist teuer: Auf ein Jahr mit 360 Tagen hochgerechnet entspricht der Verzicht näherungsweise einem Zinssatz von 2 Prozent mal 360 geteilt durch 20, also 36 Prozent. Es lohnt sich deshalb in der Regel, das Skonto auszunutzen, selbst wenn dafür ein Bankkredit aufgenommen werden muss."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Der Kredit läuft 40 − 10 = 30 Tage. 3 Prozent × 360 : 30 = 36 Prozent.", "**II ist ableitbar.** Ein längeres Zahlungsziel vergrößert die Kreditdauer im Nenner. Der Quotient wird kleiner."]}, {"num": 14, "stem": [], "question": null, "statements": ["Wer bei den im Text genannten Bedingungen am 20. Tag zahlt, darf 1 Prozent Skonto abziehen.", "Kostet ein Bankkredit 12 Prozent im Jahr, ist es bei den im Text genannten Bedingungen günstiger, auf das Skonto zu verzichten."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 7 · Aufgaben 13 und 14", "title": "Skonto", "paras": ["Lieferanten räumen ihren Kunden häufig ein Zahlungsziel ein, etwa 30 Tage ab Rechnungsdatum. Wer früher zahlt, darf vom Rechnungsbetrag einen prozentualen Abzug vornehmen, das Skonto. Lautet die Bedingung „2 Prozent Skonto bei Zahlung innerhalb von 10 Tagen, sonst 30 Tage netto“, verzichtet ein Kunde, der erst am 30. Tag zahlt, auf 2 Prozent, um den Betrag 20 Tage länger behalten zu können.", "Dieser Lieferantenkredit ist teuer: Auf ein Jahr mit 360 Tagen hochgerechnet entspricht der Verzicht näherungsweise einem Zinssatz von 2 Prozent mal 360 geteilt durch 20, also 36 Prozent. Es lohnt sich deshalb in der Regel, das Skonto auszunutzen, selbst wenn dafür ein Bankkredit aufgenommen werden muss."]}, "answer": 3, "answer_label": "D (Keine)", "solution": ["**I ist nicht ableitbar.** Das Skonto gibt es nur bei Zahlung innerhalb von 10 Tagen. Eine Staffelung nennt der Text nicht.", "**II ist nicht ableitbar.** Der Verzicht entspricht rund 36 Prozent Jahreszins. Der Bankkredit zu 12 Prozent ist deutlich billiger, das Skonto sollte also genutzt werden."]}, {"num": 15, "stem": [], "question": null, "statements": ["Hebt die Bank bei denselben Anträgen die Schwelle an, sinkt die Gesamtzahl der Fehler.", "Senkt die Bank bei denselben Anträgen die Schwelle, kann die Zahl der Fehler A nicht steigen."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 8 · Aufgabe 15", "title": "Kreditprüfung", "paras": ["Eine Bank prüft Kreditanträge mit einem Punktwertverfahren. Anträge, deren Punktwert unter einer festgelegten Schwelle liegt, werden abgelehnt. Zwei Fehler sind möglich: Ein Antragsteller, der den Kredit zurückgezahlt hätte, wird abgelehnt (Fehler A), oder ein Antragsteller, der später ausfällt, wird angenommen (Fehler B). Hebt die Bank die Schwelle an, werden bei denselben Anträgen mehr oder gleich viele Anträge abgelehnt."]}, "answer": 1, "answer_label": "B (Nur II)", "solution": ["**I ist nicht ableitbar.** Eine höhere Schwelle kann Fehler B vermeiden, erzeugt aber womöglich neue Fehler A. Wie sich die Summe verändert, lässt der Text offen.", "**II ist ableitbar.** Bei niedrigerer Schwelle wird niemand zusätzlich abgelehnt. Fehler A setzt eine Ablehnung voraus, neue Fehler dieser Art können daher nicht entstehen."]}]}, {"name": "Übungstest 3", "level": "Über dem Niveau der Probetests, mehr Rechen- und Regelaussagen", "minutes": 30, "intro": "Welche der folgenden Aussagen lässt bzw. lassen sich aus den Informationen des jeweiligen Textes ableiten?", "items": [{"num": 1, "stem": [], "question": null, "statements": ["Erhalten die gewöhnlichen Gläubiger eine Quote von weniger als 100 Prozent, gehen die Gesellschafter mit ihren Darlehen leer aus.", "Ein Pfandgläubiger erhält seine Forderung in jedem Fall vollständig."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 1 · Aufgaben 1 und 2", "title": "Rangfolge in der Insolvenz", "paras": ["Wird über das Vermögen eines Unternehmens ein Insolvenzverfahren eröffnet, wird der Erlös aus der Verwertung in einem Land nach folgender Rangfolge verteilt: Zuerst werden die Kosten des Verfahrens beglichen. Danach erhalten Gläubiger mit einem Pfandrecht den Erlös aus dem jeweils verpfändeten Gegenstand, höchstens jedoch den Betrag ihrer Forderung; ein Überschuss fließt in die allgemeine Masse, ein nicht gedeckter Rest wird als gewöhnliche Forderung behandelt.", "Aus der allgemeinen Masse werden anschließend rückständige Löhne der letzten drei Monate vollständig bezahlt. Der verbleibende Betrag wird auf die gewöhnlichen Forderungen im Verhältnis ihrer Höhe verteilt; der Anteil, den jeder gewöhnliche Gläubiger von seiner Forderung erhält, heißt Quote. Nachrangige Forderungen, etwa Darlehen von Gesellschaftern, werden erst bedient, wenn alle gewöhnlichen Forderungen vollständig erfüllt sind."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Nachrangige Forderungen werden erst bedient, wenn die gewöhnlichen vollständig erfüllt sind. Bei einer Quote unter 100 Prozent ist das nicht der Fall.", "**II ist nicht ableitbar.** Reicht der Erlös des Pfandgegenstands nicht, wird der Rest als gewöhnliche Forderung behandelt und nur nach Quote bedient."]}, {"num": 2, "stem": [], "question": null, "statements": ["Stehen nach Begleichung der Verfahrenskosten 300 000 Euro in der allgemeinen Masse, betragen die Lohnrückstände der letzten drei Monate 60 000 Euro und die gewöhnlichen Forderungen zusammen 800 000 Euro, liegt die Quote bei 30 Prozent.", "Bringt ein verpfändeter Gegenstand weniger ein als die gesicherte Forderung, nimmt der Pfandgläubiger mit dem Rest an der Verteilung nach Quote teil."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 1 · Aufgaben 1 und 2", "title": "Rangfolge in der Insolvenz", "paras": ["Wird über das Vermögen eines Unternehmens ein Insolvenzverfahren eröffnet, wird der Erlös aus der Verwertung in einem Land nach folgender Rangfolge verteilt: Zuerst werden die Kosten des Verfahrens beglichen. Danach erhalten Gläubiger mit einem Pfandrecht den Erlös aus dem jeweils verpfändeten Gegenstand, höchstens jedoch den Betrag ihrer Forderung; ein Überschuss fließt in die allgemeine Masse, ein nicht gedeckter Rest wird als gewöhnliche Forderung behandelt.", "Aus der allgemeinen Masse werden anschließend rückständige Löhne der letzten drei Monate vollständig bezahlt. Der verbleibende Betrag wird auf die gewöhnlichen Forderungen im Verhältnis ihrer Höhe verteilt; der Anteil, den jeder gewöhnliche Gläubiger von seiner Forderung erhält, heißt Quote. Nachrangige Forderungen, etwa Darlehen von Gesellschaftern, werden erst bedient, wenn alle gewöhnlichen Forderungen vollständig erfüllt sind."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Nach den Löhnen bleiben 240 000 Euro. Verteilt auf 800 000 Euro Forderungen ergibt das 30 Prozent.", "**II ist ableitbar.** Der nicht gedeckte Rest wird laut Text als gewöhnliche Forderung behandelt, und gewöhnliche Forderungen werden nach Quote bedient."]}, {"num": 3, "stem": [], "question": null, "statements": ["Im Beispiel betragen die Leerkosten 40 000 Euro.", "Bei voller Auslastung lägen die Stückkosten im Beispiel bei 50 Euro."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 2 · Aufgaben 3 und 4", "title": "Fixkostendegression", "paras": ["Die Stückkosten eines Produkts setzen sich aus den variablen Stückkosten und dem Anteil der Fixkosten zusammen, der auf ein Stück entfällt. Weil sich die Fixkosten bei höherer Ausbringung auf mehr Einheiten verteilen, sinken die Stückkosten mit steigender Menge; man spricht von Fixkostendegression. Der Beschäftigungsgrad ist das Verhältnis der tatsächlichen Ausbringung zur Kapazität.", "Beispiel: Ein Werk mit einer Kapazität von 10 000 Stück im Monat, Fixkosten von 200 000 Euro und variablen Stückkosten von 30 Euro hat bei einem Beschäftigungsgrad von 80 Prozent Stückkosten von 55 Euro. Als Leerkosten bezeichnet man den Teil der Fixkosten, der auf die ungenutzte Kapazität entfällt, als Nutzkosten den übrigen Teil."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Ungenutzt sind 20 Prozent der Kapazität. 20 Prozent der Fixkosten von 200 000 Euro sind 40 000 Euro.", "**II ist ableitbar.** 200 000 Euro Fixkosten auf 10 000 Stück ergeben 20 Euro je Stück. Mit den variablen 30 Euro sind es 50 Euro."]}, {"num": 4, "stem": [], "question": null, "statements": ["Halbiert sich im Beispiel die Ausbringung von 8 000 auf 4 000 Stück, verdoppeln sich die Stückkosten.", "Bei einem Verkaufspreis von 70 Euro erzielt das Werk im Beispiel Gewinn, sobald es mehr als 5 000 Stück herstellt und absetzt."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 2 · Aufgaben 3 und 4", "title": "Fixkostendegression", "paras": ["Die Stückkosten eines Produkts setzen sich aus den variablen Stückkosten und dem Anteil der Fixkosten zusammen, der auf ein Stück entfällt. Weil sich die Fixkosten bei höherer Ausbringung auf mehr Einheiten verteilen, sinken die Stückkosten mit steigender Menge; man spricht von Fixkostendegression. Der Beschäftigungsgrad ist das Verhältnis der tatsächlichen Ausbringung zur Kapazität.", "Beispiel: Ein Werk mit einer Kapazität von 10 000 Stück im Monat, Fixkosten von 200 000 Euro und variablen Stückkosten von 30 Euro hat bei einem Beschäftigungsgrad von 80 Prozent Stückkosten von 55 Euro. Als Leerkosten bezeichnet man den Teil der Fixkosten, der auf die ungenutzte Kapazität entfällt, als Nutzkosten den übrigen Teil."]}, "answer": 1, "answer_label": "B (Nur II)", "solution": ["**I ist nicht ableitbar.** Bei 4 000 Stück entfallen 50 Euro Fixkosten auf ein Stück, die Stückkosten betragen 80 Euro. Das Doppelte von 55 Euro wären 110 Euro. Nur der Fixkostenanteil verdoppelt sich.", "**II ist ableitbar.** Je Stück bleiben 70 − 30 = 40 Euro zur Deckung der Fixkosten. 200 000 : 40 = 5 000 Stück decken sie genau, jedes weitere Stück bringt Gewinn."]}, {"num": 5, "stem": [], "question": null, "statements": ["Der niedrige Preis ist für jede der beiden Tankstellen eine dominante Strategie.", "Dass beide den hohen Preis wählen, ist ein Nash-Gleichgewicht."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 3 · Aufgaben 5 und 6", "title": "Preiswettbewerb zweier Tankstellen", "paras": ["Zwei Tankstellen, A und B, legen jeden Morgen unabhängig voneinander ihren Preis fest: hoch oder niedrig. Wählen beide den hohen Preis, erzielt jede einen Tagesgewinn von 800 Euro. Wählen beide den niedrigen Preis, sind es jeweils 500 Euro. Wählt nur eine den niedrigen Preis, zieht sie Kunden ab und erzielt 1 000 Euro, während die andere nur 200 Euro erreicht.", "Eine Strategie heißt dominant, wenn sie für einen Anbieter zu einem höheren Gewinn führt als jede andere, ganz gleich, wie sich der Konkurrent verhält. Ein Nash-Gleichgewicht liegt vor, wenn keiner der beiden seinen Gewinn steigern kann, indem er allein seine Entscheidung ändert."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Wählt die Konkurrenz hoch, bringt niedrig 1 000 statt 800 Euro. Wählt sie niedrig, bringt niedrig 500 statt 200 Euro. In beiden Fällen ist niedrig besser.", "**II ist nicht ableitbar.** Jede Tankstelle könnte allein auf den niedrigen Preis wechseln und ihren Gewinn von 800 auf 1 000 Euro steigern."]}, {"num": 6, "stem": [], "question": null, "statements": ["Im einzigen Nash-Gleichgewicht des Spiels ist die Summe der Gewinne beider Tankstellen niedriger als bei jeder anderen Preiskombination.", "Würde die Tankstelle mit dem niedrigen Preis nur 700 statt 1 000 Euro erzielen, wenn die andere den hohen Preis wählt, wäre der niedrige Preis keine dominante Strategie mehr."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 3 · Aufgaben 5 und 6", "title": "Preiswettbewerb zweier Tankstellen", "paras": ["Zwei Tankstellen, A und B, legen jeden Morgen unabhängig voneinander ihren Preis fest: hoch oder niedrig. Wählen beide den hohen Preis, erzielt jede einen Tagesgewinn von 800 Euro. Wählen beide den niedrigen Preis, sind es jeweils 500 Euro. Wählt nur eine den niedrigen Preis, zieht sie Kunden ab und erzielt 1 000 Euro, während die andere nur 200 Euro erreicht.", "Eine Strategie heißt dominant, wenn sie für einen Anbieter zu einem höheren Gewinn führt als jede andere, ganz gleich, wie sich der Konkurrent verhält. Ein Nash-Gleichgewicht liegt vor, wenn keiner der beiden seinen Gewinn steigern kann, indem er allein seine Entscheidung ändert."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Einziges Gleichgewicht ist niedrig/niedrig mit zusammen 1 000 Euro. Hoch/hoch bringt 1 600 Euro, die beiden gemischten Kombinationen je 1 200 Euro.", "**II ist ableitbar.** Gegen einen hohen Preis der Konkurrenz brächte der hohe Preis dann 800 Euro, der niedrige nur 700. Niedrig wäre nicht mehr in jedem Fall besser."]}, {"num": 7, "stem": [], "question": null, "statements": ["Bei einem Nominalzins von 3 Prozent und einer Inflationsrate von 5 Prozent verliert ein Sparguthaben innerhalb eines Jahres näherungsweise 2 Prozent an Kaufkraft.", "Sinkt die Inflationsrate bei unverändertem Nominalzins, steigt der Realzins."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 4 · Aufgaben 7 und 8", "title": "Nominalzins und Realzins", "paras": ["Der Nominalzins gibt an, um wie viel Prozent ein angelegter Geldbetrag innerhalb eines Jahres wächst. Wie viel man sich von diesem Betrag kaufen kann, hängt jedoch auch von der Entwicklung der Preise ab. Der Realzins misst den Zuwachs an Kaufkraft. Näherungsweise ergibt er sich, indem man die Inflationsrate vom Nominalzins abzieht. Ist die Inflationsrate höher als der Nominalzins, ist der Realzins negativ: Der Sparer verfügt am Jahresende über mehr Geld, kann sich dafür aber weniger kaufen als zu Jahresbeginn.", "Für Schuldner gilt das Umgekehrte. Eine unerwartet hohe Inflation entlastet sie, weil die reale Last ihrer festverzinslichen Schulden sinkt. Banken berücksichtigen bei der Festlegung von Kreditzinsen daher die Inflationsrate, die sie für die Laufzeit erwarten."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Realzins näherungsweise 3 − 5 = −2 Prozent. Ein negativer Realzins bedeutet einen Verlust an Kaufkraft in dieser Höhe.", "**II ist ableitbar.** Der Realzins ist die Differenz aus Nominalzins und Inflationsrate. Wird der Abzug kleiner, wird die Differenz größer."]}, {"num": 8, "stem": [], "question": null, "statements": ["Fällt die Inflation niedriger aus als bei Abschluss eines festverzinslichen Kredits erwartet, ist das für den Schuldner von Vorteil.", "Ein positiver Nominalzins garantiert, dass die Kaufkraft eines Sparguthabens nicht sinkt."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 4 · Aufgaben 7 und 8", "title": "Nominalzins und Realzins", "paras": ["Der Nominalzins gibt an, um wie viel Prozent ein angelegter Geldbetrag innerhalb eines Jahres wächst. Wie viel man sich von diesem Betrag kaufen kann, hängt jedoch auch von der Entwicklung der Preise ab. Der Realzins misst den Zuwachs an Kaufkraft. Näherungsweise ergibt er sich, indem man die Inflationsrate vom Nominalzins abzieht. Ist die Inflationsrate höher als der Nominalzins, ist der Realzins negativ: Der Sparer verfügt am Jahresende über mehr Geld, kann sich dafür aber weniger kaufen als zu Jahresbeginn.", "Für Schuldner gilt das Umgekehrte. Eine unerwartet hohe Inflation entlastet sie, weil die reale Last ihrer festverzinslichen Schulden sinkt. Banken berücksichtigen bei der Festlegung von Kreditzinsen daher die Inflationsrate, die sie für die Laufzeit erwarten."]}, "answer": 3, "answer_label": "D (Keine)", "solution": ["**I ist nicht ableitbar.** Der Text nennt die unerwartet hohe Inflation als Entlastung des Schuldners. Bei unerwartet niedriger Inflation sinkt die reale Last weniger als einkalkuliert, ein Vorteil lässt sich daraus nicht ableiten.", "**II ist nicht ableitbar.** Liegt die Inflationsrate über dem Nominalzins, ist der Realzins negativ, auch wenn der Nominalzins positiv ist."]}, {"num": 9, "stem": [], "question": null, "statements": ["Mindestens jeder vierte Befragte in Deutschland ist mit seiner Arbeit insgesamt zufrieden und wünscht sich zugleich mehr Möglichkeiten, von zu Hause zu arbeiten.", "Mindestens jeder zehnte Befragte in Deutschland erwägt einen Wechsel des Arbeitgebers, obwohl er mit seiner Arbeit insgesamt zufrieden ist."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 5 · Aufgaben 9 und 10", "title": "Wechselbereitschaft", "paras": ["Eine Umfrage unter Beschäftigten in zwölf europäischen Ländern ergab für Deutschland: 70 Prozent der Befragten sind mit ihrer Arbeit insgesamt zufrieden, 55 Prozent wünschen sich mehr Möglichkeiten, von zu Hause zu arbeiten, und 40 Prozent erwägen, innerhalb der nächsten zwei Jahre den Arbeitgeber zu wechseln.", "Die Befragten wurden drei Altersgruppen zugeordnet: unter 30 Jahre, 30 bis 49 Jahre und ab 50 Jahre. In der mittleren Gruppe erwägen 46 Prozent einen Wechsel, in der ältesten 43 Prozent. Die höchste Wechselbereitschaft aller zwölf Länder wurde in Irland gemessen (51 Prozent), die niedrigste in Österreich (29 Prozent). Als wichtigsten Grund nannten 46 Prozent der Wechselwilligen das Gehalt."]}, "answer": 2, "answer_label": "C (Beide)", "solution": ["**I ist ableitbar.** Mindestüberschneidung: 70 % + 55 % − 100 % = 25 %, also mindestens jeder vierte.", "**II ist ableitbar.** Mindestüberschneidung: 70 % + 40 % − 100 % = 10 %, also mindestens jeder zehnte."]}, {"num": 10, "stem": [], "question": null, "statements": ["Unter den Befragten unter 30 Jahren erwägen weniger als 40 Prozent einen Wechsel des Arbeitgebers.", "Für mehr als 20 Prozent aller Befragten in Deutschland ist das Gehalt der wichtigste Grund, einen Wechsel zu erwägen."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 5 · Aufgaben 9 und 10", "title": "Wechselbereitschaft", "paras": ["Eine Umfrage unter Beschäftigten in zwölf europäischen Ländern ergab für Deutschland: 70 Prozent der Befragten sind mit ihrer Arbeit insgesamt zufrieden, 55 Prozent wünschen sich mehr Möglichkeiten, von zu Hause zu arbeiten, und 40 Prozent erwägen, innerhalb der nächsten zwei Jahre den Arbeitgeber zu wechseln.", "Die Befragten wurden drei Altersgruppen zugeordnet: unter 30 Jahre, 30 bis 49 Jahre und ab 50 Jahre. In der mittleren Gruppe erwägen 46 Prozent einen Wechsel, in der ältesten 43 Prozent. Die höchste Wechselbereitschaft aller zwölf Länder wurde in Irland gemessen (51 Prozent), die niedrigste in Österreich (29 Prozent). Als wichtigsten Grund nannten 46 Prozent der Wechselwilligen das Gehalt."]}, "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I ist ableitbar.** Der Gesamtwert von 40 Prozent ist der gewichtete Durchschnitt der drei Altersgruppen. Die beiden älteren Gruppen liegen mit 46 und 43 Prozent darüber; die jüngste muss deshalb darunter liegen. So argumentierte auch die offizielle Lösung in Probetest 2 (Aufgabe 7, Aussage II).", "**II ist nicht ableitbar.** Die 46 Prozent beziehen sich auf die Wechselwilligen, also auf 40 Prozent der Befragten: 0,46 × 40 % = 18,4 % aller Befragten."]}, {"num": 11, "stem": [], "question": null, "statements": ["Ein Angebot mit 10 Punkten beim Preis, 7 bei der Qualität und 2 bei der Bauzeit setzt sich gegen ein Angebot mit 6, 9 und 8 Punkten durch.", "Ein Angebot mit 8, 6 und 5 Punkten (Preis, Qualität, Bauzeit) unterliegt einem Angebot mit 6, 9 und 8 Punkten."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "table": null, "passage": {"label": "Text 6 · Aufgaben 11 und 12", "title": "Vergabe nach Punkten", "paras": ["Eine Stadt vergibt einen Bauauftrag nach einem Punkteverfahren. Jedes Angebot erhält für die Kriterien Preis, Qualität und Bauzeit je eine Punktzahl zwischen 0 und 10. Die Punktzahlen werden mit den Gewichten 50 Prozent (Preis), 30 Prozent (Qualität) und 20 Prozent (Bauzeit) multipliziert und zu einer G
