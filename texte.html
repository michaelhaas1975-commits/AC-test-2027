const LS = "ac-app-" + DATA.key;
const store = {
  get(k, d) { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : d } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)) } catch (e) {} },
  del(k) { try { localStorage.removeItem(LS + k) } catch (e) {} }
};
const L = "ABCDEFGH";
const app = document.getElementById("app");
document.body.classList.add("k-" + DATA.key);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
let S = null, tick = null;

function fmt(sec) { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0") }

/* ---------- Startseite ---------- */
function home() {
  clearInterval(tick); S = null;
  const run = store.get("run", null);
  const hist = store.get("hist", {});
  app.innerHTML = `<div class="wrap">
    <div class="hero"><span class="eyebrow">Assessment Centre Frankfurt School · Training</span>
      <h1>${esc(DATA.label)}</h1>
      <p class="muted">Drei Übungstests mit je 15 Aufgaben und der Bearbeitungszeit des echten Tests. Am Ende siehst du deine Punktzahl und zu jeder Aufgabe den Lösungsweg.</p>
      <div class="row"><button class="btn warn" id="reset">Ergebnisse zurücksetzen</button></div></div>
    ${run ? `<div class="card" style="margin-bottom:16px;border-color:var(--mark)"><h3>Laufender Test: ${esc(DATA.tests[run.t].name)}</h3>
      <p class="muted" style="margin:0">Die Zeit läuft weiter, auch wenn die App geschlossen ist. Restzeit: <strong>${fmt((run.end - Date.now()) / 1000)}</strong></p>
      <div class="row"><button class="btn primary" id="resume">Fortsetzen</button><button class="btn" id="drop">Verwerfen</button></div></div>` : ""}
    <div class="tests">${DATA.tests.map((t, i) => {
      const h = hist[i];
      return `<div class="card"><span class="eyebrow">${esc(t.level)}</span><h2>${esc(t.name)}</h2>
        <div class="meta">15 Aufgaben · ${t.minutes} Minuten</div>
        <div class="last">${h ? `Letztes Ergebnis: <strong>${h.score} von 15</strong><br><span class="muted">${esc(h.date)} · ${h.tries} ${h.tries === 1 ? "Durchgang" : "Durchgänge"}</span>` : `<span class="muted">Noch nicht bearbeitet</span>`}</div>
        <button class="btn primary" data-start="${i}">Test starten</button></div>`
    }).join("")}</div>
    <div class="rules"><h3>So läuft es wie im AC</h3><ul>
      <li>Die Uhr startet mit dem Test und lässt sich nicht anhalten. Bei 0:00 wird automatisch abgegeben.</li>
      <li>Gezählt wird die zuletzt angetippte Antwort. Über die Nummernleiste springst du zu jeder Aufgabe.</li>
      <li>Mit „Markieren“ kennzeichnest du Aufgaben für den zweiten Durchgang.</li>
      <li>Grafiken lassen sich durch Antippen vergrößern.</li>
      <li>In dieser App kosten falsche Antworten keine Punkte. Ob das im AC ebenso gilt, sagen weder Tutorial noch Probetests; lass deshalb keine Aufgabe leer, solange die Einladung nichts anderes sagt.</li></ul></div></div>`;
  app.querySelectorAll("[data-start]").forEach(b => b.onclick = () => start(+b.dataset.start));
  app.querySelector("#reset").onclick = () => {
    const v = document.createElement("div"); v.className = "veil";
    v.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h2>Ergebnisse zurücksetzen?</h2>

    document.body.appendChild(v);
    v.querySelector("#no").onclick = () => v.remove();
    v.querySelector("#yes").onclick = () => { store.del("hist"); store.del("run"); v.remove(); home() };
  };
  if (run) { app.querySelector("#resume").onclick = () => { S = run; test() }; app.querySelector("#drop").onclick = () => { store.del("run"); home() } }

function start(t) {
  const T = DATA.tests[t];
  S = { t, cur: 0, ans: Array(15).fill(null), flag: Array(15).fill(false), begin: Date.now(), end: Date.now() + T.minutes * 60000 };
  store.set("run", S); test();
}

/* ---------- Test ---------- */
function test() {
  const T = DATA.tests[S.t];
  app.innerHTML = `<div class="bar"><div class="in"><span class="title">${esc(T.name)} · ${esc(DATA.label)}</span>
    <span class="clock" id="clock" aria-live="off">--:--</span><button class="btn warn" id="submit">Abgeben</button></div></div>
    <div class="wrap" style="padding-top:0"><div class="strip" id="strip"></div><div id="q"></div>
    <div class="nav"><button class="btn" id="prev">Zurück</button><button class="btn" id="flag">Markieren</button><button class="btn primary" id="next">Weiter</button></div></div>`;
  app.querySelector("#prev").onclick = () => go(S.cur - 1);
  app.querySelector("#next").onclick = () => S.cur === 14 ? confirmSubmit() : go(S.cur + 1);
  app.querySelector("#flag").onclick = () => { S.flag[S.cur] = !S.flag[S.cur]; save(); paint() };
  app.querySelector("#submit").onclick = confirmSubmit;
  clearInterval(tick); tick = setInterval(clock, 500); clock(); paint();
}
function save() { store.set("run", S) }
function go(i) { if (i < 0 || i > 14) return; S.cur = i; save(); paint(); window.scrollTo({ top: 0 }) }
function clock() {
  const left = (S.end - Date.now()) / 1000, el = document.getElementById("clock");
  if (!el) return;
  el.textContent = fmt(left); el.classList.toggle("low", left < 300);
  if (left <= 0) finish(true);
}

function itemHTML(it, interactive, chosen) {
  let h = "";
  if (it.passage) h += `<div class="passage"><span class="eyebrow">${esc(it.passage.label)}</span><span class="t">${esc(it.passage.title)}</span>${it.passage.paras.map(p => `<p>${md(p)}</p>`).join("")}</div>`;
  (it.stem || []).forEach(p => h += `<p>${md(p)}</p>`);
  if (it.table) h += `<div class="tbl"><table><thead><tr>${it.table.head.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${it.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if (it.img) h += `<div class="fig m"><img src="${it.img}" alt="Abbildung zur Aufgabe ${it.num}"></div>`;
  if (it.question) h += `<p><strong>${md(it.question)}</strong></p>`;
  else if (DATA.key === "fig") h += `<p><strong>Welches Bild vervollständigt das Muster?</strong></p>`;
  if (it.statements) h += `<div class="stmts">${it.statements.map((s, k) => `<div class="stmt"><b>${k ? "II." : "I."}</b><span>${md(s)}</span></div>`).join("")}</div>`;
  if (it.img2) h += `<div class="fig o"><img src="${it.img2}" alt="Antwortmöglichkeiten zur Aufgabe ${it.num}"></div>`;
  if (interactive) {
    if (it.options) h += `<div class="opts">${it.options.map((o, k) => `<button class="opt${chosen === k ? " sel" : ""}" data-k="${k}"><span class="l">${L[k]}</span><span>${md(o)}</span></button>`).join("")}</div>`;
    else h += `<div class="opts grid${it.nopts}">${Array.from({ length: it.nopts }, (_, k) => `<button class="opt${chosen === k ? " sel" : ""}" data-k="${k}" aria-label="Antwort ${L[k]}"><span class="l">${L[k]}</span></button>`).join("")}</div>`;
  }
  return h;
}

function paint() {
  const T = DATA.tests[S.t], it = T.items[S.cur];
  document.getElementById("strip").innerHTML = T.items.map((_, i) =>
    `<button class="${S.ans[i] !== null ? "done" : ""} ${S.flag[i] ? "flag" : ""} ${i === S.cur ? "cur" : ""}" data-i="${i}" aria-label="Aufgabe ${i + 1}">${i + 1}</button>`).join("");
  document.querySelectorAll("#strip button").forEach(b => b.onclick = () => go(+b.dataset.i));
  document.getElementById("q").innerHTML = `<div class="qhead"><h2>Aufgabe ${S.cur + 1}</h2><span class="muted">${S.cur === 0 && T.intro ? "" : ""}${S.flag[S.cur] ? "markiert" : ""}</span></div>
    <div class="panel">${S.cur === 0 && T.intro && !/Bearbeitungszeit/.test(T.intro) ? `<p class="muted">${md(T.intro)}</p>` : ""}${itemHTML(it, true, S.ans[S.cur])}</div>`;
  document.querySelectorAll("#q .opt").forEach(b => b.onclick = () => { S.ans[S.cur] = +b.dataset.k; save(); paint() });
  document.querySelectorAll("#q .fig img").forEach(img => img.onclick = () => zoom(img.src));
  const f = document.getElementById("flag"); f.classList.toggle("on", S.flag[S.cur]); f.textContent = S.flag[S.cur] ? "Markiert" : "Markieren";
  document.getElementById("prev").disabled = S.cur === 0;
  document.getElementById("next").textContent = S.cur === 14 ? "Abgeben" : "Weiter";
}

function zoom(src) {
  const z = document.createElement("div"); z.className = "zoom";
  z.innerHTML = `<button class="btn close">Schließen</button><img src="${src}" alt="Vergrößerte Abbildung">`;
  z.onclick = e => { if (e.target === z || e.target.classList.contains("close")) z.remove() };
  document.body.appendChild(z);
}

function confirmSubmit() {
  const open = S.ans.filter(a => a === null).length, fl = S.flag.filter(Boolean).length;
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h2>Test beenden?</h2>
    <p style="margin:0">${15 - open} von 15 Aufgaben beantwortet${fl ? `, ${fl} markiert` : ""}. Restzeit ${fmt((S.end - Date.now()) / 1000)}.</p>
    ${open ? `<p style="margin:0;color:var(--bad)">${open} ${open === 1 ? "Aufgabe ist" : "Aufgaben sind"} noch offen. Eine vorläufige Antwort ist besser als keine.</p>` : ""}
    <div class="row"><button class="btn" id="no">Nein, weiterarbeiten</button><button class="btn primary" id="yes">Ja, abgeben</button></div></div>`;
  document.body.appendChild(v);
  v.querySelector("#no").onclick = () => v.remove();
  v.querySelector("#yes").onclick = () => { v.remove(); finish(false) };
}

function finish(timeout) {
  clearInterval(tick);
  document.querySelectorAll(".veil,.zoom").forEach(x => x.remove());
  const T = DATA.tests[S.t];
  const used = Math.min(T.minutes * 60, (Math.min(Date.now(), S.end) - S.begin) / 1000);
  const score = T.items.reduce((n, it, i) => n + (S.ans[i] === it.answer ? 1 : 0), 0);
  const hist = store.get("hist", {}); const prev = hist[S.t];
  hist[S.t] = { score, date: new Date().toLocaleDateString("de-DE"), tries: (prev ? prev.tries : 0) + 1, best: Math.max(score, prev ? prev.best || prev.score : 0) };
  store.set("hist", hist); store.del("run");
  results({ t: S.t, ans: S.ans.slice(), used, score, timeout, best: hist[S.t].best });
}

/* ---------- Auswertung ---------- */
function results(R) {
  const T = DATA.tests[R.t];
  const st = T.items.map((it, i) => R.ans[i] === null ? "e" : R.ans[i] === it.answer ? "r" : "f");
  const wrong = st.filter(s => s === "f").length, empty = st.filter(s => s === "e").length;
  const pct = Math.round(R.score / 15 * 100);
  app.innerHTML = `<div class="wrap">
    <div class="hero"><span class="eyebrow">Auswertung · ${esc(DATA.label)}</span><h1>${esc(T.name)}</h1>
      ${R.timeout ? `<p style="color:var(--bad)">Die Zeit ist abgelaufen; der Test wurde automatisch abgegeben.</p>` : ""}</div>
    <div class="score"><div class="big">${R.score}<small> / 15</small></div>
      <div><strong>${pct} Prozent richtig</strong> · ${wrong} falsch · ${empty} leer<br>
      <span class="muted">Bearbeitungszeit ${fmt(R.used)} von ${T.minutes}:00 · bestes Ergebnis ${R.best} von 15</span>
      <div class="bars">${st.map(s => `<span class="${s}"></span>`).join("")}</div></div></div>
    <div class="row" style="margin-top:16px"><button class="btn" id="onlyf">Nur Fehler und leere zeigen</button><button class="btn" id="again">Test wiederholen</button><button class="btn primary" id="back">Zur Übersicht</button></div>
    <div class="list" id="list"></div></div>`;
  let only = false;
  const draw = () => {
    document.getElementById("list").innerHTML = T.items.map((it, i) => {
      if (only && st[i] === "r") return "";
      const a = R.ans[i];
      const lab = { r: "richtig", f: "falsch", e: "leer" }[st[i]];
      return `<div class="res"><button data-i="${i}" aria-expanded="false"><span class="tag ${st[i]}">${lab}</span><span><strong>Aufgabe ${i + 1}</strong> · deine Antwort ${a === null ? "–" : L[a]} · richtig ${esc(it.answer_label)}</span></button>
        <div class="body" hidden>${it.solimg ? `<div class="solimg"><img src="${it.solimg}" alt="Gelöste Matrix"></div>` : ""}
        ${(it.solution || []).map(p => `<p>${md(p)}</p>`).join("")}
        <details><summary class="muted">Aufgabe noch einmal ansehen</summary><div class="panel q" style="margin-top:10px">${itemHTML(it, false)}</div></details></div></div>`;
    }).join("");
    document.querySelectorAll("#list .res > button").forEach(b => b.onclick = () => {
      const body = b.nextElementSibling; body.hidden = !body.hidden; b.setAttribute("aria-expanded", String(!body.hidden));
    });
    document.querySelectorAll("#list .fig img").forEach(img => img.onclick = () => zoom(img.src));
  };
  draw();
  document.getElementById("onlyf").onclick = e => { only = !only; e.target.textContent = only ? "Alle Aufgaben zeigen" : "Nur Fehler und leere zeigen"; draw() };
  document.getElementById("again").onclick = () => start(R.t);
  document.getElementById("back").onclick = home;
  window.scrollTo({ top: 0 });
}

const running = store.get("run", null);
if (running && running.end > Date.now()) { S = running; test() }
else { if (running) { S = running; finish(true) } else home() }
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}) } catch (e) {}
</script>
