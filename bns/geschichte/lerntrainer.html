<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Lerntrainer: Missionen mit XP, Leben, Combo, Sternen und Abzeichen. Für iPad und Handy, hell und dunkel. */
:root {
  --bg: #f4f2fb; --surface: #ffffff; --ink: #1b1830; --muted: #625d7a; --line: #dcd7ee;
  --accent: #5b3fd6; --accent2: #2f80ed; --accent-soft: #ebe6ff; --gold: #e0a100; --gold-soft: #fff4d1;
  --ok: #1f8a4c; --ok-soft: #def5e7; --bad: #c8372d; --bad-soft: #fde3e0; --lock: #b7b2c9;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #12101d; --surface: #1d1a2c; --ink: #ece9f7; --muted: #a49fbb; --line: #322d48;
  --accent: #9b85ff; --accent2: #6aa8ff; --accent-soft: #2a2347; --gold: #ffc83d; --gold-soft: #3a2f10;
  --ok: #5fd08e; --ok-soft: #153223; --bad: #ff8577; --bad-soft: #3d1a17; --lock: #4b4563; color-scheme: dark } }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent }
.wrap { max-width: 860px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-left, 0px)) 60px max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance }
h1 { font-size: 2rem; font-weight: 800 } h2 { font-size: 1.3rem } h3 { font-size: 1.05rem }
p { margin: 0 }
.eyebrow { font: 700 .74rem/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
button, a.btn { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 18px; min-height: 48px; font-weight: 700; text-decoration: none }
.btn.primary { background: linear-gradient(135deg, #5b3fd6, #2f80ed); border: 0; color: #fff }
.btn.big { min-height: 56px; font-size: 1.1rem; padding: 14px 26px }
.btn:disabled { opacity: .45; cursor: default }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px }
.top a { color: var(--accent); font-weight: 700; text-decoration: none }

/* Profilkarte */
.hero { background: linear-gradient(135deg, #5b3fd6, #2f80ed); color: #fff; border-radius: 20px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 10px 30px -18px var(--accent) }
.hero .eyebrow { color: rgba(255,255,255,.8) }
.hero p { color: rgba(255,255,255,.9); max-width: 60ch }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.stat { background: rgba(255,255,255,.16); border-radius: 14px; padding: 10px 12px }
.stat b { display: block; font: 800 clamp(1rem, 2.4vw, 1.3rem)/1.15 var(--f-display); overflow-wrap: anywhere; hyphens: auto }
.stat span { font-size: .8rem; opacity: .9 }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.xpbar { height: 12px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden }
.xpbar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .6s }

/* Missionen */
.sec { margin: 26px 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px }
.mis { position: relative; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 6px; min-height: 140px }
.mis .ic { font-size: 1.8rem; line-height: 1 }
.mis .no { position: absolute; top: 12px; right: 14px; font: 700 .8rem var(--f-mono); color: var(--muted) }
.mis .st { color: var(--gold); letter-spacing: 2px; font-size: 1.05rem }
.mis .st .off { color: var(--lock) }
.mis.done { border-color: var(--accent) }
.mis.next { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft) }
.mis.locked { opacity: .55; cursor: default }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px }
.mode { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 4px }
.mode:disabled { opacity: .5; cursor: default }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.badge { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; text-align: center }
.badge .e { font-size: 1.8rem } .badge b { font-size: .92rem } .badge span { font-size: .78rem; color: var(--muted) }
.badge.off { filter: grayscale(1); opacity: .45 }

/* Spiel */
.hud { display: flex; align-items: center; gap: 12px; margin-bottom: 14px }
.prog { flex: 1; height: 12px; background: var(--line); border-radius: 99px; overflow: hidden }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s }
.hearts { font-size: 1.25rem; letter-spacing: 2px; white-space: nowrap }
.hearts .off { filter: grayscale(1); opacity: .3 }
.pill { font: 700 .9rem var(--f-mono); padding: 6px 10px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); white-space: nowrap }
.pill.combo { background: var(--accent-soft); color: var(--accent) }
.pill.time { font-size: 1.1rem }
.pill.time.low { background: var(--bad-soft); color: var(--bad) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 16px }
.q { font: 700 1.25rem/1.35 var(--f-display) }
.opts { display: grid; gap: 10px }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; min-height: 58px; display: flex; gap: 12px; align-items: center }
.opt .l { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 700 .95rem var(--f-mono); background: var(--bg) }
.opt.ok { border-color: var(--ok); background: var(--ok-soft) } .opt.ok .l { background: var(--ok); color: #fff }
.opt.bad { border-color: var(--bad); background: var(--bad-soft) } .opt.bad .l { background: var(--bad); color: #fff }
.opt[disabled] { cursor: default }
.fb { border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px }
.fb.ok { background: var(--ok-soft) } .fb.bad { background: var(--bad-soft) }
.fb h3 { color: var(--ok) } .fb.bad h3 { color: var(--bad) }
.brief { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none }
.brief li { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px }
.result { text-align: center; display: grid; gap: 14px; justify-items: center; padding-top: 10px }
.stars { font-size: 3rem; letter-spacing: 6px; color: var(--gold) } .stars .off { color: var(--lock) }
.gain { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 520px }
.gain div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px }
.gain b { display: block; font: 800 1.5rem var(--f-display) }
.newb { background: var(--gold-soft); border-radius: 14px; padding: 12px 16px; width: 100%; max-width: 520px; text-align: left }
.pop { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); font: 800 1.6rem var(--f-display); color: var(--gold); pointer-events: none; z-index: 30 }
.veil { position: fixed; inset: 0; background: rgba(10,8,20,.5); display: grid; place-items: center; z-index: 40; padding: 16px }
.dialog { background: var(--surface); border-radius: 16px; padding: 22px; max-width: 440px; display: grid; gap: 14px }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 35 }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px }
@media (prefers-reduced-motion: no-preference) {
  .opt, .mis, .mode { transition: transform .12s, border-color .12s, background .12s }
  .opt:not([disabled]):active, .mis:not(.locked):active, .mode:not(:disabled):active { transform: scale(.98) }
  .shake { animation: shake .35s } @keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
  .bump { animation: bump .4s } @keyframes bump { 50% { transform: scale(1.04) } }
  .pop { animation: pop 1s forwards } @keyframes pop { from { opacity: 0; transform: translate(-50%, 10px) } 20% { opacity: 1 } to { opacity: 0; transform: translate(-50%, -40px) } }
  .confetti i { animation: fall 2.4s linear forwards } @keyframes fall { to { transform: translateY(110vh) rotate(720deg) } }
}
@media (prefers-reduced-motion: reduce) { .pop { display: none } .confetti { display: none } }
</style>
</head>

<script>
const DATA = {"key": "bns-geschichte-trainer", "label": "Geschichte · Lerntrainer", "eyebrow": "BNS Abiturtraining · Geschichte", "description": "Acht Missionen von den Trümmern 1945 bis zum Berlin-Ultimatum 1958. Sammle XP, halte deine Combo, schalte Missionen frei und hol dir Abzeichen.", "ranks": [{"xp": 0, "name": "Neuling"}, {"xp": 200, "name": "Spurensucher"}, {"xp": 450, "name": "Zeitzeuge"}, {"xp": 800, "name": "Archivprofi"}, {"xp": 1200, "name": "Historiker"}, {"xp": 1700, "name": "Geschichtsprofi"}, {"xp": 2400, "name": "Geschichtslegende"}], "missions": [{"id": "kriegsende", "icon": "🏚️", "title": "Trümmer und Hunger", "subtitle": "Kriegsende 1945 und Alltag", "briefing": ["Am **8. Mai 1945** tritt die bedingungslose Kapitulation in Kraft. Eine deutsche Regierung gibt es danach nicht mehr.", "Am **5. Juni 1945** übernehmen die vier Siegermächte mit der Berliner Erklärung die Regierungsgewalt.", "Hunger, Trümmer und rund **zehn Millionen** Vertriebene prägen den Alltag. Der Historiker Kleßmann nennt das „Zusammenbruchgesellschaft“.", "Ob 1945 eine „Stunde Null“ war, ist umstritten: Vieles lief personell und mental weiter."], "questions": [{"q": "An welchem Tag trat die bedingungslose Kapitulation der Wehrmacht in Kraft?", "a": "8. Mai 1945", "w": ["30. April 1945", "17. Juni 1945", "1. September 1945"], "info": "Unterschrieben wurde am 7. Mai in Reims und in der Nacht zum 9. Mai in Berlin-Karlshorst. Der 30. April ist Hitlers Todestag."}, {"q": "Was passierte mit der Regierung Dönitz in Flensburg?", "a": "Sie wurde am 23. Mai 1945 verhaftet.", "w": ["Sie regierte bis 1949 weiter.", "Sie wurde Teil des Kontrollrats.", "Sie floh nach Spanien."], "info": "Ihr einziger Zweck war die Kapitulation. Danach gab es keine deutsche Staatsgewalt mehr."}, {"q": "Wer übernahm mit der Berliner Erklärung vom 5. Juni 1945 die Macht in Deutschland?", "a": "Die USA, die Sowjetunion, Großbritannien und Frankreich", "w": ["Nur die USA und Großbritannien", "Die Vereinten Nationen", "Ein deutscher Übergangsrat"], "info": "Die vier Mächte regierten gemeinsam über den Alliierten Kontrollrat und jede in ihrer Zone."}, {"q": "Wie viele Kalorien standen Mitte 1946 offiziell pro Tag in der französischen Zone zur Verfügung?", "a": "Etwa 900", "w": ["Etwa 2 500", "Etwa 1 800", "Etwa 400"], "info": "Zum Vergleich: US-Zone rund 1330, sowjetische Zone 1083, britische 1050. Und oft gab es nicht einmal das, was auf der Lebensmittelkarte stand."}, {"q": "Was war im Winter 1946/47 los?", "a": "Ein Hungerwinter mit Kohlekrise", "w": ["Ein Wirtschaftsboom nach der Währungsreform", "Die Berlin-Blockade", "Der Volksaufstand in der DDR"], "info": "Es fehlte an Nahrung und an Kohle zum Heizen. Krankheiten wie Typhus und Tuberkulose breiteten sich aus."}, {"q": "Wer waren die „Trümmerfrauen“?", "a": "Frauen, die Schutt aus den zerstörten Städten räumten", "w": ["Frauen, die auf dem Schwarzmarkt handelten", "Krankenschwestern der Alliierten", "Abgeordnete im Parlamentarischen Rat"], "info": "Weil viele Männer tot oder in Gefangenschaft waren, übernahmen Frauen die Arbeit. Über acht Millionen Deutsche waren bei Kriegsende Kriegsgefangene."}, {"q": "Was war auf dem Schwarzmarkt die beliebteste Ersatzwährung?", "a": "Zigaretten", "w": ["Goldmünzen", "Reichsmarkscheine", "Briefmarken"], "info": "Die Reichsmark war fast nichts mehr wert. Wer Zigaretten hatte, konnte tauschen: Butter, Kartoffeln, Schnaps."}, {"q": "Mindestens wie viele Vertriebene lebten Ende Oktober 1946 in den vier Zonen?", "a": "Zehn Millionen", "w": ["Eine Million", "Drei Millionen", "Dreißig Millionen"], "info": "Am meisten nahmen Agrarländer wie Mecklenburg, Schleswig-Holstein, Niedersachsen und Bayern auf. Willkommen waren sie oft nicht."}, {"q": "Welche Zone schottete sich fast komplett gegen Vertriebene ab?", "a": "Die französische", "w": ["Die amerikanische", "Die britische", "Die sowjetische"], "info": "1947 lebten dort nur rund 50 000 Vertriebene, in der SBZ fast vier Millionen. Frankreich hielt so seine Kosten niedrig."}, {"q": "Warum ist „Stunde Null“ ein umstrittener Begriff?", "a": "Weil viel Personal und viele Denkweisen einfach weiterliefen", "w": ["Weil der Krieg um Mitternacht endete", "Weil die Alliierten ihn verboten", "Weil er erst 1990 erfunden wurde"], "info": "Der Staat brach zusammen, aber in Verwaltung, Justiz und Wirtschaft gab es viele Kontinuitäten. In der Klausur den Begriff in Anführungszeichen setzen."}]}, {"id": "jalta", "icon": "🤝", "title": "Die Großen Drei", "subtitle": "Teheran 1943 und Jalta 1945", "briefing": ["Die **Anti-Hitler-Koalition**: USA, Großbritannien und Sowjetunion. Ein Zweckbündnis mit sehr unterschiedlichen Zielen.", "**Teheran (1943)**: erstes Treffen von Roosevelt, Churchill und Stalin; Westverschiebung Polens im Grundsatz.", "**Jalta (Februar 1945)**: Besatzungszonen, Frankreich als vierte Macht, Curzon-Linie als Polens Ostgrenze, Kriegseintritt der UdSSR gegen Japan.", "Wichtig: In Jalta wurde **keine** Teilung in zwei Staaten beschlossen."], "questions": [{"q": "Wo liegt Jalta?", "a": "Auf der Halbinsel Krim", "w": ["In Polen", "Im Iran", "Bei Berlin"], "info": "Die Konferenz fand vom 4. bis 11. Februar 1945 im sowjetischen Badeort Jalta statt."}, {"q": "Wer saß in Jalta am Tisch?", "a": "Roosevelt, Churchill, Stalin", "w": ["Truman, Churchill, Stalin", "Roosevelt, de Gaulle, Stalin", "Truman, Attlee, Stalin"], "info": "Truman kam erst nach Roosevelts Tod im April 1945. Frankreich war nie eingeladen."}, {"q": "Was wollte Stalin in Jalta vor allem erreichen?", "a": "Osteuropa als sowjetische Einflusszone und hohe Reparationen", "w": ["Freie Wahlen in ganz Europa", "Einen schnellen Abzug der Roten Armee", "Einen Beitritt zur NATO"], "info": "Stalin schlug 20 Milliarden Dollar Reparationen vor, die Hälfte für die UdSSR. Beschlossen wurde die Summe nicht."}, {"q": "Was war Roosevelt besonders wichtig?", "a": "Stalins Kriegseintritt gegen Japan und die Gründung der UNO", "w": ["Die Zerschlagung Deutschlands in Kleinstaaten", "Ein Bündnis mit Frankreich", "Die Kontrolle über das Ruhrgebiet"], "info": "Stalin hielt Wort und erklärte Japan am 8. August 1945 den Krieg. Für die UNO setzte er ein Vetorecht der Großmächte durch."}, {"q": "Was setzte Churchill in Jalta für Frankreich durch?", "a": "Eine eigene Zone, einen Platz im Kontrollrat und einen Sektor in Berlin", "w": ["Die Teilnahme an der Potsdamer Konferenz", "Die Rückgabe von Elsass-Lothringen", "Den Vorsitz im Kontrollrat"], "info": "Stalin stimmte nur zu, weil die französische Zone aus der amerikanischen und britischen herausgeschnitten wurde."}, {"q": "Was ist die Curzon-Linie?", "a": "Die neue Ostgrenze Polens", "w": ["Die neue Westgrenze Polens", "Die Grenze zwischen den Zonen", "Eine Front am Rhein"], "info": "Polen verlor Land im Osten an die Sowjetunion und sollte dafür im Westen deutsches Gebiet bekommen."}, {"q": "Was versprachen die Großen Drei in der „Erklärung über das befreite Europa“?", "a": "Die Völker sollten ihre Regierungsform frei wählen dürfen.", "w": ["Europa sollte unter UN-Verwaltung kommen.", "Deutschland sollte sofort neu gewählt werden.", "Alle Grenzen von 1937 sollten gelten."], "info": "In seinem Machtbereich hielt Stalin dieses Versprechen nicht. Das verstärkte das Misstrauen des Westens."}, {"q": "Was wurde in Teheran 1943 vereinbart?", "a": "Eine zweite Front in Nordfrankreich", "w": ["Die Gründung der DDR", "Die Einführung der D-Mark", "Die Berliner Luftbrücke"], "info": "Die Westalliierten landeten im Juni 1944 in der Normandie. Außerdem wurde die Westverschiebung Polens im Grundsatz besprochen."}, {"q": "Was passierte mit dem Morgenthau-Plan, Deutschland zum Agrarland zu machen?", "a": "Er war schon Ende 1944 vom Tisch.", "w": ["Er wurde 1945 vollständig umgesetzt.", "Er wurde zur Grundlage des Grundgesetzes.", "Er galt bis 1955 in der US-Zone."], "info": "Briten und Amerikaner rechneten aus: Ein zerstückeltes, armes Deutschland schadet ganz Europa und auch ihnen selbst."}, {"q": "Wurde in Jalta die Teilung Deutschlands in zwei Staaten beschlossen?", "a": "Nein, nur Besatzungszonen", "w": ["Ja, mit der Elbe als Grenze", "Ja, aber geheim", "Nein, Deutschland sollte vier Staaten bilden"], "info": "Diese Falle kostet in Klausuren viele Punkte. Die Zonen waren Verwaltungsgebiete einer gemeinsamen Besatzung, keine Staatsgrenzen."}]}, {"id": "potsdam", "icon": "🏰", "title": "Showdown in Potsdam", "subtitle": "Die Potsdamer Konferenz 1945", "briefing": ["**17. Juli bis 2. August 1945**, Schloss Cecilienhof. Truman, Stalin und Churchill, ab 28. Juli Attlee. Frankreich fehlt.", "Die **„5 D“**: Denazifizierung, Demilitarisierung, Dezentralisierung, Demokratisierung, Demontage.", "**Reparationen** nach Zonen, obwohl Deutschland eine wirtschaftliche Einheit bleiben sollte. Ein Widerspruch.", "Gebiete östlich von **Oder und Neiße** unter polnische Verwaltung, offiziell bis zu einem Friedensvertrag."], "questions": [{"q": "Wo fand die Potsdamer Konferenz statt?", "a": "Im Schloss Cecilienhof", "w": ["Im Reichstag", "In Sanssouci", "Im Liwadija-Palast"], "info": "Das Schloss liegt am Jungfernsee, nahe der Berliner Stadtgrenze. Den Vorsitz führte auf Stalins Vorschlag Truman."}, {"q": "Warum wechselte die britische Delegation mitten in der Konferenz?", "a": "Churchill verlor die Wahl in Großbritannien.", "w": ["Churchill wurde krank.", "Churchill war beleidigt.", "Stalin verlangte es."], "info": "Ab dem 28. Juli verhandelte Clement Attlee von der Labour Party."}, {"q": "Welches Land war in Potsdam NICHT dabei?", "a": "Frankreich", "w": ["USA", "Sowjetunion", "Großbritannien"], "info": "Frankreich fühlte sich deshalb nicht gebunden und blockierte später im Kontrollrat zentrale deutsche Verwaltungen."}, {"q": "Welches dieser Ziele gehört zu den „5 D“?", "a": "Demilitarisierung", "w": ["Deregulierung", "Digitalisierung", "Diversifizierung"], "info": "Wehrmacht, SS, SA, Gestapo wurden aufgelöst, die Rüstungsindustrie sollte verschwinden."}, {"q": "Was bedeutete Dezentralisierung?", "a": "Selbstverwaltung in Gemeinden und Ländern, vorerst keine Zentralregierung", "w": ["Abriss der Städte", "Umzug der Hauptstadt nach Bonn", "Verteilung der Bevölkerung aufs Land"], "info": "Wahlen sollte es zunächst nur auf Gemeinde- und Landesebene geben. Das Grundgesetz ist bis heute föderal aufgebaut."}, {"q": "Wie wurden die Reparationen geregelt?", "a": "Jede Macht holt sie aus ihrer eigenen Zone.", "w": ["Feste Summe von 20 Milliarden Dollar", "Gar keine Reparationen", "Nur in Gold"], "info": "Die UdSSR bekam zusätzlich Anteile aus den Westzonen. Weil jede Zone für sich zahlte, wirtschafteten sie auch getrennt. Keim der Spaltung."}, {"q": "Was geschah mit den Gebieten östlich von Oder und Neiße?", "a": "Sie kamen unter polnische Verwaltung.", "w": ["Sie wurden eine fünfte Besatzungszone.", "Sie blieben deutsch.", "Sie kamen an Frankreich."], "info": "Das nördliche Ostpreußen mit Königsberg ging an die UdSSR. Die DDR erkannte die Grenze 1950 an, die Bundesrepublik endgültig erst 1990."}, {"q": "Wie nannte das Protokoll die Vertreibung der Deutschen aus Polen, der ČSR und Ungarn?", "a": "„Ordnungsgemäße Überführung“", "w": ["„Freiwillige Umsiedlung“", "„Heimkehr ins Reich“", "„Bevölkerungstausch“"], "info": "Die Vertreibungen liefen längst. Der Westen billigte sie damit nachträglich."}, {"q": "Was ist das „Potsdamer Abkommen“ juristisch?", "a": "Eine nicht bindende Willenserklärung", "w": ["Ein Friedensvertrag", "Die Kapitulationsurkunde", "Eine UN-Resolution"], "info": "Einen Friedensvertrag mit Deutschland gab es nie. Die abschließende Regelung kam erst 1990."}, {"q": "Warum gilt Potsdam als „Scheinkonsens“?", "a": "Alle unterschrieben dieselben Begriffe, verstanden darunter aber Verschiedenes.", "w": ["Weil niemand unterschrieb", "Weil Stalin früher abreiste", "Weil die USA das Protokoll fälschten"], "info": "„Demokratisierung“ hieß im Westen freie Wahlen, im Osten Umbau unter Führung der Kommunisten. Konkretes landete beim Kontrollrat, der sich kaum einigen konnte."}]}, {"id": "zonen", "icon": "🗺️", "title": "Vier Zonen, vier Wege", "subtitle": "Besatzungspolitik und Entnazifizierung", "briefing": ["**USA**: erst Strafe (Fragebögen, Spruchkammern), dann Wiederaufbau. **Briten**: pragmatisch. **Frankreich**: Sicherheit, Saar, Ruhr.", "**Sowjetunion**: Demontagen, Bodenreform, Enteignung der Industrie. Der Umbau der Gesellschaft beginnt sofort.", "**Nürnberger Prozess** 1945/46: zwölf Todesurteile gegen die NS-Führung.", "**April 1946**: Zwangsvereinigung von KPD und SPD zur **SED**."], "questions": [{"q": "Wo saß die amerikanische Militärregierung?", "a": "In Frankfurt am Main", "w": ["In München", "In Bonn", "In Baden-Baden"], "info": "Im ehemaligen Verwaltungsgebäude der IG Farben. Baden-Baden war der Sitz der Franzosen."}, {"q": "Was musste in der US-Zone jeder Erwachsene ausfüllen?", "a": "Einen Fragebogen zur NS-Vergangenheit", "w": ["Einen Antrag auf Lebensmittelkarten in Englisch", "Einen Treueeid auf die USA", "Einen Steuerbogen"], "info": "Bis Dezember 1945 kamen rund 900 000 Fragebögen zusammen. Danach entschieden Spruchkammern."}, {"q": "Was war ein „Persilschein“?", "a": "Eine entlastende Bescheinigung für das Entnazifizierungsverfahren", "w": ["Ein Gutschein für Waschmittel", "Ein Passierschein nach Berlin", "Eine Lebensmittelkarte"], "info": "Bekannte bestätigten sich gegenseitig, „sauber“ zu sein. Viele Belastete wurden so zu „Mitläufern“."}, {"q": "Wie viele Todesurteile fällte der Nürnberger Hauptkriegsverbrecherprozess?", "a": "Zwölf", "w": ["Keines", "Drei", "Hundert"], "info": "Urteil am 1. Oktober 1946. Seitdem gilt: Ein Staatsamt schützt nicht vor Strafe für Verbrechen gegen die Menschlichkeit."}, {"q": "Was waren die Speziallager in der SBZ?", "a": "Sowjetische Internierungslager, auch für politische Gegner", "w": ["Ferienlager der FDJ", "Lager für Displaced Persons", "Kriegsgefangenenlager der Amerikaner"], "info": "Rund 150 000 Menschen saßen dort zwischen 1945 und 1950, etwa 70 000 starben. Einige Lager lagen in den früheren KZ Buchenwald und Sachsenhausen."}, {"q": "Wofür stand die Losung „Junkerland in Bauernhand“?", "a": "Für die Bodenreform in der SBZ", "w": ["Für den Marshallplan", "Für die Währungsreform", "Für die Kollektivierung in Bayern"], "info": "Alle Güter über 100 Hektar wurden 1945 ohne Entschädigung enteignet und verteilt. Die neuen Höfe waren oft zu klein zum Überleben."}, {"q": "Wer war die „Gruppe Ulbricht“?", "a": "Kommunisten aus dem Moskauer Exil, die ab April 1945 Berlin verwalteten", "w": ["Ein Widerstandskreis gegen Hitler", "Berater von Adenauer", "Eine Band aus Ost-Berlin"], "info": "Sie kamen am 30. April 1945 und besetzten Schlüsselposten, vor allem im Inneren und beim Personal."}, {"q": "Was zeigte die Urabstimmung der West-Berliner SPD im März 1946?", "a": "82 Prozent waren gegen eine sofortige Fusion mit der KPD.", "w": ["Fast alle wollten die SED.", "Die SPD löste sich auf.", "Die Abstimmung wurde verboten."], "info": "In der SBZ durfte nicht abgestimmt werden. Die SED-Gründung im April 1946 war eine Zwangsvereinigung."}, {"q": "Welches Ziel hatte Frankreich in seiner Zone?", "a": "Sicherheit vor Deutschland, etwa durch Abtrennung der Saar", "w": ["Möglichst schnelle Wiedervereinigung", "Aufnahme vieler Vertriebener", "Ein starker Zentralstaat"], "info": "Nach drei Kriegen mit Deutschland seit 1870 stand Sicherheit ganz oben. Die Saar kam 1946 ins französische Zollgebiet."}, {"q": "In welcher Zone spielten Demontagen die größte Rolle?", "a": "In der sowjetischen Zone", "w": ["In der amerikanischen Zone", "In der britischen Zone", "Überall gleich"], "info": "Rund 30 Prozent der Industrie der SBZ wurden abgebaut und in die UdSSR gebracht. Im Westen waren die Bombenschäden größer."}]}, {"id": "bruch", "icon": "❄️", "title": "Der Bruch", "subtitle": "Truman, Marshall, Shdanow 1946/47", "briefing": ["**1946**: Churchill spricht vom **„Eisernen Vorhang“**, US-Außenminister **Byrnes** kündigt in Stuttgart den Wiederaufbau an.", "**1.1.1947**: Bizone aus US- und britischer Zone.", "**März 1947**: Truman-Doktrin, Politik der **Eindämmung** (Containment). **Juni 1947**: Marshallplan.", "**September 1947**: Shdanows **Zwei-Lager-Theorie** und Gründung des Kominform."], "questions": [{"q": "Wer prägte 1946 das Bild vom „Eisernen Vorhang“?", "a": "Winston Churchill", "w": ["Harry S. Truman", "Josef Stalin", "Konrad Adenauer"], "info": "In seiner Rede in Fulton (USA) am 5. März 1946: Von Stettin bis Triest sei ein Eiserner Vorhang über Europa niedergegangen."}, {"q": "Was kündigte Byrnes in Stuttgart im September 1946 an?", "a": "Wiederaufbau statt Bestrafung", "w": ["Den Abzug der US-Armee", "Die Teilung Berlins", "Den Morgenthau-Plan"], "info": "Die USA wollten ein wirtschaftlich gesundes Deutschland, auch damit Europa auf die Beine kommt."}, {"q": "Warum gründeten Briten und Amerikaner die Bizone?", "a": "Um Kosten zu sparen und die Wirtschaft anzukurbeln", "w": ["Um Frankreich zu ärgern", "Um eine Armee aufzubauen", "Weil Stalin es wollte"], "info": "Großbritannien konnte die Versorgung kaum noch zahlen. Faktisch war die Bizone ein Vorgriff auf den Weststaat."}, {"q": "Wie heißt die Politik, die Truman 1947 verkündete?", "a": "Containment (Eindämmung)", "w": ["Appeasement", "Rollback", "Entspannung"], "info": "Die USA wollten freie Völker gegen kommunistischen Druck unterstützen, zuerst Griechenland und die Türkei."}, {"q": "Wofür steht ERP?", "a": "European Recovery Program, also den Marshallplan", "w": ["Europäische Rüstungs-Partnerschaft", "Einheitliche Reichs-Partei", "Ein Raketenprogramm"], "info": "Rund 13 Milliarden Dollar flossen nach Westeuropa. Ziel: Elend beseitigen, damit der Kommunismus keinen Nährboden findet."}, {"q": "Wie reagierte die Sowjetunion auf den Marshallplan?", "a": "Sie lehnte ab und hielt Osteuropa davon fern.", "w": ["Sie nahm begeistert teil.", "Sie bekam den größten Anteil.", "Sie verlangte einen eigenen Plan für Berlin."], "info": "Polen und die Tschechoslowakei hätten gern mitgemacht, durften aber nicht."}, {"q": "Was besagt Shdanows Zwei-Lager-Theorie?", "a": "Die Welt ist in ein imperialistisches und ein demokratisches Lager geteilt.", "w": ["Deutschland soll zwei Hauptstädte haben.", "Es gibt zwei Arten von Flüchtlingslagern.", "Ost und West sollen sich einigen."], "info": "Das imperialistische Lager führen die USA, das „demokratische“ die UdSSR. Spiegelbildlich zu Trumans „zwei Lebensweisen“."}, {"q": "Was symbolisiert die Münchener Ministerpräsidentenkonferenz vom Juni 1947?", "a": "Das Scheitern gesamtdeutscher Zusammenarbeit", "w": ["Die Gründung der Bundesrepublik", "Die Einführung der D-Mark", "Den Beginn der Luftbrücke"], "info": "Die Ministerpräsidenten aus dem Osten reisten vor Beginn wieder ab. Bis 1970 blieb es der einzige offizielle Dialog auf höchster Ebene."}, {"q": "Was geschah am 20. März 1948 im Alliierten Kontrollrat?", "a": "Der sowjetische Vertreter Sokolowski verließ ihn.", "w": ["Er beschloss eine gemeinsame Währung.", "Er wählte Adenauer.", "Er tagte erstmals."], "info": "Damit war die gemeinsame Verwaltung Deutschlands am Ende. Anlass war die Londoner Konferenz der Westmächte ohne die UdSSR."}, {"q": "Wer trägt die Schuld am Kalten Krieg? Was sagen viele heutige Historiker?", "a": "Beide Seiten schaukelten sich durch Misstrauen gegenseitig hoch.", "w": ["Nur die USA", "Nur die Sowjetunion", "Nur die Deutschen"], "info": "Das ist die postrevisionistische Sicht. In der Klausur: beide Positionen nennen, dann mit Kriterium urteilen."}]}, {"id": "luftbruecke", "icon": "✈️", "title": "Rosinenbomber", "subtitle": "Währungsreform und Berlin-Blockade 1948/49", "briefing": ["**20. Juni 1948**: D-Mark im Westen; Ludwig Erhard gibt viele Preise frei. Drei Tage später eigene Währung im Osten.", "**24. Juni 1948**: Die Sowjetunion sperrt alle Land- und Wasserwege nach West-Berlin.", "Die Westmächte versorgen die Stadt fast ein Jahr lang über die **Luftbrücke**.", "**12. Mai 1949**: Ende der Blockade. Ergebnis: Der Weststaat kommt schneller."], "questions": [{"q": "Warum gab es keine gemeinsame Währungsreform aller vier Zonen?", "a": "Moskau wollte eine deutsche Zentralbank, die USA nicht.", "w": ["Es fehlte Papier für die Scheine.", "Frankreich wollte die Reichsmark behalten.", "Die Deutschen stimmten dagegen."], "info": "Es ging um Macht über die Geldpolitik und damit um Markt- oder Planwirtschaft."}, {"q": "Wie wurden Sparguthaben bei der Währungsreform umgestellt?", "a": "Zehn Reichsmark wurden zu einer D-Mark.", "w": ["Eins zu eins", "Hundert zu eins", "Gar nicht"], "info": "Löhne, Renten und Mieten wurden 1:1 umgestellt. Wer Häuser oder Waren besaß, war fein raus. Sparer verloren viel."}, {"q": "Was passierte direkt nach der Währungsreform in den Westzonen?", "a": "Die Schaufenster füllten sich über Nacht.", "w": ["Es gab eine Hungersnot.", "Alle Geschäfte schlossen.", "Die Preise wurden eingefroren."], "info": "Händler hatten Waren zurückgehalten. Mit gutem Geld lohnte sich der Verkauf wieder. Die D-Mark wurde zum Gründungsmythos der Bundesrepublik."}, {"q": "Wann begann die Berlin-Blockade?", "a": "In der Nacht zum 24. Juni 1948", "w": ["Am 1. Mai 1945", "Am 13. August 1961", "Am 7. Oktober 1949"], "info": "Auch der Strom aus dem Osten wurde abgestellt. Der 13. August 1961 ist der Mauerbau."}, {"q": "Was wollte Stalin mit der Blockade erreichen?", "a": "Den westdeutschen Staat verhindern und ganz Berlin kontrollieren", "w": ["Berlin vor Bomben schützen", "Den Marshallplan bekommen", "Eine Olympiade vorbereiten"], "info": "Das ging nach hinten los: Die Blockade beschleunigte die Gründung der Bundesrepublik."}, {"q": "Wie wurde West-Berlin während der Blockade versorgt?", "a": "Über drei Luftkorridore mit Flugzeugen", "w": ["Mit Schiffen über die Spree", "Durch einen Tunnel", "Mit Lastwagen der Roten Armee"], "info": "Die Berliner nannten die Flugzeuge „Rosinenbomber“, weil Piloten Süßigkeiten für Kinder abwarfen."}, {"q": "Wie lange dauerte die Blockade?", "a": "Knapp elf Monate", "w": ["Zwei Wochen", "Fünf Jahre", "Drei Tage"], "info": "Vom 24. Juni 1948 bis zum 12. Mai 1949. Die Luftbrücke flog sicherheitshalber noch bis in den Herbst weiter."}, {"q": "Wie änderte die Blockade das Verhältnis der West-Berliner zu den Westalliierten?", "a": "Aus Besatzern wurden Schutzmächte.", "w": ["Sie forderten den Abzug der Alliierten.", "Nichts änderte sich.", "Sie wandten sich der UdSSR zu."], "info": "West-Berlin wurde weltweit zum Symbol der Freiheit."}, {"q": "Welches Bündnis wurde während der Blockade gegründet?", "a": "Die NATO am 4. April 1949", "w": ["Der Warschauer Pakt", "Die EWG", "Der RGW"], "info": "Die Blockade zeigte dem Westen, dass er militärisch zusammenstehen muss. Der Warschauer Pakt folgte erst 1955."}, {"q": "Welche Folge hatte die Blockade für die Stadt Berlin selbst?", "a": "Die Stadtverwaltung spaltete sich in Ost und West.", "w": ["Berlin wurde wiedervereinigt.", "Berlin wurde Hauptstadt der Bundesrepublik.", "Berlin kam unter UN-Verwaltung."], "info": "Im Herbst 1948 gab es zwei Stadtverwaltungen. Die Teilung Berlins war vollzogen, lange vor der Mauer."}]}, {"id": "staaten", "icon": "🏛️", "title": "Zwei Staaten entstehen", "subtitle": "Bundesrepublik und DDR 1949", "briefing": ["**1. Juli 1948**: Frankfurter Dokumente. Die Ministerpräsidenten sollen eine Verfassung ausarbeiten lassen; sie wollen nur ein **Provisorium**.", "**1. September 1948**: Parlamentarischer Rat in Bonn (Präsident Adenauer). **23. Mai 1949**: Grundgesetz verkündet.", "Lehren aus Weimar: **konstruktives Misstrauensvotum**, Ewigkeitsklausel, schwacher Bundespräsident.", "**7. Oktober 1949**: DDR gegründet, vorbereitet durch die SED-Volkskongressbewegung und Einheitslisten."], "questions": [{"q": "Wer übergab den Ministerpräsidenten die Frankfurter Dokumente?", "a": "Die drei westlichen Militärgouverneure", "w": ["Stalin", "Der Bundestag", "Die UNO"], "info": "Am 1. Juli 1948 im IG-Farben-Haus in Frankfurt. Das war kskongress in der SBZ gewählt?", "a": "Über eine Einheitsliste ohne echte Auswahl", "w": ["In freien Wahlen mit vielen Parteien", "Per Los", "Gar nicht, er wurde ernannt"], "info": "Selbst offiziell stimmten nur rund zwei Drittel mit Ja. Der Volkskongress nahm die DDR-Verfassung an."}, {"q": "Wer wurde erster Präsident der DDR?", "a": "Wilhelm Pieck", "w": ["Walter Ulbricht", "Erich Honecker", "Otto Grotewohl"], "info": "Grotewohl wurde Ministerpräsident. Die eigentliche Macht hatte die SED um Walter Ulbricht."}, {"q": "Warum wurde die DDR erst nach der Bundesrepublik gegründet?", "a": "Um dem Westen die Schuld an der Spaltung zuzuschieben", "w": ["Weil Stalin im Urlaub war", "Weil die Verfassung verloren ging", "Weil der Westen es verlangte"], "info": "Die wichtigsten Weichen (Bodenreform, Enteignungen, SED) waren im Osten aber schon 1945/46 gestellt."}]}, {"id": "bloecke", "icon": "🧱", "title": "Blöcke, Aufstand, Ultimatum", "subtitle": "Kalter Krieg 1950 bis 1959", "briefing": ["**Westintegration**: EGKS 1951, Pariser Verträge und NATO 1955, EWG 1957. Adenauers Motto: Freiheit vor Einheit.", "**Stalin-Note 1952**: neutrales Gesamtdeutschland. Der Westen lehnt ab. Chance oder Störmanöver?", "**17. Juni 1953**: Volksaufstand in der DDR, niedergeschlagen von sowjetischen Panzern.", "**1955** Warschauer Pakt, **1956** Ungarn, **1957** Sputnik, **1958** Berlin-Ultimatum."], "questions": [{"q": "Welcher Krieg löste ab 1950 die Debatte um deutsche Soldaten aus?", "a": "Der Koreakrieg", "w": ["Der Vietnamkrieg", "Der Suezkrieg", "Der Algerienkrieg"], "info": "Viele fürchteten, Deutschland könne das nächste Korea werden. Nebenbei brachte der Korea-Boom das Wirtschaftswunder in Schwung."}, {"q": "Was bot Stalin in seiner Note vom März 1952 an?", "a": "Ein vereintes, neutrales Deutschland mit eigener Armee", "w": ["Die Rückgabe Ostpreußens", "Den NATO-Beitritt ganz Deutschlands", "Freie Wahlen unter UN-Aufsicht"], "info": "Die Westmächte verlangten zuerst freie Wahlen. Weni       title = "Mission gescheitert"; sub = "Alle Leben weg. Die gesammelten XP behältst du. Lies das Briefing noch einmal und versuch es erneut.";
    }
    P.mis[m.id] = rec;
  } else if (G.mode === "blitz") {
    const rec = G.right > P.blitzBest; P.blitzBest = Math.max(P.blitzBest, G.right);
    title = rec ? "Neuer Rekord!" : "Zeit abgelaufen"; sub = `${G.right} Treffer, ${G.errors} Fehler. Dein Rekord: ${P.blitzBest}.`;
  } else {
    title = "Fehlertraining beendet"; sub = `${G.right} von ${G.queue.length} sitzen jetzt.${P.wrong.length ? ` Noch offen: ${P.wrong.filter(fromKey).length}.` : " Deine Fehlerliste ist leer."}`;
  }
  P.xp += extra; touchStreak();
  const nb = newBadges(); save();
  const up = rank() > prevRank;
  app.innerHTML = `<div class="wrap"><div class="card result">
    <span class="eyebrow">${G.mode === "mission" ? "Mission " + (G.mi + 1) + " · " + esc(M[G.mi].title) : G.mode === "blitz" ? "Blitzrunde" : "Fehlertraining"}</span>
    ${starsNow !== null ? `<div class="stars" aria-label="${starsNow} Sterne">${starStr(starsNow)}</div>` : `<div class="stars" style="font-size:2.6rem">${G.mode === "blitz" ? "⏱️" : G.mode === "fix" ? "🛠️" : "💔"}</div>`}
    <h1>${esc(title)}</h1><p class="muted">${esc(sub)}</p>
    <div class="gain"><div><b>+${G.xp + extra}</b><span class="muted">XP</span></div><div><b>${G.maxCombo}</b><span class="muted">beste Combo</span></div><div><b>${esc(RANKS[rank()].name)}</b><span class="muted">${up ? "Aufgestiegen!" : "Rang"}</span></div></div>
    ${nb.length ? `<div class="newb"><strong>Neues Abzeichen${nb.length > 1 ? "" : ""}:</strong> ${nb.map(b => b.e + " " + esc(b.name)).join(" · ")}</div>` : ""}
    <div class="row" style="justify-content:center">
      ${G.mode === "mission" ? `<button class="btn" id="again">Nochmal</button>${starsNow && G.mi < M.length - 1 ? `<button class="btn primary" id="nextm">Nächste Mission</button>` : ""}` : ""}
      ${G.mode === "blitz" ? `<button class="btn" id="again">Noch eine Runde</button>` : ""}
      <button class="btn${G.mode === "mission" && starsNow && G.mi < M.length - 1 ? "" : " primary"}" id="home">Zur Übersicht</button></div></div></div>`;
  const a = document.getElementById("again"); if (a) a.onclick = () => G.mode === "blitz" ? blitz() : briefing(G.mi);
  const n = document.getElementById("nextm"); if (n) n.onclick = () => briefing(G.mi + 1);
  document.getElementById("home").onclick = home;
  if (starsNow === 3 || up || (G.mode === "blitz" && G.right >= 10)) confetti();
  window.scrollTo({ top: 0 });
}

function confetti() {
  const c = document.createElement("div"); c.className = "confetti";
  const col = ["#5b3fd6", "#2f80ed", "#e0a100", "#1f8a4c", "#c8372d", "#ff7ab6"];
  for (let i = 0; i < 60; i++) { const s = document.createElement("i"); s.style.left = Math.random() * 100 + "%"; s.style.background = col[i % col.length]; s.style.animationDelay = Math.random() * .8 + "s"; c.appendChild(s) }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3500);
}

/* ---------- Spezialmodi ---------- */
function blitzQueue() {
  const pool = [];
  M.forEach((m, mi) => { if ((P.mis[m.id] || {}).stars > 0) m.questions.forEach((_, qi) => pool.push({ mi, qi })) });
  return shuffle(pool);
}
function blitz() { const q = blitzQueue(); if (!q.length) return home(); play({ mode: "blitz", queue: q }) }
function tickBlitz() {
  if (!G || G.mode !== "blitz") return stopTimer();
  const left = Math.max(0, Math.ceil((G.end - Date.now()) / 1000));
  const t = document.getElementById("time"); if (t) { t.textContent = left + " s"; t.classList.toggle("low", left <= 10) }
  if (left <= 0) { stopTimer(); G.locked = true; finish() }
}
function fixRound() {
  const q = shuffle(P.wrong.map(fromKey).filter(Boolean)).slice(0, 10);
  if (!q.length) return home();
  play({ mode: "fix", queue: q });
}

home();
</script>
