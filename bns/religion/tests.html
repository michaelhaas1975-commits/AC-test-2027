<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: Prüfungsraum am iPad. Feste Kopfleiste mit Uhr, Nummernleiste, eine Aufgabe je Bildschirm, große Antwortflächen. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #18232f; --muted: #5b6876; --line: #d6dde4;
  --accent: #1d4e6b; --accent-soft: #e3edf3; --mark: #b86b12; --mark-soft: #fbefdf;
  --ok: #2d7a46; --ok-soft: #e2f1e6; --bad: #b23a2e; --bad-soft: #f8e4e1;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10171e; --surface: #18222c; --ink: #e6edf3; --muted: #9aa8b5; --line: #2c3a47;
  --accent: #7fb6d6; --accent-soft: #1f3341; --mark: #e2a24e; --mark-soft: #3a2a14;
  --ok: #6fc28a; --ok-soft: #173223; --bad: #ef8a7d; --bad-soft: #3a1c18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10171e; --surface: #18222c; --ink: #e6edf3; --muted: #9aa8b5; --line: #2c3a47;
  --accent: #7fb6d6; --accent-soft: #1f3341; --mark: #e2a24e; --mark-soft: #3a2a14;
  --ok: #6fc28a; --ok-soft: #173223; --bad: #ef8a7d; --bad-soft: #3a1c18; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--f-body); -webkit-tap-highlight-color: transparent }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h1 { font-size: 2rem } h2 { font-size: 1.35rem } h3 { font-size: 1.05rem }
.eyebrow { font: 700 .74rem/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none }
button:focus-visible, .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 18px; min-height: 48px; font-weight: 700 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.btn.warn { color: var(--mark); border-color: var(--mark) }
.btn.on { background: var(--mark-soft); border-color: var(--mark); color: var(--mark) }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center }
.muted { color: var(--muted) }

/* Startseite */
.hero { display: grid; gap: 10px; padding-block: 18px 26px }
.hero p { max-width: 62ch; margin: 0 }
.tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 10px; align-content: start }
.card .meta { font-family: var(--f-mono); font-size: .85rem; color: var(--muted) }
.card .last { font-size: .9rem; border-top: 1px solid var(--line); padding-top: 10px; min-height: 2.8em }
.rules { margin-top: 26px; background: var(--accent-soft); border-radius: 14px; padding: 18px 20px }
.rules ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 4px }

/* Testansicht */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar .in { max-width: 920px; margin: 0 auto; display: flex; gap: 14px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar .title { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.clock { font: 700 1.35rem/1 var(--f-mono); font-variant-numeric: tabular-nums; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent) }
.clock.low { background: var(--bad-soft); color: var(--bad) }
.strip { display: grid; grid-template-columns: repeat(min(var(--n, 15), 15), minmax(0, 1fr)); gap: 5px; margin-block: 16px 20px }
.strip button { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font: 700 .9rem var(--f-mono); position: relative; padding: 0 }
.strip button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.strip button.cur { outline: 3px solid var(--ink); outline-offset: 1px }
.strip button.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--mark) }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(8, minmax(0, 1fr)) } }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 14px; min-width: 0 }
.panel p { margin: 0 }
.passage { background: var(--bg); border-left: 4px solid var(--accent); border-radius: 6px; padding: 14px 16px; display: grid; gap: 8px }
.passage .t { font-weight: 700 }
.tbl { overflow-x: auto } table { border-collapse: collapse; font-size: .92rem; margin: 0 auto; font-variant-numeric: tabular-nums }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left } th { background: var(--accent-soft) }
.fig { text-align: center } .fig img { max-width: 100%; border-radius: 6px; background: #fff; cursor: zoom-in }
.fig.m img { width: 640px } body.k-fig .fig.m img { width: 360px } .fig.o img { width: 100% }
.stmts { display: grid; gap: 8px } .stmt { display: grid; grid-template-columns: 2.2em 1fr; gap: 6px }
.stmt b { font-family: var(--f-mono) }
.opts { display: grid; gap: 10px } .opts.grid8 { grid-template-columns: repeat(8, minmax(0, 1fr)) } .opts.grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)) }
@media (max-width: 560px) { .opts.grid8 { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.opt { display: flex; gap: 14px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px; min-height: 56px }
.opt .l { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 1rem var(--f-mono); background: var(--bg) }
.opt.sel { border-color: var(--accent); background: var(--accent-soft) } .opt.sel .l { background: var(--accent); color: var(--surface) }
.opts.grid8 .opt, .opts.grid4 .opt { justify-content: center; padding: 10px 4px }
.nav { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; margin-top: 18px }

/* Dialog und Zoom */
.veil { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 22, .55); display: grid; place-items: center; padding: 20px }
.dialog { background: var(--surface); border-radius: 16px; padding: 24px; max-width: 460px; width: 100%; display: grid; gap: 14px }
.zoom { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 22, .9); overflow: auto; display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 16px }
.zoom img { max-width: none; width: min(1500px, 220vw); background: #fff; border-radius: 6px }
.zoom .close { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); z-index: 31 }

/* Auswertung */
.score { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px }
.score .big { font: 700 3.2rem/1 var(--f-display) } .score .big small { font-size: 1.4rem; color: var(--muted) }
.bars { display: grid; grid-template-columns: repeat(min(var(--n, 15), 20), minmax(0, 1fr)); gap: 4px; margin-top: 10px }
.bars span { height: 12px; border-radius: 3px; background: var(--line) } .bars .r { background: var(--ok) } .bars .f { background: var(--bad) }
.list { display: grid; gap: 10px; margin-top: 20px }
.res { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.res > button { width: 100%; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 0; background: none; text-align: left }
.tag { font: 700 .78rem var(--f-mono); padding: 4px 8px; border-radius: 6px; flex: none }
.tag.r { background: var(--ok-soft); color: var(--ok) } .tag.f { background: var(--bad-soft); color: var(--bad) } .tag.e { background: var(--bg); color: var(--muted) }
.res .body { padding: 0 16px 16px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px }
.res .body p { margin: 0 }
.res .q { font-size: .92rem; color: var(--muted) }
.solimg img { width: 220px; max-width: 100% }
math { font-size: 1.1em } mfrac { font-size: .95em } .opt math { font-size: 1.15em }
.free { display: grid; gap: 10px } .free input { font: 700 1.4rem var(--f-mono); padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); width: 100%; max-width: 360px }
.free input:focus { outline: none; border-color: var(--accent) } .keys { display: flex; gap: 8px; flex-wrap: wrap } .keys .btn { min-width: 56px; font-family: var(--f-mono) }
@media (prefers-reduced-motion: no-preference) { .opt, .strip button { transition: background .12s, border-color .12s } }
</style>
</head>

<script>
const DATA = {"key": "bns-religion-tests", "label": "Religion · Übungstests", "description": "Fünf Tests zu je 20 Aufgaben und 30 Minuten: Menschenbild (Beigbeder, Wuketits, Gen 3), Hobbes und Rousseau, Jossua über das Böse, philosophische Theodizee und das Buch Ijob. Test 5 prüft auf Klausurniveau.", "tests": [{"name": "Test 1 · Wie gut ist der Mensch? Beigbeder, Wuketits, Gen 3", "level": "Grundlagen", "minutes": 30, "intro": null, "items": [{"num": 1, "stem": [], "question": "Wofür steht der Titel von Beigbeders Roman „39,90“?", "options": ["Für das Gehalt eines Praktikanten pro Tag", "Für das Alter des Erzählers beim Ausstieg", "Für den Preis des Buches in D-Mark", "Für die Zahl der Agenturen in Paris"], "answer": 2, "answer_label": "C (Für den Preis des Buches in D-Mark)", "solution": ["Der Titel ist identisch mit dem Ladenpreis. Er zeigt ironisch, dass in der beschriebenen Welt alles eine Ware ist, auch das Buch, das diese Welt kritisiert."]}, {"num": 2, "stem": [], "question": "Welche Lebensregel lässt sich aus Beigbeders „zehn Geboten eines Kreativen“ ableiten?", "options": ["Gute Arbeit für den Kunden geht immer vor der eigenen Karriere.", "Pünktlichkeit und Verlässlichkeit schaffen Vertrauen bei Kunden.", "Andere Menschen sind Mittel zum eigenen Erfolg.", "Kollegen soll man ehrlich loben und gezielt fördern, wo es geht."], "answer": 2, "answer_label": "C (Andere Menschen sind Mittel zum eigenen Erfolg.)", "solution": ["Praktikanten sind „wegwerfbar“, Kunden werden erniedrigt, Kollegen getäuscht. Die drei falschen Antworten kehren die Gebote 1, 10 und 4 ins Gegenteil."]}, {"num": 3, "stem": [], "question": "Was steht in Lk 10,25–28?", "options": ["Die Gottesrede an Ijob aus dem Wettersturm", "Das Doppelgebot der Gottes- und Nächstenliebe", "Die Goldene Regel im Wortlaut der Bergpredigt", "Die Erzählung vom Sündenfall im Paradies"], "answer": 1, "answer_label": "B (Das Doppelgebot der Gottes- und Nächstenliebe)", "solution": ["Jesus antwortet dem Gesetzeslehrer mit dem Doppelgebot; darauf folgt das Gleichnis vom barmherzigen Samariter.", "Die Goldene Regel im engeren Sinn steht in Mt 7,12 und Lk 6,31."]}, {"num": 4, "stem": [], "question": "Wie verhalten sich Beigbeders Gebote zum Doppelgebot der Liebe?", "options": ["Sie bestätigen es, denn sie fordern Achtung für Kollegen.", "Sie kehren es um: Der Nächste wird Werkzeug oder Rivale.", "Sie haben keinen Bezug, weil sie nur von Werbung handeln.", "Sie ergänzen es um Regeln für den beruflichen Erfolg."], "answer": 1, "answer_label": "B (Sie kehren es um: Der Nächste wird Werkzeug oder Rivale.)", "solution": ["Die Parodie des Dekalogs macht sichtbar, was geschieht, wenn Selbstliebe ohne Nächstenliebe zum Maßstab wird."]}, {"num": 5, "stem": [], "question": "Wie beantwortet Wuketits die Frage, ob der Mensch von Natur aus gut oder böse ist?", "options": ["Der Mensch ist von Natur aus gut, wie Rousseau meint.", "Er hält sie für irrelevant: Der Mensch ist keines von beiden.", "Der Mensch ist gut, wird aber durch Religion böse.", "Der Mensch ist von Natur aus böse, wie schon Hobbes gezeigt hat."], "answer": 1, "answer_label": "B (Er hält sie für irrelevant: Der Mensch ist keines von beiden.)", "solution": ["Am Anfang stand „jenseits jeder Moral“ nur das Problem zu überleben. Gut und böse sind moralische Kategorien, die erst später entstanden."]}, {"num": 6, "stem": [], "question": "Was meint Wuketits mit der Aussage, Egoismus und Altruismus seien „innig miteinander verwoben“?", "options": ["Egoismus entsteht erst durch Erziehung, Altruismus ist angeboren.", "Altruismus ist nur eine Maske; in Wahrheit gibt es nur Egoismus.", "Beide dienen dem Überleben und greifen ineinander.", "Beide schließen sich aus; jeder Mensch hat nur eine der beiden Anlagen."], "answer": 2, "answer_label": "C (Beide dienen dem Überleben und greifen ineinander.)", "solution": ["Beispiel: Wer bei der Jagd teilt, kann später auf Hilfe hoffen. Die Behauptung, Altruismus sei nur eine Maske, übertreibt; Wuketits leugnet Altruismus nicht."]}, {"num": 7, "stem": [], "question": "Wie bezeichnet Wuketits den Gedanken der Menschlichkeit?", "options": ["Als spätes Kulturprodukt", "Als Erfindung der Aufklärung um 1750", "Als göttliches Gebot seit der Schöpfung", "Als Keim, aus dem die Evolution hervorging"], "answer": 0, "answer_label": "A (Als spätes Kulturprodukt)", "solution": ["Moralische Probleme spielten die längste Zeit der Evolution keine Rolle. Daraus folgt für Wuketits, dass „moralisches Scheitern“ alltäglich ist."]}, {"num": 8, "stem": [], "question": "Welche Frage stellt Wuketits am Ende seines Textes?", "options": ["Ob der Staat die Menschen durch Gesetze dauerhaft bessern kann", "Ob moralisches Sollen im Rahmen unseres Könnens liegt", "Ob Gott das Böse in der Welt zulassen darf, ohne schuldig zu werden", "Ob die Steinzeit eine friedliche Epoche ohne Gewalt gewesen ist"], "answer": 1, "answer_label": "B (Ob moralisches Sollen im Rahmen unseres Könnens liegt)", "solution": ["Wenn Moral ein spätes Produkt ist, kann sie uns überfordern. Wuketits will damit nichts entschuldigen, aber die Ansprüche realistisch prüfen."]}, {"num": 9, "stem": [], "question": "Welcher Einwand gegen Wuketits ist philosophisch am stärksten?", "options": ["Die Evolutionstheorie ist wissenschaftlich nicht belegt.", "Biologen dürfen sich nicht zu Moral äußern.", "Aus der Entstehung einer Moral folgt nichts über ihre Gültigkeit.", "Jäger und Sammler lebten ganz ohne Konflikte."], "answer": 2, "answer_label": "C (Aus der Entstehung einer Moral folgt nichts über ihre Gültigkeit.)", "solution": ["Man nennt das die Unterscheidung von Genese und Geltung. Die anderen Antworten sind sachlich falsch oder bloße Abwehr."]}, {"num": 10, "stem": [], "question": "Welche Aussage gibt Gen 1,31 wieder?", "options": ["Der Mensch ist böse von Jugend an.", "Ihr werdet wie Gott.", "Im Schweiß deines Angesichts sollst du dein Brot essen.", "Gott sah alles an, was er gemacht hatte: Es war sehr gut."], "answer": 3, "answer_label": "D (Gott sah alles an, was er gemacht hatte: Es war sehr gut.)", "solution": ["Die Schöpfung ist gut; deshalb muss Gen 3 erklären, woher das Böse kommt. „Ihr werdet wie Gott“ ist das Versprechen der Schlange (Gen 3,5), der Satz vom Schweiß ein Strafspruch (Gen 3,19), „böse von Jugend an“ steht in Gen 8,21."]}, {"num": 11, "stem": [], "question": "Was bedeutet Sünde im theologischen Sinn, wie das Arbeitsblatt es formuliert?", "options": ["Die Trennung der Beziehung zwischen Gott und Mensch", "Die Lust am Essen verbotener Früchte im Garten Eden", "Jeder einzelne Verstoß gegen eine kirchliche Vorschrift oder Regel", "Die Unvollkommenheit alles Geschaffenen"], "answer": 0, "answer_label": "A (Die Trennung der Beziehung zwischen Gott und Mensch)", "solution": ["Sünde ist zuerst ein Beziehungsbruch. Die Unvollkommenheit des Geschaffenen nennt Leibniz malum metaphysicum."]}, {"num": 12, "stem": [], "question": "Womit lockt die Schlange in Gen 3?", "options": ["Mit dem Angebot, Herrschaft über die Tiere zu erhalten", "Mit der Drohung, sonst aus dem Paradies verjagt zu werden", "Mit der Aussicht auf ewiges Leben im Garten Eden", "Mit dem Versprechen, wie Gott zu sein"], "answer": 3, "answer_label": "D (Mit dem Versprechen, wie Gott zu sein)", "solution": ["Das Böse erscheint als Misstrauen gegen Gott und als Wunsch, sich selbst an Gottes Stelle zu setzen."]}, {"num": 13, "stem": [], "question": "Welche Folge des Essens beschreibt Gen 3 NICHT?", "options": ["Die Menschen verlieren ihre Fähigkeit zur Freiheit.", "Sie schieben die Schuld auf andere ab.", "Die Arbeit wird zur Mühsal, die Geburt schmerzhaft.", "Sie erkennen, dass sie nackt sind, und schämen sich."], "answer": 0, "answer_label": "A (Die Menschen verlieren ihre Fähigkeit zur Freiheit.)", "solution": ["Die Freiheit bleibt; sie ist gerade die Voraussetzung der Verantwortung. Scham, Schuldzuweisung und Mühsal gehören zu den Folgen."]}, {"num": 14, "stem": [], "question": "Wer formte aus Gen 3 die Lehre von der Erbsünde?", "options": ["Gottfried W. Leibniz", "Thomas Hobbes", "Der Jahwist", "Augustinus"], "answer": 3, "answer_label": "D (Augustinus)", "solution": ["Paulus deutet Adam als Typos der sündigen Menschheit (Röm 5); Augustinus entwickelt um 400 die Lehre von der Übertragung durch Zeugung. Im Bibeltext kommt das Wort Erbsünde nicht vor."]}, {"num": 15, "stem": [], "question": "Welche Textsorte ist Gen 3 nach heutigem Verständnis?", "options": ["Ein Gesetzestext mit Strafen für Ungehorsam", "Eine Ätiologie", "Ein Gebet, in dem Adam seine Schuld bekennt", "Ein historischer Bericht"], "answer": 1, "answer_label": "B (Eine Ätiologie)", "solution": ["Die Erzählung beantwortet Fragen wie: Warum ist das Leben mühsam? Warum zerbrechen Beziehungen? Sie ist wahr im Sinn einer Deutung, nicht im Sinn einer Reportage."]}, {"num": 16, "stem": [], "question": "Welche Haltung nimmt Gott am Ende von Gen 3 gegenüber den Menschen ein?", "options": ["Er verflucht sie und bricht jeden Kontakt ab.", "Er vergibt sofort und lässt sie im Garten.", "Er tötet sie noch am selben Tag, wie er es angekündigt hatte.", "Er bestraft sie, bekleidet sie aber vorher mit Fellen."], "answer": 3, "answer_label": "D (Er bestraft sie, bekleidet sie aber vorher mit Fellen.)", "solution": ["Gen 3,21 zeigt Fürsorge mitten in der Strafe. Die Beziehung ist gestört, aber nicht beendet."]}, {"num": 17, "stem": [], "question": "Welches Menschenbild vertritt Gen 3?", "options": ["Weder gut noch böse, nur auf Überleben aus", "Vollkommen und ohne jede Möglichkeit zur Schuld", "Gut geschaffen und frei, auch zum Bösen", "Von Natur aus böse und ohne Freiheit zum Guten"], "answer": 2, "answer_label": "C (Gut geschaffen und frei, auch zum Bösen)", "solution": ["„Von Natur aus böse ohne Freiheit“ beschreibt eine radikale Erbsündenlehre, „nur auf Überleben aus“ ist Wuketits, „vollkommen ohne Möglichkeit zur Schuld“ widerspricht der Erzählung."]}, {"num": 18, "stem": [], "question": "Welche der folgenden Aussagen trifft bzw. treffen zu?", "statements": ["Wuketits und Hobbes stimmen darin überein, dass im Ursprung „jeder gegen jeden“ stand.", "Wuketits hält moralisches Scheitern für eine Ausnahme, die sich durch Erziehung abstellen lässt."], "options": ["Nur Aussage I trifft zu.", "Nur Aussage II trifft zu.", "Beide Aussagen treffen zu.", "Keine der beiden Aussagen trifft zu."], "answer": 3, "answer_label": "D (Keine)", "solution": ["**I trifft nicht zu.** Wuketits betont, dass in der Evolution gerade nicht jeder gegen jeden war; Kooperation sicherte das Überleben.", "**II trifft nicht zu.** Er nennt moralisches Scheitern eine Alltäglichkeit unserer Spezies."]}, {"num": 19, "stem": [], "question": "Welche der folgenden Aussagen trifft bzw. treffen zu?", "statements": ["Gen 3 erklärt die harte Lebenswirklichkeit als Folge eines Bruchs mit Gott.", "Der Begriff „Erbsünde“ steht wörtlich in Gen 3."], "options": ["Nur Aussage I trifft zu.", "Nur Aussage II trifft zu.", "Beide Aussagen treffen zu.", "Keine der beiden Aussagen trifft zu."], "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I trifft zu.** Feindschaft, Schmerz und Schweiß sind Folgen der Trennung.", "**II trifft nicht zu.** Der Begriff stammt aus der späteren Theologie (Augustinus)."]}, {"num": 20, "stem": [], "question": "Wie lässt sich Röm 7,19 („Ich tue nicht das Gute, das ich will“) mit Wuketits verbinden?", "options": ["Beide kennen die Kluft zwischen moralischem Sollen und tatsächlichem Handeln.", "Beide führen das Böse auf den Teufel als Ursache zurück.", "Beide halten den Menschen für unfähig, Gutes zu wollen.", "Beide bestreiten, dass der Mensch Verantwortung trägt."], "answer": 0, "answer_label": "A (Beide kennen die Kluft zwischen moralischem Sollen und tatsächliche …)", "solution": ["Paulus deutet die Kluft theologisch und verweist auf Gnade, Wuketits erklärt sie evolutionär. Beide halten an Verantwortung fest."]}]}, {"name": "Test 2 · Hobbes und Rousseau", "level": "Grundlagen", "minutes": 30, "intro": null, "items": [{"num": 1, "stem": [], "question": "Welches Werk veröffentlichte Thomas Hobbes 1651?", "options": ["Gesellschaftsvertrag", "Émile", "Leviathan", "Essais de Théodicée"], "answer": 2, "answer_label": "C (Leviathan)", "solution": ["„Émile“ und „Gesellschaftsvertrag“ stammen von Rousseau (1762), die Theodizee von Leibniz (1710)."]}, {"num": 2, "stem": [], "question": "Vor welchem historischen Hintergrund ist Hobbes’ Ruf nach einem starken Staat zu verstehen?", "options": ["Dreißigjähriger Krieg in England", "Französische Revolution von 1789", "Erdbeben von Lissabon 1755", "Englischer Bürgerkrieg"], "answer": 3, "answer_label": "D (Englischer Bürgerkrieg)", "solution": ["Der Bürgerkrieg (1642–1649) machte Chaos und Gewalt zur unmittelbaren Erfahrung. Den Dreißigjährigen Krieg gab es in England nicht; 1789 und 1755 liegen nach Hobbes’ Tod."]}, {"num": 3, "stem": [], "question": "Welche drei Konfliktursachen liegen nach Hobbes in der menschlichen Natur?", "options": ["Ehrgeiz, Lüge, Gier", "Eigentum, Vergleich, Rache", "Konkurrenz, Misstrauen, Ruhmsucht", "Hunger, Angst und Neid gegen andere"], "answer": 2, "answer_label": "C (Konkurrenz, Misstrauen, Ruhmsucht)", "solution": ["Konkurrenz zielt auf Gewinn, Misstrauen auf Sicherheit, Ruhmsucht auf Ansehen. „Eigentum, Vergleich, Rache“ beschreibt dagegen Rousseaus Entstehung des Bösen."]}, {"num": 4, "stem": [], "question": "Weshalb greifen Menschen nach Hobbes aus Ruhmsucht zur Gewalt?", "options": ["Um Land, Vieh und Frauen anderer zu erobern", "Wegen Zeichen von Geringschätzung", "Um das eigene Hab und Gut zu verteidigen", "Um Hunger und Durst der Familie zu stillen"], "answer": 1, "answer_label": "B (Wegen Zeichen von Geringschätzung)", "solution": ["Eroberung gehört zur Konkurrenz, Verteidigung zum Misstrauen. Ruhmsucht reagiert auf Kränkungen der eigenen Person, Familie oder Nation."]}, {"num": 5, "stem": [], "question": "Was bedeutet nach Hobbes der „Krieg aller gegen alle“?", "options": ["Den Kampf der Armen gegen die Besitzenden", "Die Lage nach dem Zusammenbruch einer Monarchie", "Ständige Gewaltbereitschaft, auch ohne Kampf", "Eine historische Epoche, in der alle Völker Krieg führten"], "answer": 2, "answer_label": "C (Ständige Gewaltbereitschaft, auch ohne Kampf)", "solution": ["Krieg dauert, „solange der Vorsatz herrscht, Gewalt mit Gewalt zu vertreiben“. Der Naturzustand ist ein Gedankenmodell, keine bestimmte Epoche."]}, {"num": 6, "stem": [], "question": "Welches Recht hat im Naturzustand nach Hobbes jeder Mensch?", "options": ["Kein Recht, denn Rechte gibt erst Gott", "Ein Recht auf alles, die anderen Menschen eingeschlossen", "Ein Recht auf Leben, das alle achten müssen", "Ein Recht auf gleichen Anteil am Boden"], "answer": 1, "answer_label": "B (Ein Recht auf alles, die anderen Menschen eingeschlossen)", "solution": ["Weil jeder alles zur Verteidigung seines Lebens gebrauchen kann, kann sich niemand sicher fühlen, auch der Stärkste nicht."]}, {"num": 7, "stem": [], "question": "Welche „Regel der Vernunft“ nennt Hobbes?", "options": ["Kehre zur Natur zurück und meide die großen Städte.", "Gehorche immer dem Stärkeren, auch ohne Schutz.", "Liebe deinen Nächsten wie dich selbst.", "Suche Frieden, solange Hoffnung besteht; sonst nutze jede Hilfe."], "answer": 3, "answer_label": "D (Suche Frieden, solange Hoffnung besteht; sonst nutze jede Hilfe.)", "solution": ["Die Vernunft dient bei Hobbes der Selbsterhaltung. Unbedingten Gehorsam ohne Schutz lehnt er gerade ab."]}, {"num": 8, "stem": [], "question": "Wie entsteht nach Hobbes der Staat?", "options": ["Alle stimmen in jeder Frage gemeinsam direkt ab.", "Jeder überträgt seine Macht auf einen Souverän, der alle vertritt.", "Die Stärksten unterwerfen die Schwächeren mit Gewalt.", "Die Kirche setzt einen König von Gottes Gnaden ein."], "answer": 1, "answer_label": "B (Jeder überträgt seine Macht auf einen Souverän, der alle vertritt.)", "solution": ["Der Souverän kann ein Mensch oder eine Versammlung sein; der Wille aller wird „in einem Punkt vereinigt“. Das ist der Leviathan."]}, {"num": 9, "stem": [], "question": "Wann endet nach Hobbes die Pflicht zum Gehorsam gegenüber dem Souverän?", "options": ["Nie, denn der Vertrag gilt für alle Zeit", "Wenn eine Mehrheit ihn abwählt", "Wenn er die Bürger nicht mehr schützen kann", "Wenn er erkennbar gegen Gottes Gebote verstößt"], "answer": 2, "answer_label": "C (Wenn er die Bürger nicht mehr schützen kann)", "solution": ["Das natürliche Recht auf Selbstschutz wird durch keinen Vertrag beseitigt."]}, {"num": 10, "stem": [], "question": "Mit welchem Satz beginnt Rousseaus „Émile“?", "options": ["„Im Anfang war die Tat, und aus der Tat kam alles Unglück.“", "„Alles ist gut, wie es aus den Händen des Schöpfers kommt.“", "„Der Mensch ist dem Menschen ein Wolf, solange kein Staat ihn bändigt.“", "„Zurück zur Natur, damit wir wieder glücklich und frei werden.“"], "answer": 1, "answer_label": "B („Alles ist gut, wie es aus den Händen des Schöpfers kommt.“)", "solution": ["Der Satz geht weiter: „alles entartet unter den Händen des Menschen.“ „Zurück zur Natur“ steht so nicht bei Rousseau; der Wolf-Satz wird mit Hobbes verbunden."]}, {"num": 11, "stem": [], "question": "Wen nennt Rousseau den „wahren Gründer der bürgerlichen Gesellschaft“?", "options": ["Den Ersten, der ein Stück Land einzäunte und „Dies ist mein“ sagte", "Den Ersten, der seine Macht einem Herrscher übertrug", "Den ersten Bauern, der Getreide anbaute", "Den ersten König, der sich auf Gott berief"], "answer": 0, "answer_label": "A (Den Ersten, der ein Stück Land einzäunte und „Dies ist mein“ sagte)", "solution": ["Eigentum ist für Rousseau der Anfang von Verbrechen, Kriegen, Morden und Elend. Die dritte Antwort beschreibt eher Hobbes."]}, {"num": 12, "stem": [], "question": "Wie entstehen nach Rousseau Rache und Grausamkeit?", "options": ["Aus einer Strafe Gottes für den Sündenfall", "Aus dem gegenseitigen Vergleich und dem Anspruch auf Achtung", "Aus dem Hunger in Zeiten schlechter Ernten", "Aus einem angeborenen Trieb zur Gewalt"], "answer": 1, "answer_label": "B (Aus dem gegenseitigen Vergleich und dem Anspruch auf Achtung)", "solution": ["Wer geringgeschätzt wird, empfindet das oft als unerträglicher als den Schaden selbst und rächt sich. Der angeborene Trieb wäre die Gegenposition."]}, {"num": 13, "stem": [], "question": "Welchen Fehler wirft Rousseau denen vor, die den Menschen für von Natur aus grausam halten?", "options": ["Sie lesen die Bibel zu wörtlich und zu selten.", "Sie übersehen die Erfolge der modernen Zivilisation.", "Sie haben nie wilde Völker selbst beobachtet.", "Sie verwechseln Urzustand und geprägte Völker."], "answer": 3, "answer_label": "D (Sie verwechseln Urzustand und geprägte Völker.)", "solution": ["Die bekannten „wilden Völker“ seien vom ersten Naturzustand schon weit entfernt gewesen."]}, {"num": 14, "stem": [], "question": "Welche Hauptfrage soll Rousseaus Gesellschaftsvertrag lösen?", "options": ["Wie Schutz durch alle möglich ist, während jeder frei bleibt wie vorher", "Wie der Stärkste dauerhaft regieren kann", "Wie die Kirche den Staat lenken kann", "Wie Eigentum gerecht vererbt werden kann"], "answer": 0, "answer_label": "A (Wie Schutz durch alle möglich ist, während jeder frei bleibt wie vo …)", "solution": ["Jeder gehorcht im Vertrag „nur sich selbst“, weil er Teil des Ganzen ist."]}, {"num": 15, "stem": [], "question": "Was ist die volonté générale?", "options": ["Der allgemeine Wille", "Die Summe aller privaten Einzelinteressen", "Der Wille des Königs, dem alle folgen müssen", "Der Wille Gottes, wie die Kirche ihn auslegt"], "answer": 0, "answer_label": "A (Der allgemeine Wille)", "solution": ["Der allgemeine Wille ist nicht die bloße Addition von Einzelinteressen, sondern das Interesse des Ganzen."]}, {"num": 16, "stem": [], "question": "Welcher Unterschied zwischen Hobbes und Rousseau trifft zu?", "options": ["Beide halten den Menschen für von Natur aus friedlich.", "Hobbes kennt keinen Naturzustand, Rousseau dagegen schon.", "Rousseau lehnt jeden Vertrag ab, Hobbes fordert einen.", "Hobbes: Staat heilt Natur. Rousseau: Gesellschaft verdirbt."], "answer": 3, "answer_label": "D (Hobbes: Staat heilt Natur. Rousseau: Gesellschaft verdirbt.)", "solution": ["Beide arbeiten mit Naturzustand und Vertrag. Der Unterschied liegt im Menschenbild und in der Rolle der Gesellschaft."]}, {"num": 17, "stem": [], "question": "Welche Parallele besteht zwischen Rousseau und Gen 1–3?", "options": ["Beide sehen im Staat den Ausweg aus der Sünde.", "Beide halten den Menschen für von Anfang an böse.", "Beide sehen Gott als Urheber des Eigentums.", "Ein guter Anfang, dann ein Verlust"], "answer": 3, "answer_label": "D (Ein guter Anfang, dann ein Verlust)", "solution": ["Bei Rousseau ist die „Ursünde“ der Zaun um das Land, in Gen 3 der Bruch mit Gott."]}, {"num": 18, "stem": [], "question": "Welche der folgenden Aussagen trifft bzw. treffen zu?", "statements": ["Hobbes und Rousseau arbeiten beide mit einem Naturzustand und einem Vertrag.", "Rousseau will, dass die Menschen in den Naturzustand zurückkehren."], "options": ["Nur Aussage I trifft zu.", "Nur Aussage II trifft zu.", "Beide Aussagen treffen zu.", "Keine der beiden Aussagen trifft zu."], "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I trifft zu.** Beide Denkmodelle haben dieselbe Struktur.", "**II trifft nicht zu.** Rousseau sucht eine gerechte neue Gesellschaftsform durch den Gesellschaftsvertrag."]}, {"num": 19, "stem": [], "question": "Welche der folgenden Aussagen trifft bzw. treffen zu?", "statements": ["Die Antwort auf die Frage nach der Natur des Menschen hängt auch von den Lebensumständen ab, in denen sie gegeben wird.", "Hobbes’ Menschenbild lässt sich vollständig aus seiner Biografie erklären und hat deshalb keine Geltung."], "options": ["Nur Aussage I trifft zu.", "Nur Aussage II trifft zu.", "Beide Aussagen treffen zu.", "Keine der beiden Aussagen trifft zu."], "answer": 0, "answer_label": "A (Nur I)", "solution": ["**I trifft zu.** Hobbes schrieb nach dem Bürgerkrieg, Rousseau aus Kritik am Ancien Régime.", "**II trifft nicht zu.** Entstehung und Geltung sind zu trennen; Hobbes beschreibt Mechanismen, die sich bis heute beobachten lassen."]}, {"num": 20, "stem": [], "question": "Zu welchem Ergebnis kommt eine differenzierte Klausurantwort auf die Frage „gut oder böse?“ am ehesten?", "options": ["Rousseau hat recht, weil Kinder unschuldig sind.", "Die Frage ist unwichtig, weil Gott alles lenkt.", "Der Mensch ist zu beidem fähig; Freiheit und Verhältnisse entscheiden mit.", "Hobbes hat recht, weil Kriege es beweisen."], "answer": 2, "answer_label": "C (Der Mensch ist zu beidem fähig; Freiheit und Verhältnisse entscheid …)", "solution": ["Eine gute Antwort verbindet Hobbes, Rousseau, Wuketits und Gen 3: gut geschaffen, frei, gefährdet, auf gerechte Ordnungen angewiesen."]}]}, {"name": "Test 3 · Jossua: Erfahrung und Figuren des Bösen", "level": "Aufbau", "minutes": 30, "intro": null, "items": [{"num": 1, "stem": [], "question": "Woher stammt Jossuas Text „Das Böse“?", "options": ["Aus einem theologischen Handbuch von 1991", "Aus einer Predigt zum Erdbeben von Lissabon", "Aus einem Roman über die Werbebranche", "Aus Kants Schrift über die Theodizee"], "answer": 0, "answer_label": "A (Aus einem theologischen Handbuch von 1991)", "solution": ["Neues Handbuch theologischer Grundbegriffe, hg. von Peter Eicher. Jossua ist französischer Dominikaner und Theologe."]}, {"num": 2, "stem": [], "question": "Welche Quellen nennt Jossua als frühe Zeugnisse der Erfahrung des Bösen?", "options": ["Koran, Veden und die Gesetze Hammurabis", "Leviathan, Émile und den Gesellschaftsvertrag", "Genesis, Psalmen, Ijob und die griechischen Tragiker", "Kants Kritiken und Leibniz’ Theodizee"], "answer": 2, "answer_label": "C (Genesis, Psalmen, Ijob und die griechischen Tragiker)", "solution": ["Diese Texte sind voll von Fragen, Anklagen, Schreckensbildern und Liedern der Hoffnung. Die Zeitenwende steht im Zeichen des Kreuzes Jesu."]}, {"num": 3, "stem": [], "question": "Was meint Jossua mit dem „authentischen Wort“?", "options": ["Die genaue Wiedergabe eines Bibeltextes im Urtext", "Das kirchliche Bekenntnis zur Erbsünde", "Die sachliche Erklärung eines Experten", "Die Sprache des Betroffenen"], "answer": 3, "answer_label": "D (Die Sprache des Betroffenen)", "solution": ["Wer leidet, spricht aus der Erfahrung: „Das tut weh.“ Diese Sprache ist Pathos, nicht distanzierte Analyse."]}, {"num": 4, "stem": [], "question": "Was folgt nach Jossua daraus für das Gespräch mit Leidenden?", "options": ["Ohne Anteilnahme sind Trost und Erklärungen unwahr.", "Man sollte schweigen und den Leidenden allein lassen.", "Man sollte auf die Strafe für die Sünde hinweisen.", "Man sollte möglichst rasch eine Erklärung anbieten."], "answer": 0, "answer_label": "A (Ohne Anteilnahme sind Trost und Erklärungen unwahr.)", "solution": ["Es genügt nicht, Augenzeuge zu sein; man muss sich hineinziehen lassen. Das Mitleiden kann zu einem angemessenen Wort verhelfen."]}, {"num": 5, "stem": [], "question": "Was ist nach Jossua wahr an der Bestimmung des Bösen als privatio?", "options": ["Das Böse ist eine eigene, ungeschaffene Substanz.", "Das Böse ist immer auf ein Gut bezogen.", "Das Böse ist nur eine Einbildung des Leidenden.", "Das Böse ist eine gerechte Strafe Gottes."], "answer": 1, "answer_label": "B (Das Böse ist immer auf ein Gut bezogen.)", "solution": ["Die Rede von Mangel oder Beeinträchtigung bezieht sich auf ein fehlendes Gut. Die eigene Substanz wäre Dualismus."]}, {"num": 6, "stem": [], "question": "Was verschweigt nach Jossua die privatio-Lehre?", "options": ["Dass das Böse für das Ganze der Welt notwendig ist", "Dass Leiden durch Erziehung vermieden werden kann", "Dass das Böse von einem zweiten Gott geschaffen wurde", "Dass es um ein geschuldetes Gut geht, dessen Fehlen mich verneint"], "answer": 3, "answer_label": "D (Dass es um ein geschuldetes Gut geht, dessen Fehlen mich verneint)", "solution": ["Das Böse ist kein neutrales Fehlen, sondern ein Unrecht, das jemanden trifft."]}, {"num": 7, "stem": [], "question": "Was zählt Jossua zu den „Verdopplungsstufen“ des Bösen?", "options": ["Die Vergeltung von Unrecht durch Unrecht", "Die Wiederkehr des Gleichen über Generationen", "Die Verdopplung der Strafe im Fegefeuer", "Die doppelte Herkunft aus Gott und Teufel"], "answer": 1, "answer_label": "B (Die Wiederkehr des Gleichen über Generationen)", "solution": ["Beispiele sind der Subproletarier, der wieder seinesgleichen hervorbringt, und der Neurotiker mit neurotischen Kindern; die höchste Steigerung ist der Tod."]}, {"num": 8, "stem": [], "question": "Von wem übernimmt Jossua den Ausdruck „das Nicht-zu-Rechtfertigende“?", "options": ["Von Wuketits", "Von Voltaire", "Von Jean Nabert", "Von Augustinus"], "answer": 2, "answer_label": "C (Von Jean Nabert)", "solution": ["Das Böse ist ein Widerspruch im Tiefsten menschlicher Erfahrung und kann nicht hingenommen werden."]}, {"num": 9, "stem": [], "question": "Warum wird das Böse nach Jossua zur „Frage“ und nicht zum „Problem“?", "options": ["Weil es ein Skandal ist, gerichtet an jemanden", "Weil es sich mathematisch exakt berechnen lässt", "Weil nur Philosophen darüber sprechen können", "Weil die Wissenschaft es bereits gelöst hat"], "answer": 0, "answer_label": "A (Weil es ein Skandal ist, gerichtet an jemanden)", "solution": ["Ein Problem ist neutral und lösbar; eine Frage hat ethischen Charakter und zielt auf ein Urteil. „An wen?“ führt zur Gottesfrage."]}, {"num": 10, "stem": [], "question": "Was kennzeichnet nach Jossua die Rationalismen?", "options": ["Das Böse geht im Ganzen auf.", "Sie nehmen zwei gleich starke göttliche Prinzipien an.", "Sie erklären das Böse durch den Fall Adams.", "Sie lehnen jede Beschäftigung mit dem Bösen ab."], "answer": 0, "answer_label": "A (Das Böse geht im Ganzen auf.)", "solution": ["Beispiele: das Böse als Nicht-Sein (Platon), die beste der Welten (Leibniz), der Geist in der Geschichte (Romantik)."]}, {"num": 11, "stem": [], "question": "Wen zitiert Jossua gegen die Rechtfertigung durch die „beste der Welten“?", "options": ["Hobbes", "Kant in der Kritik der reinen Vernunft", "Voltaire", "Augustinus"], "answer": 2, "answer_label": "C (Voltaire)", "solution": ["Der Satz „Alles ist gut“ sei ein Hohn auf die Schmerzen unseres Lebens (Vorwort zum Gedicht über Lissabon, 1756)."]}, {"num": 12, "stem": [], "question": "Welches Dilemma schreibt Jossua Epikur zu?", "options": ["Gott ist entweder missgünstig oder schwach.", "Ist der Mensch gut, braucht er keinen Staat; ist er böse, hilft auch kein Staat.", "Gibt es einen Teufel, ist Gott nicht allmächtig; gibt es keinen, ist Gott böse.", "Hat Adam gesündigt, sind alle schuldig; hat er nicht gesündigt, ist niemand frei."], "answer": 0, "answer_label": "A (Gott ist entweder missgünstig oder schwach.)", "solution": ["Das Dilemma ist Ausgangspunkt der Dualismen: Wer weder Böswilligkeit noch Ohnmacht Gottes zugeben will, sucht ein zweites Prinzip."]}, {"num": 13, "stem": [], "question": "Was ist die klassische Form des Dualismus nach Jossua?", "options": ["Ein böser Gott, der die Welt ohne Ordnung schuf", "Ein guter Gott, der das Böse aus Liebe zulässt", "Ein Mensch, der zwischen Gut und Böse frei wählt", "Zwei Prinzipien, eines ungeschaffen und von Natur aus böse, meist dem guten unterlegen"], "answer": 3, "answer_label": "D (Zwei Prinzipien, eines ungeschaffen und von Natur aus böse, meist d …)", "solution": ["Diese Form tritt von Zarathustra bis zu den Häresien des Mittelalters immer wieder auf."]}, {"num": 14, "stem": [], "question": "In welchem Sinn nennt Jossua das Christentum einen „gemäßigten Dualismus“?", "options": ["Es glaubt an zwei gleichberechtigte Götter.", "Es nimmt das Böse ernst und hat Mythen aufgenommen.", "Es hält die materielle Welt für schlecht.", "Es leugnet die Existenz des Bösen vollständig."], "answer": 1, "answer_label": "B (Es nimmt das Böse ernst und hat Mythen aufgenommen.)", "solution": ["Die Mythen sollen ans Licht gehoben werden, um das Christentum zu reinigen. Die Abwertung der Welt kennzeichnet die Gnosis."]}, {"num": 15, "stem": [], "question": "Welcher Gedanke gehört zum ersten Typ der adaptierten Mythen?", "options": ["Der Teufel als geschaffenes, aufständisches Wesen", "Leid als Prüfung oder Heilstrafe nach Gottes Willen oder Zulassung", "Die Erbsünde als Übertragung durch Zeugung", "Der Himmel als Ausgleich für das irdische Leid"], "answer": 1, "answer_label": "B (Leid als Prüfung oder Heilstrafe nach Gottes Willen oder Zulassung)", "solution": ["Typ 1 schreibt Gott eine gewisse Verantwortung zu (Vorsehung, Zulassung, Prädestination). Teufel ist Typ 2, Erbsünde und Himmel gehören zur Rationalisierung."]}, {"num": 16, "stem": [], "question": "Warum erfüllt die Figur des Teufels nach Jossua ihren Zweck als Erklärung schlecht?", "options": ["Weil er erst im 19. Jahrhundert erfunden wurde", "Weil es in der Bibel keinerlei Hinweise auf ihn gibt", "Seine Verantwortung fällt auf den Schöpfer zurück, oder er hat keine Macht über die Freiheit.", "Weil er stärker ist als Gott und alles beherrscht"], "answer": 2, "answer_label": "C (Seine Verantwortung fällt auf den Schöpfer zurück, oder er hat kein …)", "solution": ["Als projizierendes Bild war er wirksam, bis zum Satan der Romantiker. Die Bibel enthält „vielfältige und heterogene“ Hinweise, aus denen die Kirchenväter die Figur konstruierten."]}, {"num": 17, "stem": [], "question": "Was meint Jossua mit dem „perversen Gott“?", "options": ["Einen Gott, der die Welt aus dem Nichts erschaffen hat", "Einen Gott, der Ijob am Ende alles doppelt zurückgibt", "Ein Gott, vor dem der Mensch sich nur selbst anklagt", "Einen Gott, der die Freiheit des Menschen achtet"], "answer": 2, "answer_label": "C (Ein Gott, vor dem der Mensch sich nur selbst anklagt)", "solution": ["Der Mensch soll sich selbst anklagen, um seinen Herrn zu rechtfertigen. Jossua nennt dafür Spuren bei Sade und Melville."]}, {"num": 18, "stem": [], "question": "Welche der folgenden Aussagen trifft bzw. treffen zu?", "statements": ["Jossua leugnet die Existenz des Bösen.", "Jossua hält es für unwahr, Leidenden ohne Anteilnahme Erklärungen anzubieten."], "options": ["Nur Aussage I trifft zu.", "Nur Aussage II trifft zu.", "Beide Aussagen treffen zu.", "Keine der beiden Aussagen trifft zu."], "answer": 1, "answer_label": "B (Nur II)", "solution": ["**I trifft nicht zu.** Er nimmt das Böse gerade als Erfahrung und Skandal ernst.", "**II trifft zu.** Erklärungen ohne Solidarität sind „abstrakt oder deplatziert“."]}, {"num": 19, "stem": [], "question": "Welche der Aussagen lässt bzw. lassen sich aus der Quelle ableiten?", "statements": ["Wer das Böse nur als Augenzeuge kennt, kann nach Jossua nicht angemessen darüber sprechen.", "Nach Jossua sind Trost und Erklärungen grundsätzlich wertlos."], "options": ["Nur Aussage I lässt sich ableiten.", "Nur Aussage II lässt sich ableiten.", "Beide Aussagen lassen sich ableiten.", "Keine der beiden Aussagen lässt sich ableiten."], "answer": 3, "answer_label": "D (Keine)", "solution": ["**I ist nicht ableitbar.** Es genügt nicht, Augenzeuge zu sein; aber wer sich mit hineinziehen lässt, kann durch Mitleiden ein angemessenes Wort finden.", "**II ist nicht ableitbar.** Sie sind deplatziert, wenn Anteilnahme fehlt; nicht grundsätzlich."], "passage": {"label": "Quelle · Aufgaben 19 und 20", "title": "J.-P. Jossua, Das Böse (1991), Auszug", "paras": ["„Wenn jemand, der mit dem Bösen konfrontiert ist, sich äußert, klingen seine Worte authentisch; seine Sprache entspringt der Erfahrung. Er leidet und sagt es: ‚Das tut weh.‘ Ein Gespräch in dieser Situation ohne wirkliche Anteilnahme oder Solidarität wäre unwahr; Beschwichtigung, Trost, Erklärungen erschienen abstrakt oder, besser gesagt, deplatziert […]. Es genügt nicht, Augenzeuge zu sein, es geht darum, sich mit hineinziehen zu lassen.“"]}}, {"num": 20, "stem": [], "question": "Welche Haltung gegenüber Leidenden lässt sich aus dem Auszug ableiten?", "options": ["Leid sachlich analysieren, um Gefühle zu vermeiden", "Den Leidenden an die Strafe für die Sünde erinnern", "Den Leidenden ermutigen, das Böse zu vergessen", "Solidarisch mitgehen, statt aus Distanz zu erklären"], "answer": 3, "answer_label": "D (Solidarisch mitgehen, statt aus Distanz zu erklären)", "solution": ["Der Text verlangt Anteilnahme und Solidarität. Genau das versäumen die Freunde Ijobs."], "passage": {"label": "Quelle · Aufgaben 19 und 20", "title": "J.-P. Jossua, Das Böse (1991), Auszug", "paras": ["„Wenn jemand, der mit dem Bösen konfrontiert ist, sich äußert, klingen seine Worte authentisch; seine Sprache entspringt der Erfahrung. Er leidet und sagt es: ‚Das tut weh.‘ Ein Gespräch in dieser Situation ohne wirkliche Anteilnahme oder Solidarität wäre unwahr; Beschwichtigung, Trost, Erklärungen erschienen abstrakt oder, besser gesagt, deplatziert […]. Es genügt nicht, Augenzeuge zu sein, es geht darum, sich mit hineinziehen zu lassen.“"]}}]}, {"name": "Test 4 · Rationalisierung der Mythen und philosophische Theodizee", "level": "Aufbau", "minutes": 30, "intro": null, "items": [{"num": 1, "stem": [], "question": "Was ist nach Jossua die „herkömmliche Erklärung“ des Bösen im lateinischen Westen?", "options": ["Ein zweites böses Prinzip, das neben Gott wirkt", "Schwache Freiheit und ein Fall am Anfang", "Ein Fehler im Plan des Schöpfers bei der Schöpfung", "Die Endlichkeit der materiellen Welt"], "answer": 1, "answer_label": "B (Schwache Freiheit und ein Fall am Anfang)", "solution": ["Moralisches Böses aus der Schwäche der Freiheit, physisches als Folge oder Strafe. Das erklärt das Ausmaß des Elends nur zusammen mit dem Gedanken des Falls."]}, {"num": 2, "stem": [], "question": "Wie begründet Jossua, dass die Erbsündenlehre „radikal widersprüchlich“ sei?", "options": ["Weil Adam in der Bibel an keiner Stelle vorkommt", "Weil die Ostkirche sie als Erste formuliert er_label": "A (Er dient als Ausgleich, der das irdische Unglück rechtfertigen soll.)", "solution": ["Kant spottet: Dass diese „Prüfungszeit“ Bedingung künftiger Freude sein müsse, lasse sich behaupten, aber nicht einsehen."]}, {"num": 6, "stem": [], "question": "Welches Gottesbild entsteht nach Jossua, wenn Leid der notwendige Umweg zum Himmel wäre?", "options": ["Ein gütiger, aber unbeteiligter Gott", "Ein strenger, aber gerechter Vater", "Ein zweiter Gott neben dem Schöpfer", "Ein tyrannischer, ohnmächtiger oder sadistischer Gott"], "answer": 3, "answer_label": "D (Ein tyrannischer, ohnmächtiger oder sadistischer Gott)", "solution": ["Jossua ahmt dafür ausdrücklich Epikurs Dilemma nach."]}, {"num": 7, "stem": [], "question": "Womit schließt Jossua seinen Text?", "options": ["Mit Leibniz die beste aller Welten anerkennen", "Mit Ijob: Wir können das Böse nicht erklären.", "Mit Hobbes einen starken Staat fordern", "Mit Augustinus die Erbsünde bekräftigen"], "answer": 1, "answer_label": "B (Mit Ijob: Wir können das Böse nicht erklären.)", "solution": ["Menschliche Schuld ist nicht zu bestreiten, darf aber nicht die allgemeingültige Erklärung sein."]}, {"num": 8, "stem": [], "question": "Was bedeutet „Theodizee“ wörtlich?", "options": ["Lehre vom Bösen", "Liebe Gottes", "Rechtfertigung Gottes", "Gottes Gericht am Ende"], "answer": 2, "answer_label": "C (Rechtfertigung Gottes)", "solution": ["Griechisch theos (Gott) und dike (Gerechtigkeit). Der Begriff geht auf Leibniz’ Werk von 1710 zurück."]}, {"num": 9, "stem": [], "question": "Welche drei Aussagen bilden das Theodizee-Problem?", "options": ["Gott ist allmächtig, Gott ist gut, es gibt Leid.", "Gott ist ewig, die Welt ist endlich, der Mensch ist frei.", "Der Mensch ist gut, die Gesellschaft ist böse, Gott schweigt.", "Gott ist gerecht, der Mensch sündigt, Leid ist Strafe."], "answer": 0, "answer_label": "A (Gott ist allmächtig, Gott ist gut, es gibt Leid.)", "solution": ["Jede Lösung muss eine der drei Aussagen einschränken oder den Widerspruch als scheinbar erweisen. Die letzte Antwort ist der Tun-Ergehen-Zusammenhang."]}, {"num": 10, "stem": [], "question": "Welche These vertritt Leibniz?", "options": ["Diese Welt ist die beste aller möglichen Welten.", "Die Welt ist zufällig und ohne jeden Sinn.", "Gott hat die Welt geschaffen und sich zurückgezogen.", "Diese Welt ist schlecht und muss überwunden werden."], "answer": 0, "answer_label": "A (Diese Welt ist die beste aller möglichen Welten.)", "solution": ["Gott wählte aus unendlich vielen möglichen Welten die mit der größtmöglichen Ordnung bei größtmöglicher Freiheit."]}, {"num": 11, "stem": [], "question": "Wie verhält sich Gott nach Leibniz zum moralischen Übel?", "options": ["Er weiß nichts davon, bis es tatsächlich geschieht.", "Er schafft es selbst als Gegenpol zum Guten.", "Er lässt es zu.", "Er will es als Mittel zur Erziehung."], "answer": 2, "answer_label": "C (Er lässt es zu.)", "solution": ["Das moralische Übel ist conditio sine qua non der Freiheit, weder Zweck noch Mittel. Physisches Übel kann Mittel sein, etwa Strafe."]}, {"num": 12, "stem": [], "question": "Was nennt Leibniz malum metaphysicum?", "options": ["Das Leid durch Naturkatastrophen", "Das vom Menschen frei verschuldete Böse", "Den Abfall der Engel von Gott", "Die Unvollkommenheit alles Geschaffenen"], "answer": 3, "answer_label": "D (Die Unvollkommenheit alles Geschaffenen)", "solution": ["Nur Gott ist vollkommen; alles Geschaffene ist endlich. Naturleid ist malum physicum, verschuldetes Böses malum morale."]}, {"num": 13, "stem": [], "question": "Welches Ereignis erschütterte 1755 den Optimismus der Aufklärung?", "options": ["Der Ausbruch des Vesuvs über Neapel", "Der große Brand der Stadt London", "Die große Pest in Marseille", "Das Erdbeben von Lissabon"], "answer": 3, "answer_label": "D (Das Erdbeben von Lissabon)", "solution": ["Am 1. November 1755 starben Zehntausende. Voltaire schrieb darüber ein Gedicht (1756) und den Roman „Candide“ (1759)."]}       <li>Gezählt wird die zuletzt angetippte Antwort. Über die Nummernleiste springst du zu jeder Aufgabe.</li>
      <li>Mit „Markieren“ kennzeichnest du Aufgaben für den zweiten Durchgang.</li>
      ${DATA.key === "math" ? `<li>Bei Aufgaben mit Antwortfeld trägst du das Ergebnis selbst ein: ganze Zahl, Bruch wie 5/4 oder Dezimalzahl wie 1,25. Beide Schreibweisen gelten als richtig; gerundete Dezimalzahlen nur mit mindestens drei Nachkommastellen. Ob das AC ebenso großzügig ist, sagt der Übungstest nicht.</li>` : `<li>Grafiken lassen sich durch Antippen vergrößern.</li>`}
      <li>In dieser App kosten falsche Antworten keine Punkte. Ob das im AC ebenso gilt, sagen weder Tutorial noch Probetests; lass deshalb keine Aufgabe leer, solange die Einladung nichts anderes sagt.</li>`}</ul></div></div>`;
  app.querySelectorAll("[data-start]").forEach(b => b.onclick = () => start(+b.dataset.start));
  app.querySelector("#reset").onclick = () => {
    const v = document.createElement("div"); v.className = "veil";
    v.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h2>Ergebnisse zurücksetzen?</h2>
      <p style="margin:0">Alle gespeicherten Ergebnisse und ein laufender Test dieser App werden gelöscht. Das lässt sich nicht rückgängig machen.</p>
      <div class="row"><button class="btn" id="no">Abbrechen</button><button class="btn primary" id="yes">Ja, zurücksetzen</button></div></div>`;
    document.body.appendChild(v);
    v.querySelector("#no").onclick = () => v.remove();
    v.querySelector("#yes").onclick = () => { store.del("hist"); store.del("run"); v.remove(); home() };
  };
  if (run) { app.querySelector("#resume").onclick = () => { S = run; test() }; app.querySelector("#drop").onclick = () => { store.del("run"); home() } }
}

function start(t) {
  const T = DATA.tests[t];
  const N = T.items.length;
  S = { t, cur: 0, ans: Array(N).fill(null), flag: Array(N).fill(false), begin: Date.now(), end: T.minutes ? Date.now() + T.minutes * 60000 : 8.64e15 };
  store.set("run", S); test();
}

/* ---------- Test ---------- */
function test() {
  const T = DATA.tests[S.t];
  app.innerHTML = `<div class="bar"><div class="in"><span class="title">${esc(T.name)} · ${esc(DATA.label)}</span>
    <span class="clock" id="clock" aria-live="off">--:--</span><button class="btn warn" id="submit">Abgeben</button></div></div>
    <div class="wrap" style="padding-top:0"><div class="strip" id="strip" style="--n:${T.items.length}"></div><div id="q"></div>
    <div class="nav"><button class="btn" id="prev">Zurück</button><button class="btn" id="flag">Markieren</button><button class="btn primary" id="next">Weiter</button></div></div>`;
  app.querySelector("#prev").onclick = () => go(S.cur - 1);
  app.querySelector("#next").onclick = () => S.cur === DATA.tests[S.t].items.length - 1 ? confirmSubmit() : go(S.cur + 1);
  app.querySelector("#flag").onclick = () => { S.flag[S.cur] = !S.flag[S.cur]; save(); paint() };
  app.querySelector("#submit").onclick = confirmSubmit;
  clearInterval(tick); tick = setInterval(clock, 500); clock(); paint();
}
function save() { store.set("run", S) }
function go(i) { if (i < 0 || i > DATA.tests[S.t].items.length - 1) return; S.cur = i; save(); paint(); window.scrollTo({ top: 0 }) }
function clock() {
  const left = (S.end - Date.now()) / 1000, el = document.getElementById("clock");
  if (!el) return;
  if (!DATA.tests[S.t].minutes) { el.textContent = fmt((Date.now() - S.begin) / 1000); return }
  el.textContent = fmt(left); el.classList.toggle("low", left < 300);
  if (left <= 0) finish(true);
}

function itemHTML(it, interactive, chosen) {
  let h = "";
  if (it.passage) h += `<div class="passage"><span class="eyebrow">${esc(it.passage.label)}</span><span class="t">${esc(it.passage.title)}</span>${it.passage.paras.map(p => `<p>${md(p)}</p>`).join("")}</div>`;
  (it.stem || []).forEach(p => h += `<p>${md(p)}</p>`);
  if (it.table) h += `<div class="tbl"><table><thead><tr>${it.table.head.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${it.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if (it.img) h += `<div class="fig m"><img src="${it.img}" alt="Abbildung zur Aufgabe ${it.num}"></div>`;
  if (it.question) h += `<p><strong>${md(it.question)}</strong></p>`;
  else if (DATA.key === "fig") h += `<p><strong>Welches Bild vervollständigt das Muster?</strong></p>`;
  if (it.statements) h += `<div class="stmts">${it.statements.map((s, k) => `<div class="stmt"><b>${k ? "II." : "I."}</b><span>${md(s)}</span></div>`).join("")}</div>`;
  if (it.img2) h += `<div class="fig o"><img src="${it.img2}" alt="Antwortmöglichkeiten zur Aufgabe ${it.num}"></div>`;
  if (interactive) {
    if (it.open) h += `<div class="free"><label class="muted" for="free">Deine Antwort: ganze Zahl, Bruch wie 5/4 oder Dezimalzahl wie 1,25. Periodische Ergebnisse besser als Bruch eingeben.</label>
      <input id="free" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${esc(chosen || "")}">
      <div class="keys"><button class="btn" data-key="−">−</button><button class="btn" data-key="/">/</button><button class="btn" data-key=",">,</button><button class="btn" data-key="del">⌫</button></div></div>`;
    else if (it.options) h += `<div class="opts">${it.options.map((o, k) => `<button class="opt${chosen === k ? " sel" : ""}" data-k="${k}"><span class="l">${L[k]}</span><span>${md(o)}</span></button>`).join("")}</div>`;
    else h += `<div class="opts grid${it.nopts}">${Array.from({ length: it.nopts }, (_, k) => `<button class="opt${chosen === k ? " sel" : ""}" data-k="${k}" aria-label="Antwort ${L[k]}"><span class="l">${L[k]}</span></button>`).join("")}</div>`;
  }
  return h;
}

function paint() {
  const T = DATA.tests[S.t], it = T.items[S.cur];
  document.getElementById("strip").innerHTML = T.items.map((_, i) =>
    `<button class="${isAns(S.ans[i]) ? "done" : ""} ${S.flag[i] ? "flag" : ""} ${i === S.cur ? "cur" : ""}" data-i="${i}" aria-label="Aufgabe ${i + 1}">${i + 1}</button>`).join("");
  document.querySelectorAll("#strip button").forEach(b => b.onclick = () => go(+b.dataset.i));
  document.getElementById("q").innerHTML = `<div class="qhead"><h2>Aufgabe ${S.cur + 1}</h2><span class="muted">${S.cur === 0 && T.intro ? "" : ""}${S.flag[S.cur] ? "markiert" : ""}</span></div>
    <div class="panel">${S.cur === 0 && T.intro && !/Bearbeitungszeit/.test(T.intro) ? `<p class="muted">${md(T.intro)}</p>` : ""}${itemHTML(it, true, S.ans[S.cur])}</div>`;
  document.querySelectorAll("#q .opt").forEach(b => b.onclick = () => { S.ans[S.cur] = +b.dataset.k; save(); paint() });
  const inp = document.getElementById("free");
  if (inp) {
    const upd = () => { S.ans[S.cur] = inp.value.trim() || null; save(); const sb = document.querySelector('#strip [data-i="' + S.cur + '"]'); if (sb) sb.classList.toggle("done", isAns(S.ans[S.cur])) };
    inp.oninput = upd;
    document.querySelectorAll("#q [data-key]").forEach(b => b.onclick = () => { const k = b.dataset.key; inp.value = k === "del" ? inp.value.slice(0, -1) : inp.value + k; upd() });
  }
  document.querySelectorAll("#q .fig img").forEach(img => img.onclick = () => zoom(img.src));
  const f = document.getElementById("flag"); f.classList.toggle("on", S.flag[S.cur]); f.textContent = S.flag[S.cur] ? "Markiert" : "Markieren";
  document.getElementById("prev").disabled = S.cur === 0;
  document.getElementById("next").textContent = S.cur === T.items.length - 1 ? "Abgeben" : "Weiter";
}

function zoom(src) {
  const z = document.createElement("div"); z.className = "zoom";
  z.innerHTML = `<button class="btn close">Schließen</button><img src="${src}" alt="Vergrößerte Abbildung">`;
  z.onclick = e => { if (e.target === z || e.target.classList.contains("close")) z.remove() };
  document.body.appendChild(z);
}

function confirmSubmit() {
  const open = S.ans.filter(a => !isAns(a)).length, fl = S.flag.filter(Boolean).length;
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h2>Test beenden?</h2>
    <p style="margin:0">${S.ans.length - open} von ${S.ans.length} Aufgaben beantwortet${fl ? `, ${fl} markiert` : ""}.${DATA.tests[S.t].minutes ? ` Restzeit ${fmt((S.end - Date.now()) / 1000)}.` : ""}</p>
    ${open ? `<p style="margin:0;color:var(--bad)">${open} ${open === 1 ? "Aufgabe ist" : "Aufgaben sind"} noch offen. Eine vorläufige Antwort ist besser als keine.</p>` : ""}
    <div class="row"><button class="btn" id="no">Nein, weiterarbeiten</button><button class="btn primary" id="yes">Ja, abgeben</button></div></div>`;
  document.body.appendChild(v);
  v.querySelector("#no").onclick = () => v.remove();
  v.querySelector("#yes").onclick = () => { v.remove(); finish(false) };
}

function finish(timeout) {
  clearInterval(tick);
  document.querySelectorAll(".veil,.zoom").forEach(x => x.remove());
  const T = DATA.tests[S.t];
  const used = T.minutes ? Math.min(T.minutes * 60, (Math.min(Date.now(), S.end) - S.begin) / 1000) : (Date.now() - S.begin) / 1000;
  const score = T.items.reduce((n, it, i) => n + (correct(it, S.ans[i]) ? 1 : 0), 0);
  const hist = store.get("hist", {}); const prev = hist[S.t];
  hist[S.t] = { score, date: new Date().toLocaleDateString("de-DE"), tries: (prev ? prev.tries : 0) + 1, best: Math.max(score, prev ? prev.best || prev.score : 0) };
  store.set("hist", hist); store.del("run");
  results({ t: S.t, ans: S.ans.slice(), used, score, timeout, best: hist[S.t].best });
}

/* ---------- Auswertung ---------- */
function results(R) {
  const T = DATA.tests[R.t];
  const st = T.items.map((it, i) => !isAns(R.ans[i]) ? "e" : correct(it, R.ans[i]) ? "r" : "f");
  const wrong = st.filter(s => s === "f").length, empty = st.filter(s => s === "e").length;
  const NN = T.items.length, pct = Math.round(R.score / NN * 100);
  app.innerHTML = `<div class="wrap">
    <div class="hero"><span class="eyebrow">Auswertung · ${esc(DATA.label)}</span><h1>${esc(T.name)}</h1>
      ${R.timeout ? `<p style="color:var(--bad)">Die Zeit ist abgelaufen; der Test wurde automatisch abgegeben.</p>` : ""}</div>
    <div class="score"><div class="big">${R.score}<small> / ${NN}</small></div>
      <div><strong>${pct} Prozent richtig</strong> · ${wrong} falsch · ${empty} leer<br>
      <span class="muted">Bearbeitungszeit ${fmt(R.used)}${T.minutes ? ` von ${T.minutes}:00` : ""} · bestes Ergebnis ${R.best} von ${NN}</span>
      <div class="bars" style="--n:${st.length}">${st.map(s => `<span class="${s}"></span>`).join("")}</div></div></div>
    <div class="row" style="margin-top:16px"><button class="btn" id="onlyf">Nur Fehler und leere zeigen</button><button class="btn" id="again">Test wiederholen</button><button class="btn primary" id="back">Zur Übersicht</button></div>
    <div class="list" id="list"></div></div>`;
  let only = false;
  const draw = () => {
    document.getElementById("list").innerHTML = T.items.map((it, i) => {
      if (only && st[i] === "r") return "";
      const a = R.ans[i];
      const lab = { r: "richtig", f: "falsch", e: "leer" }[st[i]];
      return `<div class="res"><button data-i="${i}" aria-expanded="false"><span class="tag ${st[i]}">${lab}</span><span><strong>Aufgabe ${i + 1}</strong> · deine Antwort ${!isAns(a) ? "–" : it.open ? esc(a) : L[a]} · richtig ${md(it.answer_label)}</span></button>
        <div class="body" hidden>${it.solimg ? `<div class="solimg"><img src="${it.solimg}" alt="Gelöste Matrix"></div>` : ""}
        ${(it.solution || []).map(p => `<p>${md(p)}</p>`).join("")}
        <details><summary class="muted">Aufgabe noch einmal ansehen</summary><div class="panel q" style="margin-top:10px">${itemHTML(it, false)}</div></details></div></div>`;
    }).join("");
    document.querySelectorAll("#list .res > button").forEach(b => b.onclick = () => {
      const body = b.nextElementSibling; body.hidden = !body.hidden; b.setAttribute("aria-expanded", String(!body.hidden));
    });
    document.querySelectorAll("#list .fig img").forEach(img => img.onclick = () => zoom(img.src));
  };
  draw();
  document.getElementById("onlyf").onclick = e => { only = !only; e.target.textContent = only ? "Alle Aufgaben zeigen" : "Nur Fehler und leere zeigen"; draw() };
  document.getElementById("again").onclick = () => start(R.t);
  document.getElementById("back").onclick = home;
  window.scrollTo({ top: 0 });
}

const running = store.get("run", null);
if (running && running.end > Date.now()) { S = running; test() }
else { if (running) { S = running; finish(true) } else home() }
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}) } catch (e) {}
</script>

</body>
</html>
