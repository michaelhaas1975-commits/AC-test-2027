<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Lerntrainer: Missionen mit XP, Leben, Combo, Sternen und Abzeichen. Für iPad und Handy, hell und dunkel. */
:root {
  --bg: #f4f2fb; --surface: #ffffff; --ink: #1b1830; --muted: #625d7a; --line: #dcd7ee;
  --accent: #5b3fd6; --accent2: #2f80ed; --accent-soft: #ebe6ff; --gold: #e0a100; --gold-soft: #fff4d1;
  --ok: #1f8a4c; --ok-soft: #def5e7; --bad: #c8372d; --bad-soft: #fde3e0; --lock: #b7b2c9;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #12101d; --surface: #1d1a2c; --ink: #ece9f7; --muted: #a49fbb; --line: #322d48;
  --accent: #9b85ff; --accent2: #6aa8ff; --accent-soft: #2a2347; --gold: #ffc83d; --gold-soft: #3a2f10;
  --ok: #5fd08e; --ok-soft: #153223; --bad: #ff8577; --bad-soft: #3d1a17; --lock: #4b4563; color-scheme: dark } }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent }
.wrap { max-width: 860px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-left, 0px)) 60px max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance }
h1 { font-size: 2rem; font-weight: 800 } h2 { font-size: 1.3rem } h3 { font-size: 1.05rem }
p { margin: 0 }
.eyebrow { font: 700 .74rem/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
button, a.btn { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 18px; min-height: 48px; font-weight: 700; text-decoration: none }
.btn.primary { background: linear-gradient(135deg, #5b3fd6, #2f80ed); border: 0; color: #fff }
.btn.big { min-height: 56px; font-size: 1.1rem; padding: 14px 26px }
.btn:disabled { opacity: .45; cursor: default }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px }
.top a { color: var(--accent); font-weight: 700; text-decoration: none }

/* Profilkarte */
.hero { background: linear-gradient(135deg, #5b3fd6, #2f80ed); color: #fff; border-radius: 20px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 10px 30px -18px var(--accent) }
.hero .eyebrow { color: rgba(255,255,255,.8) }
.hero p { color: rgba(255,255,255,.9); max-width: 60ch }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.stat { background: rgba(255,255,255,.16); border-radius: 14px; padding: 10px 12px }
.stat b { display: block; font: 800 clamp(1rem, 2.4vw, 1.3rem)/1.15 var(--f-display); overflow-wrap: anywhere; hyphens: auto }
.stat span { font-size: .8rem; opacity: .9 }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.xpbar { height: 12px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden }
.xpbar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .6s }

/* Missionen */
.sec { margin: 26px 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px }
.mis { position: relative; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 6px; min-height: 140px }
.mis .ic { font-size: 1.8rem; line-height: 1 }
.mis .no { position: absolute; top: 12px; right: 14px; font: 700 .8rem var(--f-mono); color: var(--muted) }
.mis .st { color: var(--gold); letter-spacing: 2px; font-size: 1.05rem }
.mis .st .off { color: var(--lock) }
.mis.done { border-color: var(--accent) }
.mis.next { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft) }
.mis.locked { opacity: .55; cursor: default }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px }
.mode { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 4px }
.mode:disabled { opacity: .5; cursor: default }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.badge { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; text-align: center }
.badge .e { font-size: 1.8rem } .badge b { font-size: .92rem } .badge span { font-size: .78rem; color: var(--muted) }
.badge.off { filter: grayscale(1); opacity: .45 }

/* Spiel */
.hud { display: flex; align-items: center; gap: 12px; margin-bottom: 14px }
.prog { flex: 1; height: 12px; background: var(--line); border-radius: 99px; overflow: hidden }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s }
.hearts { font-size: 1.25rem; letter-spacing: 2px; white-space: nowrap }
.hearts .off { filter: grayscale(1); opacity: .3 }
.pill { font: 700 .9rem var(--f-mono); padding: 6px 10px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); white-space: nowrap }
.pill.combo { background: var(--accent-soft); color: var(--accent) }
.pill.time { font-size: 1.1rem }
.pill.time.low { background: var(--bad-soft); color: var(--bad) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 16px }
.q { font: 700 1.25rem/1.35 var(--f-display) }
.opts { display: grid; gap: 10px }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; min-height: 58px; display: flex; gap: 12px; align-items: center }
.opt .l { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 700 .95rem var(--f-mono); background: var(--bg) }
.opt.ok { border-color: var(--ok); background: var(--ok-soft) } .opt.ok .l { background: var(--ok); color: #fff }
.opt.bad { border-color: var(--bad); background: var(--bad-soft) } .opt.bad .l { background: var(--bad); color: #fff }
.opt[disabled] { cursor: default }
.fb { border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px }
.fb.ok { background: var(--ok-soft) } .fb.bad { background: var(--bad-soft) }
.fb h3 { color: var(--ok) } .fb.bad h3 { color: var(--bad) }
.brief { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none }
.brief li { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px }
.result { text-align: center; display: grid; gap: 14px; justify-items: center; padding-top: 10px }
.stars { font-size: 3rem; letter-spacing: 6px; color: var(--gold) } .stars .off { color: var(--lock) }
.gain { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 520px }
.gain div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px }
.gain b { display: block; font: 800 1.5rem var(--f-display) }
.newb { background: var(--gold-soft); border-radius: 14px; padding: 12px 16px; width: 100%; max-width: 520px; text-align: left }
.pop { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); font: 800 1.6rem var(--f-display); color: var(--gold); pointer-events: none; z-index: 30 }
.veil { position: fixed; inset: 0; background: rgba(10,8,20,.5); display: grid; place-items: center; z-index: 40; padding: 16px }
.dialog { background: var(--surface); border-radius: 16px; padding: 22px; max-width: 440px; display: grid; gap: 14px }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 35 }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px }
@media (prefers-reduced-motion: no-preference) {
  .opt, .mis, .mode { transition: transform .12s, border-color .12s, background .12s }
  .opt:not([disabled]):active, .mis:not(.locked):active, .mode:not(:disabled):active { transform: scale(.98) }
  .shake { animation: shake .35s } @keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
  .bump { animation: bump .4s } @keyframes bump { 50% { transform: scale(1.04) } }
  .pop { animation: pop 1s forwards } @keyframes pop { from { opacity: 0; transform: translate(-50%, 10px) } 20% { opacity: 1 } to { opacity: 0; transform: translate(-50%, -40px) } }
  .confetti i { animation: fall 2.4s linear forwards } @keyframes fall { to { transform: translateY(110vh) rotate(720deg) } }
}
@media (prefers-reduced-motion: reduce) { .pop { display: none } .confetti { display: none } }
</style>
</head>

<script>
const DATA = {"key": "bns-physik-trainer", "label": "Physik · Lerntrainer", "eyebrow": "BNS Abiturtraining · Physik", "description": "Neun Missionen vom Hertz'schen Dipol bis zum Quantensprung. Rechenwege kommen als Schritt-Fragen vor. Sammle XP, halte deine Combo, schalte Missionen frei und hol dir Abzeichen.", "ranks": [{"xp": 0, "name": "Lichtfunke"}, {"xp": 200, "name": "Wellenreiter"}, {"xp": 450, "name": "Spaltgucker"}, {"xp": 800, "name": "Photonenjäger"}, {"xp": 1200, "name": "Quantenspringer"}, {"xp": 1700, "name": "Bohr-Kenner"}, {"xp": 2400, "name": "Quantenmeister"}], "missions": [{"id": "dipol", "icon": "📡", "title": "Auf Sendung", "subtitle": "Schwingkreis, Dipol und die elektromagnetische Welle", "briefing": ["Im **Schwingkreis** pendelt Energie zwischen elektrischem Feld (Kondensator) und magnetischem Feld (Spule).", "Ein **Hertz'scher Dipol** ist ein aufgeklappter Schwingkreis. Enden = „Kondensatorplatten“ (Ladung, Glimmlampe), Mitte = „Spule“ (Strom, Glühlampe).", "Abgestimmt ist ein Dipol bei der Länge **λ/2**.", "E und B stehen senkrecht aufeinander und senkrecht zur Ausbreitung: **Transversalwelle**, im Vakuum mit c = 3,0 · 10⁸ m/s, ohne Medium."], "questions": [{"q": "Wer sagte elektromagnetische Wellen 1864 voraus?", "a": "James Clerk Maxwell", "w": ["Heinrich Hertz", "Albert Einstein", "Wilhelm Hallwachs"], "info": "Maxwell sagte sie rechnerisch voraus, Hertz wies sie 1886 nach."}, {"q": "Welche Wellenart ist eine elektromagnetische Welle?", "a": "Transversalwelle", "w": ["Longitudinalwelle", "Druckwelle", "Oberflächenwelle"], "info": "E und B schwingen quer zur Ausbreitungsrichtung."}, {"q": "Wo am Dipol leuchtet eine Glühlampe am hellsten?", "a": "In der Mitte", "w": ["An beiden Enden", "Nur am linken Ende", "Überall gleich"], "info": "In der Mitte ist die Stromstärke maximal; sie entspricht der Spule."}, {"q": "Wo am Dipol zündet eine Glimmlampe?", "a": "An den Enden", "w": ["In der Mitte", "Nirgends", "Nur bei Gleichspannung"], "info": "An den Enden ändert sich die Ladung stark; dort ist die Spannung hoch."}, {"q": "Ein Sender hat 100 MHz. Wie lang ist ein abgestimmter Dipol?", "a": "1,5 m", "w": ["3,0 m", "0,75 m", "30 m"], "info": "λ = c/f = 3,0 m, Dipol = λ/2 = 1,5 m."}, {"q": "Wozu braucht ein Sender einen Verstärker?", "a": "Er ersetzt im richtigen Takt die Energieverluste.", "w": ["Er erhöht die Lichtgeschwindigkeit.", "Er macht aus der Welle eine Longitudinalwelle.", "Er senkt die Frequenz."], "info": "Kein Leiter ist widerstandsfrei; ohne Energiezufuhr wäre die Schwingung gedämpft."}, {"q": "Was legt die Frequenz einer Welle fest?", "a": "Allein der Sender", "w": ["Allein das Medium", "Die Wellenlänge im Medium", "Der Empfänger"], "info": "f und Amplitude kommen vom Sender, c vom Medium, λ von beiden."}, {"q": "Was passiert mit c, wenn Licht in Glas eintritt?", "a": "c wird kleiner.", "w": ["c wird größer.", "c bleibt gleich.", "c wird null."], "info": "Im Medium werden Elektronen zu erzwungenen Schwingungen angeregt; das bremst die Welle."}, {"q": "Braucht eine elektromagnetische Welle ein Medium?", "a": "Nein, sie breitet sich auch im Vakuum aus.", "w": ["Ja, mindestens Luft.", "Ja, einen Leiter.", "Nur bei hohen Frequenzen nicht."], "info": "Sonnenlicht erreicht die Erde durch den leeren Weltraum."}, {"q": "Was löst sich bei jeder Umpolung vom Dipol ab?", "a": "Eine neue Halbwelle des Feldes", "w": ["Ein Elektron", "Ein Teil der Antenne", "Ein Schallimpuls"], "info": "Die Feldlinien schnüren sich ab und laufen mit Lichtgeschwindigkeit in den Raum."}]}, {"id": "spektrum", "icon": "🌈", "title": "Das große Spektrum", "subtitle": "Frequenzbereiche, Anwendungen, AM und FM", "briefing": ["**c = λ · f**. Große Wellenlänge bedeutet kleine Frequenz.", "**Radiowellen** über 1 m (UKW 1 bis 10 m), **Mikrowellen** 1 m bis 1 mm (Handy, Herd, Radar), **Infrarot** 1 mm bis 780 nm, **sichtbar** 780 nm (rot) bis 380 nm (violett).", "**Radar** misst die Laufzeit eines Echos: Entfernung = c · t / 2.", "**AM**: Information in der Amplitude. **FM**: Information in der Frequenz der Trägerwelle."], "questions": [{"q": "Welcher Bereich hat die größten Wellenlängen?", "a": "Radiowellen", "w": ["Mikrowellen", "Infrarot", "Sichtbares Licht"], "info": "Radiowellen sind länger als 1 m, manche länger als ein Fußballfeld."}, {"q": "Welche Farbe hat die größte Wellenlänge?", "a": "Rot", "w": ["Violett", "Blau", "Grün"], "info": "Rot liegt bei etwa 780 nm, Violett bei etwa 380 nm."}, {"q": "Womit arbeitet ein Mikrowellenherd?", "a": "Mit Mikrowellen", "w": ["Mit Infrarot", "Mit UKW", "Mit Ultraviolett"], "info": "Mikrowellen reichen von 300 MHz bis 300 GHz."}, {"q": "Welche Wellen nutzt Flugradar?", "a": "Zentimeterwellen", "w": ["Langwellen", "Infrarot", "Sichtbares Licht"], "info": "3 bis 30 GHz durchdringen Dunst, Regen und Wolken."}, {"q": "Radarecho nach 0,1 ms. Wie weit ist das Ziel?", "a": "15 km", "w": ["30 km", "7,5 km", "300 km"], "info": "c · t = 30 km für Hin- und Rückweg, also 15 km Entfernung."}, {"q": "Worin steckt bei AM die Information?", "a": "In der Amplitude", "w": ["In der Frequenz", "In der Polarisation", "In der Geschwindigkeit"], "info": "AM = Amplitudenmodulation."}, {"q": "Worin steckt bei FM die Information?", "a": "In der Frequenz", "w": ["In der Amplitude", "In der Polarisation", "In der Wellenlänge des Schalls"], "info": "FM = Frequenzmodulation: Die Frequenz schwankt um den eingestellten Wert."}, {"q": "Welche Frequenz hat Licht mit λ = 600 nm?", "a": "5,0 · 10¹⁴ Hz", "w": ["1,8 · 10² Hz", "2,0 · 10⁻¹⁵ Hz", "5,0 · 10⁵ Hz"], "info": "f = c/λ = 3,0 · 10⁸ / 6,0 · 10⁻⁷ = 5,0 · 10¹⁴ Hz."}, {"q": "Warum senden heute kaum noch Langwellensender?", "a": "Lange Wellen tragen nur wenig Information.", "w": ["Lange Wellen sind gesundheitsschädlich.", "Lange Wellen reichen nicht weit.", "Lange Wellen sind langsamer."], "info": "Sie folgen zwar der Erdkrümmung, übertragen aber wenig Information auf einmal."}, {"q": "Wozu nutzt man Infrarot im Alltag?", "a": "Fernbedienung und Temperaturmessung", "w": ["Röntgenbilder", "UKW-Radio", "Flugradar"], "info": "Infrarot liegt zwischen Mikrowellen und sichtbarem Licht."}]}, {"id": "polfilter", "icon": "🕶️", "title": "Filter und Fasern", "subtitle": "Polarisation und Totalreflexion", "briefing": ["**Polarisation** = Schwingungsrichtung einer Transversalwelle. Laserlicht und Displaylicht sind polarisiert.", "Zwei Filter **parallel**: alles kommt durch. **Gekreuzt (90°)**: dunkel. **45°**: ein Teil kommt durch, danach in Richtung des zweiten Filters polarisiert.", "**Totalreflexion**: von optisch dicht nach dünn, Einfallswinkel größer als der Grenzwinkel.", "Anwendungen: Diamant (Grenzwinkel 24°), Glasfaser (Kern dichter als Mantel), Endoskop."], "questions": [{"q": "Welche Wellen kann man polarisieren?", "a": "Nur Transversalwellen", "w": ["Nur Longitudinalwellen", "Alle Wellen", "Nur Schallwellen"], "info": "Nur bei Querschwingungen gibt es eine Richtung zum Auswählen."}, {"q": "Zwei Polfilter stehen um 90° verdreht. Was siehst du dahinter?", "a": "Dunkelheit", "w": ["Volle Helligkeit", "Halbe Helligkeit", "Farbiges Licht"], "info": "Nach dem ersten Filter fehlt jeder Anteil in Richtung des zweiten."}, {"q": "Zwei Polfilter stehen parallel. Was bewirkt der zweite?", "a": "Praktisch nichts", "w": ["Er löscht alles aus.", "Er halbiert die Wellenlänge.", "Er dreht die Polarisation um 90°."], "info": "Das Licht schwingt schon in seiner Durchlassrichtung."}, {"q": "Wie prüfst du, ob Laserlicht polarisiert ist?", "a": "Polfilter drehen und Helligkeit beobachten", "w": ["Doppelspalt davorstellen", "Prisma davorstellen", "Abstand zum Schirm ändern"], "info": "Ändert sich beim Drehen die Helligkeit, ist das Licht polarisiert."}, {"q": "Was schloss Faraday 1846 aus der Drehung der Polarisation im Magnetfeld?", "a": "Licht ist eine elektromagnetische Welle.", "w": ["Licht besteht aus Photonen.", "Licht ist eine Longitudinalwelle.", "Glas ist magnetisch."], "info": "Ein Magnetfeld konnte das Licht beeinflussen, also hängt Licht mit Elektromagnetismus zusammen."}, {"q": "In welche Richtung muss Licht laufen, damit Totalreflexion möglich ist?", "a": "Von optisch dicht nach optisch dünn", "w": ["Von optisch dünn nach optisch dicht", "In beide Richtungen", "Nur senkrecht auf die Grenzfläche"], "info": "Nur dann wird vom Lot weg gebrochen und der Grenzwinkel erreicht."}, {"q": "Was passiert genau beim Grenzwinkel?", "a": "Der gebrochene Strahl läuft parallel zur Grenzfläche.", "w": ["Das Licht wird absorbiert.", "Der Strahl geht ungebrochen durch.", "Das Licht wird polarisiert."], "info": "Wird der Winkel noch größer, wird alles Licht reflektiert."}, {"q": "Warum funkelt ein Diamant?", "a": "Kleiner Grenzwinkel, viele Totalreflexionen", "w": ["Er leuchtet selbst.", "Er ist optisch dünn.", "Er polarisiert das Licht."], "info": "Diamant ist optisch sehr dicht; der Grenzwinkel beträgt nur 24°."}, {"q": "Welcher Teil einer Glasfaser ist optisch dichter?", "a": "Der Kern", "w": ["Der Mantel", "Beide gleich", "Die Schutzhülle aus Kunststoff"], "info": "Am Übergang Kern → Mantel (dicht → dünn) wird total reflektiert."}, {"q": "Wofür braucht ein Endoskop viele einzelne Fasern?", "a": "Um ein Bild Punkt für Punkt zu übertragen", "w": ["Um das Licht zu polarisieren", "Um die Wellenlänge zu verkürzen", "Um Strom zu leiten"], "info": "Jede Faser trägt einen Bildpunkt; ihre Lage muss an beiden Enden gleich sein."}]}, {"id": "doppelspalt", "icon": "🔦", "title": "Zwei Spalte, viele Streifen", "subtitle": "Doppelspalt, Gitter, weißes Licht", "briefing": ["Beugung an den Spalten, dann **Interferenz**. Maximum: **Δs = k · λ**, Minimum: Δs = (2k + 1) · λ/2.", "**d · sin α = k · λ** und **tan α = a/e**. Bei kleinen Winkeln (unter 5°): **λ = d · a / (k · e)**.", "**Gitter**: gleiche Formel mit g, aber schärfere, hellere Maxima. Bei großen Winkeln keine Näherung! Höchste Ordnung: k ≤ g/λ.", "Weißes Licht: 0. Maximum weiß, ab 1. Ordnung Spektren mit **Blau innen, Rot außen**. Ab der 2. Ordnung überlappen sie."], "questions": [{"q": "Wer führte den Doppelspaltversuch 1802 zuerst durch?", "a": "Thomas Young", "w": ["Isaac Newton", "Heinrich Hertz", "Niels Bohr"], "info": "Young nutzte noch weißes Licht."}, {"q": "Gangunterschied für das Maximum 1. Ordnung?", "a": "λ", "w": ["λ/2", "0", "2λ"], "info": "Δs = k · λ mit k = 1."}, {"q": "Gangunterschied für das erste Minimum?", "a": "λ/2", "w": ["λ", "0", "3λ/2"], "info": "Wellenberg trifft Wellental: destruktive Interferenz."}, {"q": "Spaltabstand wird halbiert. Was passiert mit dem Streifenabstand?", "a": "Er verdoppelt sich.", "w": ["Er halbiert sich.", "Er bleibt gleich.", "Er vervierfacht sich."], "info": "a = λ · e / d: a und d sind umgekehrt proportional."}, {"q": "Welche Laserfarbe gibt am selben Doppelspalt die breitesten Streifen?", "a": "Rot", "w": ["Blau", "Grün", "Alle gleich"], "info": "Rot hat die größte Wellenlänge, a ~ λ."}, {"q": "Schritt 1: d = 0,8 mm, e = 0,5 m, a = 0,304 mm. Welche Formel nutzt du?", "a": "λ = d · a / e", "w": ["λ = a · e / d", "λ = d · e / a", "λ = d / (a · e)"], "info": "Kleinwinkelnäherung: sin α ≈ tan α = a/e."}, {"q": "Schritt 2: Welche Wellenlänge ergibt sich?", "a": "486 nm", "w": ["243 nm", "972 nm", "4,86 µm"], "info": "0,8 · 10⁻³ · 0,304 · 10⁻³ / 0,5 m = 4,86 · 10⁻⁷ m."}, {"q": "Gitter mit 600 Strichen/mm. Wie groß ist g?", "a": "1,67 µm", "w": ["600 µm", "1,67 mm", "0,6 µm"], "info": "g = 1 mm / 600 = 1,67 · 10⁻⁶ m."}, {"q": "g = 1,67 µm, λ = 633 nm. Höchste beobachtbare Ordnung?", "a": "2", "w": ["3", "1", "unbegrenzt"], "info": "k ≤ g/λ = 2,63, also k = 2."}, {"q": "Welche Farbe liegt im Gitterspektrum 1. Ordnung innen?", "a": "Violett/Blau", "w": ["Rot", "Gelb", "Grün"], "info": "sin α = λ/g: kleine Wellenlänge, kleiner Winkel."}]}, {"id": "fotoeffekt", "icon": "⚡", "title": "Licht schlägt Elektronen", "subtitle": "Hallwachs, Gegenfeldmethode, Einstein", "briefing": ["**Hallwachs**: Negativ geladene Zinkplatte + UV → sofortige Entladung. Glasplatte (schluckt UV) oder Rotlicht → keine Entladung, auch bei hoher Intensität.", "**Einstein**: Licht besteht aus Photonen mit **E = h · f**. Ein Photon gibt seine Energie an **ein** Elektron ab.", "**E_kin,max = h · f − W_A**. Gegenfeldmethode: **e · U = E_kin,max**. h = 6,626 · 10⁻³⁴ Js, 1 eV = 1,602 · 10⁻¹⁹ J.", "Diagramm E_kin über f: Steigung **h**, Schnitt mit f-Achse **f_G**, mit E-Achse **−W_A**."], "questions": [{"q": "Welche Zinkplatte entlädt sich unter UV-Licht?", "a": "Die negativ geladene", "w": ["Die positiv geladene", "Beide", "Keine"], "info": "Das Licht löst Elektronen; nur die negative Platte verliert dadurch Ladung."}, {"q": "Was tut eine Glasplatte im Hallwachs-Versuch?", "a": "Sie absorbiert das UV-Licht.", "w": ["Sie lädt die Platte auf.", "Sie verstärkt das Licht.", "Sie polarisiert das Licht."], "info": "Ohne UV gibt es bei Zink keinen Fotoeffekt."}, {"q": "Wovon hängt die Energie der Fotoelektronen ab?", "a": "Von der Frequenz des Lichts", "w": ["Von der Intensität", "Von der Bestrahlungsdauer", "Vom Abstand der Lampe"], "info": "E_kin,max = h · f − W_A, keine Intensität darin."}, {"q": "Was bewirkt hellere Beleuchtung gleicher Farbe?", "a": "Mehr Elektronen, also stärkeren Strom", "w": ["Schnellere Elektronen", "Gar nichts", "Eine kleinere Austrittsarbeit"], "info": "Mehr Photonen pro Sekunde, jedes mit gleicher Energie."}, {"q": "Welcher Befund passt zum Wellenmodell?", "a": "Fotostrom ~ Bestrahlungsstärke", "w": ["Sofortiges Einsetzen", "Es gibt eine Grenzfrequenz", "E_kin unabhängig von der Intensität"], "info": "Alle anderen Befunde sprechen gegen das Wellenmodell."}, {"q": "Schritt 1: Licht mit 2,86 eV auf Kalium (W_A = 2,25 eV). E_kin,max?", "a": "0,61 eV", "w": ["5,11 eV", "2,86 eV", "1,27 eV"], "info": "2,86 eV − 2,25 eV = 0,61 eV."}, {"q": "Schritt 2: Welche Gegenspannung stoppt diese Elektronen?", "a": "0,61 V", "w": ["2,25 V", "0,61 kV", "6,1 V"], "info": "e · U = E_kin,max; in eV ist der Zahlenwert die Spannung."}, {"q": "Was gibt die Steigung im f-E_kin-Diagramm an?", "a": "Die Planck-Konstante h", "w": ["Die Austrittsarbeit", "Die Grenzfrequenz", "Die Elementarladung"], "info": "E_kin = h · f − W_A ist eine Gerade mit Steigung h."}, {"q": "Was bedeutet der Schnitt der Geraden mit der f-Achse?", "a": "Grenzfrequenz", "w": ["Austrittsarbeit", "Planck-Konstante", "Lichtgeschwindigkeit"], "info": "Dort werden Elektronen gerade eben frei, mit E_kin = 0."}, {"q": "Wer bestätigte h mit der Gegenfeldmethode (1912 bis 1915)?", "a": "Robert Millikan", "w": ["Philipp Lenard", "Heinrich Hertz", "Max Born"], "info": "Einstein erhielt 1921 den Nobelpreis für die Deutung des Fotoeffekts."}]}, {"id": "compton", "icon": "🎱", "title": "Photonen mit Wucht", "subtitle": "E = m · c², Photonenimpuls, Compton-Effekt", "briefing": ["Aus **E = m · c²** und E = h · f: m = h/(c · λ), **p = h/λ**. Ruhemasse null.", "Nachweis des Impulses: Spiegel am Faden, Kometenschweif.", "**Compton**: Röntgenquant stößt mit freiem Elektron, gibt Energie ab, **λ wird größer**.", "**Δλ = λ_C (1 − cos θ)** mit λ_C = h/(m_e c) = 2,43 pm. Maximal 2 λ_C = 4,85 pm bei 180°."], "questions": [{"q": "Wie lautet der Impuls eines Photons?", "a": "p = h/λ", "w": ["p = h · λ", "p = h · f", "p = m₀ · c"], "info": "p = m · c = h · f/c = h/λ."}, {"q": "Wie groß ist die Ruhemasse eines Photons?", "a": "Null", "w": ["9,11 · 10⁻³¹ kg", "h/c²", "1,67 · 10⁻²⁷ kg"], "info": "Photonen existieren nur mit Lichtgeschwindigkeit."}, {"q": "Warum zeigt ein Kometenschweif von der Sonne weg?", "a": "Photonen übertragen Impuls auf den Staub.", "w": ["Der Komet ist magnetisch.", "Der Staub wird von der Sonne angezogen.", "Der Schweif ist eine Spiegelung."], "info": "Jedes Photon überträgt bei Absorption oder Reflexion Impuls."}, {"q": "Was passiert mit der Wellenlänge des gestreuten Röntgenquants?", "a": "Sie wird größer.", "w": ["Sie wird kleiner.", "Sie bleibt gleich.", "Sie wird null."], "info": "Weniger Energie, kleinere Frequenz, größere Wellenlänge."}, {"q": "Wie groß ist die Compton-Wellenlänge des Elektrons?", "a": "2,43 pm", "w": ["4,85 pm", "0,53 · 10⁻¹⁰ m", "486 nm"], "info": "λ_C = h/(m_e c)."}, {"q": "Bei welchem Streuwinkel ist Δλ am größten?", "a": "180°", "w": ["90°", "0°", "45°"], "info": "1 − cos 180° = 2."}, {"q": "Wie groß ist Δλ bei θ = 90°?", "a": "2,43 pm", "w": ["0 pm", "4,85 pm", "1,21 pm"], "info": "cos 90° = 0, also Δλ = λ_C."}, {"q": "Schritt 1: λ = 2,5 pm, θ = 60°. Wie groß ist Δλ?", "a": "1,21 pm", "w": ["2,43 pm", "3,64 pm", "0,5 pm"], "info": "2,43 pm · (1 − 0,5) = 1,21 pm."}, {"q": "Schritt 2: Welche Wellenlänge hat das gestreute Quant?", "a": "3,71 pm", "w": ["1,29 pm", "2,5 pm", "4,93 pm"], "info": "2,5 pm + 1,21 pm. Sie wird größer."}, {"q": "Warum zeigt sichtbares Licht keinen merklichen Compton-Effekt?", "a": "Δλ ist gegen 600 nm winzig.", "w": ["Licht hat keinen Impuls.", "Licht trifft keine Elektronen.", "Licht ist zu schnell."], "info": "4,85 pm sind weniger als ein Hunderttausendstel von 600 nm."}]}, {"id": "debroglie", "icon": "🌊", "title": "Elektronen als Wellen", "subtitle": "de Broglie, Elektronenbeugung, Wesenszüge", "briefing": ["**de Broglie**: Auch Teilchen haben eine Wellenlänge **λ = h/p = h/(m · v)**.", "Beschleunigte Elektronen: **p = √(2 m e U)**, also λ = h/√(2 m e U). Bei 2 kV: λ ≈ 2,7 · 10⁻¹¹ m.", "Nachweise: **Davisson und Germer 1927** (Nickelkristall), **Jönsson 1961** (Doppelspalt mit Elektronen).", "Einzelne Elektronen: einzelne Treffer, viele ergeben das Interferenzmuster. **Weginformation zerstört die Interferenz** (Komplementarität).", "**Born**: |Ψ|² ~ Wahrscheinlichkeit, das Objekt dort nachzuweisen."], "questions": [{"q": "Wie lautet die de-Broglie-Wellenlänge?", "a": "λ = h/p", "w": ["λ = h · p", "λ = p/h", "λ = h · f"], "info": "Je größer der Impuls, desto kleiner die Wellenlänge."}, {"q": "Schritt 1: Elektron mit 2 kV beschleunigt. E_kin in J?", "a": "3,2 · 10⁻¹⁶ J", "w": ["3,2 · 10⁻¹⁹ J", "2,0 · 10³ J", "1,6 · 10⁻¹⁶ J"], "info": "E = e · U = 1,602 · 10⁻¹⁹ C · 2 000 V."}, {"q": "Schritt 2: Welche Formel liefert den Impuls?", "a": "p = √(2 · m · E)", "w": ["p = 2 · m · E", "p = √(E/m)", "p = m · E²"], "info": "Aus E = p²/(2m) umgestellt."}, {"q": "Schritt 3: λ für Elektronen mit 2 kV?", "a": "2,7 · 10⁻¹¹ m", "w": ["2,7 · 10⁻⁷ m", "4,9 · 10⁻¹⁹ m", "2,4 · 10⁻¹² m"], "info": "Etwa 20 000-mal kleiner als sichtbares Licht."}, {"q": "Womit wiesen Davisson und Germer Elektronenwellen nach?", "a": "Mit einem Nickelkristall als Gitter", "w": ["Mit einem Polfilter", "Mit einer Glasfaser", "Mit einem Prisma"], "info": "Die Atomabstände passen zur winzigen Wellenlänge."}, {"q": "Wer zeigte 1961 Interferenz von Elektronen am Doppelspalt?", "a": "Claus Jönsson", "w": ["Thomas Young", "Max Born", "Ernest Rutherford"], "info": "Spalte 0,5 µm breit, 2 µm Abstand, 50 kV."}, {"q": "Was sieht man, wenn einzelne Elektronen nacheinander durch den Doppelspalt fliegen?", "a": "Erst Einzeltreffer, mit der Zeit ein Streifenmuster", "w": ["Sofort ein Streifenmuster", "Nur zwei Streifen", "Nichts"], "info": "Einzelereignis zufällig, Verteilung reproduzierbar: statistisches Verhalten."}, {"q": "Was passiert, wenn man misst, durch welchen Spalt das Elektron fliegt?", "a": "Die Interferenz verschwindet.", "w": ["Die Interferenz wird stärker.", "Das Elektron teilt sich.", "Nichts ändert sich."], "info": "Komplementarität: Weginformation und Interferenz schließen sich aus."}, {"q": "Wofür steht |Ψ|² nach Born?", "a": "Nachweiswahrscheinlichkeit an einem Ort", "w": ["Bahn des Elektrons", "Ladung des Elektrons", "Energie des Photons"], "info": "Ψ selbst hat keine reale Bedeutung."}, {"q": "Welcher Wesenszug sagt: Messergebnisse sind immer eindeutig?", "a": "Wesenszug 3", "w": ["Wesenszug 1", "Wesenszug 2", "Wesenszug 4"], "info": "1 statistisch, 2 Interferenz, 3 eindeutige Messergebnisse, 4 Komplementarität."}]}, {"id": "atom", "icon": "⚛️", "title": "Ins Innere des Atoms", "subtitle": "Dalton, Thomson, Rutherford, Ölfleck", "briefing": ["**Dalton** (1809): Atome sind kleinste Kugeln, je Element mit eigener Masse.", "**Thomson** (1897): Elektron entdeckt. **Rosinenkuchenmodell**: positive Ladung verteilt, Elektronen eingebettet. e/m = 2U/(r² B²).", "**Rutherford** (Geiger, Marsden 1909): Alphateilchen auf Goldfolie. Fast alle durch, 1 von 20 000 über 90°. → winziger, positiver, schwerer **Kern**.", "Grenze: Kreisendes Elektron ist beschleunigt, müsste strahlen und abstürzen; Linienspektren unerklärt.", "**Ölfleck**: Molekülgröße h = V/A bei einer Schicht aus einer Molekülage."], "questions": [{"q": "Wie heißt Thomsons Atommodell?", "a": "Rosinenkuchenmodell", "w": ["Planetenmodell", "Schalenmodell", "Kugelwolkenmodell"], "info": "Elektronen stecken wie Rosinen in positiver Ladung."}, {"q": "Welches Teilchen entdeckte Thomson?", "a": "Das Elektron", "w": ["Das Proton", "Das Neutron", "Das Photon"], "info": "Kathodenstrahlen bestehen aus negativen Teilchen, viel leichter als Atome."}, {"q": "Womit wurde die Goldfolie beschossen?", "a": "Mit Alphateilchen", "w": ["Mit Elektronen", "Mit Röntgenstrahlen", "Mit Neutronen"], "info": "Alphateilchen sind Heliumkerne He²⁺."}, {"q": "Was taten fast alle Alphateilchen?", "a": "Sie gingen fast ungestört durch.", "w": ["Sie wurden zurückgeworfen.", "Sie blieben in der Folie stecken.", "Sie wurden um 90° abgelenkt."], "info": "Das Atom ist größtenteils leer."}, {"q": "Welche Beobachtung widerlegt Thomson?", "a": "Rückstreuung über 90°", "w": ["Ungestörter Durchgang", "Kleine Ablenkungen", "Leuchten des Schirms"], "info": "Nur ein kleiner, schwerer, positiver Kern kann ein Alphateilchen umkehren."}, {"q": "Wie groß ist der Kern nach Rutherford höchstens?", "a": "etwa 10⁻¹⁴ m", "w": ["etwa 10⁻¹⁰ m", "etwa 10⁻⁶ m", "etwa 1 mm"], "info": "Das Atom selbst ist etwa 10⁻¹⁰ m groß."}, {"q": "Warum müsste das Elektron bei Rutherford in den Kern stürzen?", "a": "Als beschleunigte Ladung strahlt es Energie ab.", "w": ["Es ist schwerer als der Kern.", "Der Kern ist negativ.", "Es hat keinen Impuls."], "info": "Das klassische Atom wäre nicht stabil."}, {"q": "Ölfleck: V = 5 · 10⁻¹¹ m³, A = 0,05 m². Dicke?", "a": "1 · 10⁻⁹ m", "w": ["2,5 · 10⁻¹² m", "1 · 10⁹ m", "1 · 10⁻⁶ m"], "info": "h = V/A = 5 · 10⁻¹¹ / 0,05 = 1 · 10⁻⁹ m."}, {"q": "Welche Annahme braucht der Ölfleckversuch?", "a": "Der Film ist nur eine Molekülage dick.", "w": ["Ölsäure löst sich in Wasser.", "Moleküle sind würfelförmig und hohl.", "Benzin bleibt im Film."], "info": "Nur dann ist die Filmdicke gleich dem Moleküldurchmesser."}, {"q": "Wie lautet e/m aus dem Fadenstrahlrohr?", "a": "e/m = 2U/(r² B²)", "w": ["e/m = U/(r B)", "e/m = 2U · r² · B²", "e/m = r² B²/(2U)"], "info": "Lorentzkraft = Zentripetalkraft, dazu ½ m v² = e U."}]}, {"id": "bohr", "icon": "🪐", "title": "Quantensprung", "subtitle": "Bohr, Energieniveaus, Linienspektren", "briefing": ["**Bohr 1913**: Nur bestimmte Bahnen, dort **strahlungsfrei**. Licht nur beim Sprung: **h · f = E_m − E_n**.", "Quantenbedingung: **2π r_n = n · λ** (stehende de-Broglie-Welle). **r_n = n² · 0,53 · 10⁻¹⁰ m**.", "**E_n = −13,6 eV / n²**. Ionisierung aus n = 1: 13,6 eV.", "Serien: **Lyman** → n = 1 (UV), **Balmer** → n = 2 (sichtbar), **Paschen** → n = 3 (IR).", "Absorption nur bei passender Energie: Na-Linie 589 nm, Fraunhofer-Linien. Grenze: Bohr klappt nur für Wasserstoff."], "questions": [{"q": "Wann sendet ein Atom nach Bohr Licht aus?", "a": "Beim Sprung auf ein tieferes Niveau", "w": ["Ständig beim Kreisen", "Nur beim Ionisieren", "Nur im Grundzustand"], "info": "Auf den erlaubten Bahnen kreist das Elektron strahlungsfrei."}, {"q": "Wie hängt r_n von n ab?", "a": "r_n ~ n²", "w": ["r_n ~ n", "r_n ~ 1/n", "r_n ~ 1/n²"], "info": "r_n = n² · r₁."}, {"q": "E₂ im Wasserstoffatom?", "a": "−3,40 eV", "w": ["−6,80 eV", "−13,6 eV", "+3,40 eV"], "info": "−13,6 eV / 4."}, {"q": "Schritt 1: Sprung 3 → 2. Wie groß ist ΔE?", "a": "1,89 eV", "w": ["3,40 eV", "4,91 eV", "12,09 eV"], "info": "−1,51 eV − (−3,40 eV) = 1,89 eV."}, {"q": "Schritt 2: Welche Wellenlänge gehört zu 1,89 eV?", "a": "656 nm (rot)", "w": ["486 nm (blaugrün)", "122 nm (UV)", "1 875 nm (IR)"], "info": "λ = h · c / ΔE mit ΔE = 3,03 · 10⁻¹⁹ J."}, {"q": "Wie viel Energie braucht die Ionisierung aus dem Grundzustand?", "a": "13,6 eV", "w": ["10,2 eV", "3,4 eV", "1,89 eV"], "info": "Sprung von n = 1 nach n → ∞."}, {"q": "Auf welches Niveau führen die Sprünge der Balmer-Serie?", "a": "n = 2", "w": ["n = 1", "n = 3", "n = 4"], "info": "Balmer liegt im sichtbaren Bereich."}, {"q": "In welchem Bereich liegt die Lyman-Serie?", "a": "Ultraviolett", "w": ["Sichtbar", "Infrarot", "Radiowellen"], "info": "Sprünge auf n = 1 sind die energiereichsten."}, {"q": "Natriumdampf vor weißem Licht. Wo fehlt Licht?", "a": "Bei 589 nm", "w": ["Bei 656 nm", "Im ganzen Spektrum", "Nirgends"], "info": "Dort, wo Natrium auch selbst leuchtet: Resonanzabsorption."}, {"q": "Kann H im Grundzustand ein 11-eV-Photon absorbieren?", "a": "Nein, es passt zu keinem Übergang.", "w": ["Ja, und springt nach n = 2.", "Ja, und wird ionisiert.", "Ja, und springt nach n = 3."], "info": "1 → 2 braucht 10,2 eV, 1 → 3 braucht 12,1 eV. Photonen werden nur ganz absorbiert."}]}], "rules": ["Jeder Test hat 20 Aufgaben und 30 Minuten. Die Uhr läuft weiter, auch wenn du die App schließt; bei 0:00 wird automatisch abgegeben.", "Gezählt wird die zuletzt angetippte Antwort. Über die Nummernleiste springst du zu jeder Aufgabe, mit „Markieren“ merkst du dir Aufgaben für einen zweiten Durchgang.", "Falsche Antworten kosten keine Punkte; lass also keine Aufgabe leer.", "Am Ende siehst du zu jeder Aufgabe die Lösung mit Begründung. Tipp: Erst die Lösungen der Fehler lesen, dann den Test wiederholen."], "rules_title": "So funktionieren die Tests", "back": {"href": "index.html", "label": "Übersicht Physik"}};

};
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };
const M = DATA.missions;
const RANKS = DATA.ranks || [{ xp: 0, name: "Neuling" }];
const XP_RIGHT = 10, XP_COMBO = 5, XP_STAR = 10, XP_BLITZ = 5, BLITZ_SEC = 60;

function blank() { return { xp: 0, mis: {}, wrong: [], fixed: 0, maxCombo: 0, blitzBest: 0, badges: [], last: null, streak: 0 } }
let P = Object.assign(blank(), store.get("p", {}));
const save = () => store.set("p", P);

const BADGES = [
  { id: "erster", e: "🎯", name: "Erster Einsatz", how: "Schließe eine Mission ab", ok: () => done() >= 1 },
  { id: "perfekt", e: "💎", name: "Fehlerfrei", how: "Eine Mission mit drei Sternen", ok: () => M.some(m => (P.mis[m.id] || {}).stars === 3) },
  { id: "combo5", e: "🔥", name: "Im Flow", how: "Fünf richtige Antworten in Folge", ok: () => P.maxCombo >= 5 },
  { id: "combo10", e: "⚡", name: "Unaufhaltsam", how: "Zehn richtige Antworten in Folge", ok: () => P.maxCombo >= 10 },
  { id: "halbzeit", e: "🧭", name: "Halbzeit", how: "Vier Missionen abgeschlossen", ok: () => done() >= 4 },
  { id: "alle", e: "🏆", name: "Missionsziel", how: "Alle Missionen abgeschlossen", ok: () => done() === M.length },
  { id: "sterne", e: "🌟", name: "Sternenjäger", how: "Überall drei Sterne", ok: () => stars() === M.length * 3 },
  { id: "blitz", e: "⏱️", name: "Blitzmerker", how: "Zehn Treffer in einer Blitzrunde", ok: () => P.blitzBest >= 10 },
  { id: "fehler", e: "🛠️", name: "Aus Fehlern gelernt", how: "Zehn Fehler im Fehlertraining ausgebügelt", ok: () => P.fixed >= 10 },
  { id: "serie", e: "📅", name: "Dranbleiber", how: "An drei Tagen in Folge geübt", ok: () => P.streak >= 3 },
  { id: "legende", e: "👑", name: "Legende", how: "Den höchsten Rang erreichen", ok: () => P.xp >= RANKS[RANKS.length - 1].xp },
];

function done() { return M.filter(m => (P.mis[m.id] || {}).stars > 0).length }
function stars() { return M.reduce((n, m) => n + ((P.mis[m.id] || {}).stars || 0), 0) }
function unlocked(i) { return i === 0 || (P.mis[M[i - 1].id] || {}).stars > 0 }
function rank() { let r = 0; RANKS.forEach((x, i) => { if (P.xp >= x.xp) r = i }); return r }
function starStr(n, size) { return [0, 1, 2].map(i => i < n ? "★" : `<span class="off">★</span>`).join("") }
function today() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate() }
function touchStreak() {
  const t = today(); if (P.last === t) return;
  const y = new Date(Date.now() - 864e5); const ys = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();
  P.streak = P.last === ys ? P.streak + 1 : 1; P.last = t;
}
function newBadges() { const n = BADGES.filter(b => !P.badges.includes(b.id) && b.ok()); n.forEach(b => P.badges.push(b.id)); return n }
function qkey(mi, qi) { return M[mi].id + ":" + qi }
function fromKey(k) { const [id, qi] = k.split(":"); const mi = M.findIndex(m => m.id === id); return mi < 0 || !M[mi].questions[+qi] ? null : { mi, qi: +qi } }

/* ---------- Startseite ---------- */
function clearFx() { document.querySelectorAll(".pop,.confetti").forEach(x => x.remove()) }
function home() {
  stopTimer(); clearFx();
  const r = rank(), cur = RANKS[r], nxt = RANKS[r + 1];
  const pct = nxt ? Math.round((P.xp - cur.xp) / (nxt.xp - cur.xp) * 100) : 100;
  const nextIdx = M.findIndex((m, i) => unlocked(i) && !((P.mis[m.id] || {}).stars > 0));
  const wrongN = P.wrong.filter(fromKey).length;
  app.innerHTML = `<div class="wrap">
    <div class="top">${DATA.back ? `<a href="${esc(DATA.back.href)}">← ${esc(DATA.back.label)}</a>` : "<span></span>"}<button class="btn" id="reset">Fortschritt löschen</button></div>
    <div class="hero"><span class="eyebrow">${esc(DATA.eyebrow || "Lerntrainer")}</span><h1>${esc(DATA.label)}</h1>
      <p>${md(DATA.description || "")}</p>
      <div class="stats"><div class="stat"><b>${esc(cur.name)}</b><span>Rang ${r + 1} von ${RANKS.length}</span></div>
        <div class="stat"><b>${P.xp}</b><span>XP</span></div><div class="stat"><b>${stars()} / ${M.length * 3}</b><span>Sterne</span></div>
        <div class="stat"><b>${P.streak || 0} 🔥</b><span>Tage in Folge</span></div></div>
      <div><div class="xpbar"><i style="width:${pct}%"></i></div>
        <p style="font-size:.85rem;margin-top:6px">${nxt ? `Noch ${nxt.xp - P.xp} XP bis „${esc(nxt.name)}“` : "Höchster Rang erreicht. Respekt."}</p></div></div>
    <div class="sec"><h2>Missionen</h2><span class="muted">${done()} von ${M.length} geschafft</span></div>
    <div class="map">${M.map((m, i) => {
      const s = (P.mis[m.id] || {}).stars || 0, lock = !unlocked(i);
      return `<button class="mis${s ? " done" : ""}${i === nextIdx ? " next" : ""}${lock ? " locked" : ""}" data-m="${i}" ${lock ? 'aria-disabled="true"' : ""}>
        <span class="no">${i + 1}</span><span class="ic">${lock ? "🔒" : m.icon || "📜"}</span><h3>${esc(m.title)}</h3>
        <span class="muted" style="font-size:.9rem">${esc(m.subtitle || "")}</span><span class="st">${starStr(s)}</span></button>`
    }).join("")}</div>
    <div class="sec"><h2>Spezialmodi</h2></div>
    <div class="modes">
      <button class="mode" id="blitz" ${done() ? "" : "disabled"}><span style="font-size:1.6rem">⏱️</span><h3>Blitzrunde</h3>
        <span class="muted">${BLITZ_SEC} Sekunden, so viele Treffer wie möglich. Falsch kostet 3 Sekunden. Rekord: <strong>${P.blitzBest}</strong></span>
        ${done() ? "" : `<span class="muted" style="font-size:.85rem">Schalte zuerst eine Mission frei.</span>`}</button>
      <button class="mode" id="fix" ${wrongN ? "" : "disabled"}><span style="font-size:1.6rem">🛠️</span><h3>Fehlertraining</h3>
        <span class="muted">${wrongN ? `${wrongN} ${wrongN === 1 ? "Frage wartet" : "Fragen warten"} auf eine zweite Chance.` : "Keine offenen Fehler. Stark!"}</span></button>
    </div>
    <div class="sec"><h2>Abzeichen</h2><span class="muted">${P.badges.length} von ${BADGES.length}</span></div>
    <div class="badges">${BADGES.map(b => `<div class="badge${P.badges.includes(b.id) ? "" : " off"}"><span class="e">${b.e}</span><b>${esc(b.name)}</b><span>${esc(b.how)}</span></div>`).join("")}</div>
  </div>`;
  app.querySelectorAll(".mis").forEach(b => b.onclick = () => { const i = +b.dataset.m; if (unlocked(i)) briefing(i) });
  app.querySelector("#blitz").onclick = blitz;
  app.querySelector("#fix").onclick = fixRound;
  app.querySelector("#reset").onclick = () => confirmBox("Fortschritt löschen?", "XP, Sterne, Abzeichen und Fehlerliste dieses Trainers werden gelöscht.", "Ja, löschen", () => { P = blank(); save(); home() });
  window.scrollTo({ top: 0 });
}

function confirmBox(title, text, yes, fn) {
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(text)}</p>
    <div class="row"><button class="btn" id="no">Abbrechen</button><button class="btn primary" id="yes">${esc(yes)}</button></div></div>`;
  document.body.appendChild(v);
  v.querySelector("#no").onclick = () => v.remove();
  v.querySelector("#yes").onclick = () => { v.remove(); fn() };
}

/* ---------- Briefing ---------- */
function briefing(mi) {
  clearFx();
  const m = M[mi], best = (P.mis[m.id] || {}).stars || 0;
  app.innerHTML = `<div class="wrap">
    <div class="top"><a href="#" id="back">← Missionen</a><span class="pill">Bestleistung ${starStr(best)}</span></div>
    <div class="card"><span class="eyebrow">Mission ${mi + 1} · Briefing</span>
      <h1><span aria-hidden="true">${m.icon || "📜"}</span> ${esc(m.title)}</h1>
      <p class="muted">${esc(m.subtitle || "")}. Lies dir das kurz durch, dann geht es los.</p>
      <ul class="brief">${m.briefing.map(b => `<li>${md(b)}</li>`).join("")}</ul>
      <p class="muted">${m.questions.length} Fragen · 3 Leben · ab drei Richtigen in Folge gibt es Combo-Bonus. Fehlerfrei bringt drei Sterne.</p>
      <div class="row"><button class="btn primary big" id="go">Mission starten</button></div></div></div>`;
  app.querySelector("#back").onclick = e => { e.preventDefault(); home() };
  app.querySelector("#go").onclick = () => play({ mode: "mission", mi, queue: shuffle(m.questions.map((_, qi) => ({ mi, qi }))) });
  window.scrollTo({ top: 0 });
}

/* ---------- Spielrunde ---------- */
let G = null, timer = null;
function stopTimer() { clearInterval(timer); timer = null }

function play(cfg) {
  G = Object.assign({ pos: 0, lives: 3, combo: 0, right: 0, errors: 0, xp: 0, maxCombo: 0 }, cfg);
  if (G.mode === "blitz") { G.end = Date.now() + BLITZ_SEC * 1000; stopTimer(); timer = setInterval(tickBlitz, 250) }
  question();
}

function current() { return G.queue[G.pos] }

function question() {
  if (G.mode === "blitz" && G.pos >= G.queue.length) G.queue = G.queue.concat(blitzQueue());
  const c = current(), m = M[c.mi], Q = m.questions[c.qi];
  const opts = shuffle([Q.a].concat(Q.w));
  const total = G.queue.length;
  app.innerHTML = `<div class="wrap">
    <div class="hud"><button class="btn" id="quit" aria-label="Runde abbrechen">✕</button>
      ${G.mode === "blitz" ? `<span class="pill time" id="time">${BLITZ_SEC}</span><span class="pill">Treffer ${G.right}</span>`
        : `<div class="prog" aria-hidden="true"><i style="width:${Math.round(G.pos / total * 100)}%"></i></div>`}
      ${G.mode === "mission" ? `<span class="hearts" aria-label="${G.lives} Leben">${[0, 1, 2].map(i => i < G.lives ? "❤️" : `<span class="off">❤️</span>`).join("")}</span>` : ""}
      ${G.combo >= 2 ? `<span class="pill combo">🔥 ${G.combo}</span>` : ""}</div>
    <div class="card" id="card"><span class="eyebrow">${G.mode === "blitz" ? "Blitzrunde" : G.mode === "fix" ? "Fehlertraining" : "Mission " + (c.mi + 1)} · ${esc(m.title)}${G.mode !== "blitz" ? ` · Frage ${G.pos + 1} von ${total}` : ""}</span>
      <div class="q" id="qtext">${md(Q.q)}</div>
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="l">${"ABCDEF"[i]}</span><span>${md(o)}</span></button>`).join("")}</div>
      <div id="fb" aria-live="polite"></div></div></div>`;
  app.querySelector("#quit").onclick = () => confirmBox("Runde abbrechen?", "Bereits gesammelte XP bleiben erhalten.", "Abbrechen", () => { save(); home() });
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b, opts[+b.dataset.i] === Q.a, opts.indexOf(Q.a)));
  if (G.mode === "blitz") tickBlitz();
  window.scrollTo({ top: 0 });
}

function popText(t) { const d = document.createElement("div"); d.className = "pop"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1000) }

function answer(btn, ok, okIdx) {
  if (G.locked) return; G.locked = true;
  const c = current(), Q = M[c.mi].questions[c.qi], key = qkey(c.mi, c.qi);
  const buttons = app.querySelectorAll(".opt");
  buttons.forEach(b => b.disabled = true);
  buttons[okIdx].classList.add("ok");
  let gained = 0;
  if (ok) {
    G.right++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); P.maxCombo = Math.max(P.maxCombo, G.combo);
    gained = G.mode === "blitz" ? XP_BLITZ : XP_RIGHT;
    if (G.combo >= 3 && G.mode !== "blitz") gained += XP_COMBO;
    const wi = P.wrong.indexOf(key);
    if (wi >= 0) { P.wrong.splice(wi, 1); if (G.mode === "fix") P.fixed++ }
    btn.classList.add("bump");
  } else {
    G.errors++; G.combo = 0; btn.classList.add("bad", "shake");
    if (!P.wrong.includes(key)) P.wrong.push(key);
    if (G.mode === "mission") G.lives--;
    if (G.mode === "blitz") G.end -= 3000;
  }
  G.xp += gained; P.xp += gained; save();
  if (gained) popText("+" + gained + " XP" + (G.combo >= 3 && G.mode !== "blitz" ? " · Combo!" : ""));
  if (G.mode === "blitz") { setTimeout(() => { G.locked = false; G.pos++; if (G.end > Date.now()) question() }, ok ? 450 : 900); return }
  const last = G.pos === G.queue.length - 1 || (G.mode === "mission" && G.lives <= 0);
  document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "ok" : "bad"}">
    <h3>${ok ? ["Richtig!", "Genau so.", "Sitzt!", "Stark!"][Math.floor(Math.random() * 4)] : "Leider daneben."}</h3>
    ${ok ? "" : `<p><strong>Richtig ist:</strong> ${md(Q.a)}</p>`}
    <p>${md(Q.info)}</p></div>
    <div class="row" style="margin-top:12px"><button class="btn primary big" id="next">${last ? "Auswertung" : "Weiter"}</button></div>`;
  const nb = document.getElementById("next"); nb.focus({ preventScroll: true });
  nb.onclick = () => { G.locked = false; if (last) finish(); else { G.pos++; question() } };
  nb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ---------- Auswertung ---------- */
function finish() {
  stopTimer(); clearFx();
  const prevRank = rank();
  let title, sub, starsNow = null, extra = 0;
  if (G.mode === "mission") {
    const m = M[G.mi], rec = P.mis[m.id] || { stars: 0, plays: 0 };
    rec.plays = (rec.plays || 0) + 1;
    if (G.lives > 0) {
      starsNow = G.errors === 0 ? 3 : G.errors === 1 ? 2 : 1;
      extra = Math.max(0, starsNow - (rec.stars || 0)) * XP_STAR;
      rec.stars = Math.max(rec.stars || 0, starsNow);
      title = starsNow === 3 ? "Perfekte Mission!" : "Mission geschafft!";
      sub = `${G.right} von ${G.queue.length} richtig.${extra ? ` Sterne-Bonus: +${extra} XP.` : ""}`;
    } else {
      title = "Mission gescheitert"; sub = "Alle Leben weg. Die gesammelten XP behältst du. Lies das Briefing noch einmal und versuch es erneut.";
    }
    P.mis[m.id] = rec;
  } else if (G.mode === "blitz") {
    const rec = G.right > P.blitzBest; P.blitzBest = Math.max(P.blitzBest, G.right);
    title = rec ? "Neuer Rekord!" : "Zeit abgelaufen"; sub = `${G.right} Treffer, ${G.errors} Fehler. Dein Rekord: ${P.blitzBest}.`;
  } else {
    title = "Fehlertraining beendet"; sub = `${G.right} von ${G.queue.length} sitzen jetzt.${P.wrong.length ? ` Noch offen: ${P.wrong.filter(fromKey).length}.` : " Deine Fehlerliste ist leer."}`;
  }
  P.xp += extra; touchStreak();
  const nb = newBadges(); save();
  const up = rank() > prevRank;
  app.innerHTML = `<div class="wrap"><div class="card result">
    <span class="eyebrow">${G.mode === "mission" ? "Mission " + (G.mi + 1) + " · " + esc(M[G.mi].title) : G.mode === "blitz" ? "Blitzrunde" : "Fehlertraining"}</span>
    ${starsNow !== null ? `<div class="stars" aria-label="${starsNow} Sterne">${starStr(starsNow)}</div>` : `<div class="stars" style="font-size:2.6rem">${G.mode === "blitz" ? "⏱️" : G.mode === "fix" ? "🛠️" : "💔"}</div>`}
    <h1>${esc(title)}</h1><p class="muted">${esc(sub)}</p>
    <div class="gain"><div><b>+${G.xp + extra}</b><span class="muted">XP</span></div><div><b>${G.maxCombo}</b><span class="muted">beste Combo</span></div><div><b>${esc(RANKS[rank()].name)}</b><span class="muted">${up ? "Aufgestiegen!" : "Rang"}</span></div></div>
    ${nb.length ? `<div class="newb"><strong>Neues Abzeichen${nb.length > 1 ? "" : ""}:</strong> ${nb.map(b => b.e + " " + esc(b.name)).join(" · ")}</div>` : ""}
    <div class="row" style="justify-content:center">
      ${G.mode === "mission" ? `<button class="btn" id="again">Nochmal</button>${starsNow && G.mi < M.length - 1 ? `<button class="btn primary" id="nextm">Nächste Mission</button>` : ""}` : ""}
      ${G.mode === "blitz" ? `<button class="btn" id="again">Noch eine Runde</button>` : ""}
      <button class="btn${G.mode === "mission" && starsNow && G.mi < M.length - 1 ? "" : " primary"}" id="home">Zur Übersicht</button></div></div></div>`;
  const a = document.getElementById("again"); if (a) a.onclick = () => G.mode === "blitz" ? blitz() : briefing(G.mi);
  const n = document.getElementById("nextm"); if (n) n.onclick = () => briefing(G.mi + 1);
  document.getElementById("home").onclick = home;
  if (starsNow === 3 || up || (G.mode === "blitz" && G.right >= 10)) confetti();
  window.scrollTo({ top: 0 });
}

function confetti() {
  const c = document.createElement("div"); c.className = "confetti";
  const col = ["#5b3fd6", "#2f80ed", "#e0a100", "#1f8a4c", "#c8372d", "#ff7ab6"];
  for (let i = 0; i < 60; i++) { const s = document.createElement("i"); s.style.left = Math.random() * 100 + "%"; s.style.background = col[i % col.length]; s.style.animationDelay = Math.random() * .8 + "s"; c.appendChild(s) }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3500);
}

/* ---------- Spezialmodi ---------- */
function blitzQueue() {
  const pool = [];
  M.forEach((m, mi) => { if ((P.mis[m.id] || {}).stars > 0) m.questions.forEach((_, qi) => pool.push({ mi, qi })) });
  return shuffle(pool);
}
function blitz() { const q = blitzQueue(); if (!q.length) return home(); play({ mode: "blitz", queue: q }) }
function tickBlitz() {
  if (!G || G.mode !== "blitz") return stopTimer();
  const left = Math.max(0, Math.ceil((G.end - Date.now()) / 1000));
  const t = document.getElementById("time"); if (t) { t.textContent = left + " s"; t.classList.toggle("low", left <= 10) }
  if (left <= 0) { stopTimer(); G.locked = true; finish() }
}
function fixRound() {
  const q = shuffle(P.wrong.map(fromKey).filter(Boolean)).slice(0, 10);
  if (!q.length) return home();
  play({ mode: "fix", queue: q });
}

home();
</script>

</body>
</html>
