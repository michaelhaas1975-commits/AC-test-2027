<style>
/* Layout: Prüfungsraum am iPad. Feste Kopfleiste mit Uhr, Nummernleiste, eine Aufgabe je Bildschirm, große Antwortflächen. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #18232f; --muted: #5b6876; --line: #d6dde4;

  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10171e; --surface: #18222c; --ink: #e6edf3; --muted: #9aa8b5; --line: #2c3a47;
  --accent: #7fb6d6; --accent-soft: #1f3341; --mark: #e2a24e; --mark-soft: #3a2a14;
  --ok: #6fc28a; --ok-soft: #173223; --bad: #ef8a7d; --bad-soft: #3a1c18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10171e; --surface: #18222c; --ink: #e6edf3; --muted: #9aa8b5; --line: #2c3a47;
  --accent: #7fb6d6; --accent-soft: #1f3341; --mark: #e2a24e; --mark-soft: #3a2a14;
  --ok: #6fc28a; --ok-soft: #173223; --bad: #ef8a7d; --bad-soft: #3a1c18; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--f-body); -webkit-tap-highlight-color: transparent }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h1 { font-size: 2rem } h2 { font-size: 1.35rem } h3 { font-size: 1.05rem }
.eyebrow { font: 700 .74rem/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none }
button:focus-visible, .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 18px; min-height: 48px; font-weight: 700 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface) }
.btn.warn { color: var(--mark); border-color: var(--mark) }
.btn.on { background: var(--mark-soft); border-color: var(--mark); color: var(--mark) }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center }
.muted { color: var(--muted) }

/* Startseite */
.hero { display: grid; gap: 10px; padding-block: 18px 26px }
.hero p { max-width: 62ch; margin: 0 }
.tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 10px; align-content: start }
.card .meta { font-family: var(--f-mono); font-size: .85rem; color: var(--muted) }
.card .last { font-size: .9rem; border-top: 1px solid var(--line); padding-top: 10px; min-height: 2.8em }
.rules { margin-top: 26px; background: var(--accent-soft); border-radius: 14px; padding: 18px 20px }
.rules ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 4px }

/* Testansicht */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar .in { max-width: 920px; margin: 0 auto; display: flex; gap: 14px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar .title { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.clock { font: 700 1.35rem/1 var(--f-mono); font-variant-numeric: tabular-nums; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent) }
.clock.low { background: var(--bad-soft); color: var(--bad) }
.strip { display: grid; grid-template-columns: repeat(min(var(--n, 15), 15), minmax(0, 1fr)); gap: 5px; margin-block: 16px 20px }
.strip button { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font: 700 .9rem var(--f-mono); position: relative; padding: 0 }
.strip button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.strip button.cur { outline: 3px solid var(--ink); outline-offset: 1px }
.strip button.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--mark) }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(8, minmax(0, 1fr)) } }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 14px; min-width: 0 }
.panel p { margin: 0 }
.passage { background: var(--bg); border-left: 4px solid var(--accent); border-radius: 6px; padding: 14px 16px; display: grid; gap: 8px }
.passage .t { font-weight: 700 }
.tbl { overflow-x: auto } table { border-collapse: collapse; font-size: .92rem; margin: 0 auto; font-variant-numeric: tabular-nums }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left } th { background: var(--accent-soft) }
.fig { text-align: center } .fig img { max-width: 100%; border-radius: 6px; background: #fff; cursor: zoom-in }
.fig.m img { width: 640px } body.k-fig .fig.m img { width: 360px } .fig.o img { width: 100% }
.stmts { display: grid; gap: 8px } .stmt { display: grid; grid-template-columns: 2.2em 1fr; gap: 6px }
.stmt b { font-family: var(--f-mono) }
.opts { display: grid; gap: 10px } .opts.grid8 { grid-template-columns: repeat(8, minmax(0, 1fr)) } .opts.grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)) }
@media (max-width: 560px) { .opts.grid8 { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.opt { display: flex; gap: 14px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px; min-height: 56px }
.opt .l { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 1rem var(--f-mono); background: var(--bg) }
.opt.sel { border-color: var(--accent); background: var(--accent-soft) } .opt.sel .l { background: var(--accent); color: var(--surface) }
.opts.grid8 .opt, .opts.grid4 .opt { justify-content: center; padding: 10px 4px }
.nav { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; margin-top: 18px }

/* Dialog und Zoom */
.veil { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 22, .55); display: grid; place-items: center; padding: 20px }
.dialog { background: var(--surface); border-radius: 16px; padding: 24px; max-width: 460px; width: 100%; display: grid; gap: 14px }
.zoom { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 22, .9); overflow: auto; display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 16px }
.zoom img { max-width: none; width: min(1500px, 220vw); background: #fff; border-radius: 6px }
.zoom .close { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); z-index: 31 }

/* Auswertung */
.score { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px }
.score .big { font: 700 3.2rem/1 var(--f-display) } .score .big small { font-size: 1.4rem; color: var(--muted) }
.bars { display: grid; grid-template-columns: repeat(min(var(--n, 15), 20), minmax(0, 1fr)); gap: 4px; margin-top: 10px }
.bars span { height: 12px; border-radius: 3px; background: var(--line) } .bars .r { background: var(--ok) } .bars .f { background: var(--bad) }
.list { display: grid; gap: 10px; margin-top: 20px }
.res { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.res > button { width: 100%; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 0; background: none; text-align: left }
.tag { font: 700 .78rem var(--f-mono); padding: 4px 8px; border-radius: 6px; flex: none }
.tag.r { background: var(--ok-soft); color: var(--ok) } .tag.f { background: var(--bad-soft); color: var(--bad) } .tag.e { background: var(--bg); color: var(--muted) }
.res .body { padding: 0 16px 16px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px }
.res .body p { margin: 0 }
.res .q { font-size: .92rem; color: var(--muted) }
.solimg img { width: 220px; max-width: 100% }
math { font-size: 1.1em } mfrac { font-size: .95em } .opt math { font-size: 1.15em }
.free { display: grid; gap: 10px } .free input { font: 700 1.4rem var(--f-mono); padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); width: 100%; max-width: 360px }
.free input:focus { outline: none; border-color: var(--accent) } .keys { display: flex; gap: 8px; flex-wrap: wrap } .keys .btn { min-width: 56px; font-family: var(--f-mono) }
@media (prefers-reduced-motion: no-preference) { .opt, .strip button { transition: background .12s, border-color .12s } }
</style>

<div id="app"><div class="wrap"><h1>__TITLE__</h1>
<p>Diese Seite braucht JavaScript. Wenn du diesen Text siehst, wird die Datei nur als Vorschau angezeigt (zum Beispiel in der App „Dateien“). Öffne sie in einem Browser, der Skripte ausführt.</p></div></div>
<div id="err" hidden style="position:fixed;left:0;right:0;bottom:0;z-index:99;background:#b23a2e;color:#fff;padding:12px max(16px, env(safe-area-inset-left, 0px));font:14px/1.4 system-ui"></div>

<script>
window.onerror = function (m, src, line) { var e = document.getElementById('err'); if (e) { e.hidden = false; e.textContent = 'Fehler in der App: ' + m + ' (Zeile ' + line + '). Bitte diesen Text weitergeben.' } };
</script>
<script>
const DATA = __DATA__;
const LS = "ac-app-" + DATA.key;
const store = {
  get(k, d) { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : d } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)) } catch (e) {} },
  del(k) { try { localStorage.removeItem(LS + k) } catch (e) {} }
};
const L = "ABCDEFGH";
const app = document.getElementById("app");
document.body.classList.add("k-" + DATA.key);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* Formeln: $...$ in Mini-Syntax (\frac{}{}, \sqrt{}, \sqrt[n]{}, ^{}, _{}, {Gruppe}) wird zu MathML */
function mathml(src) {
  let i = 0;
  const tok = t => t.replace(/[a-zA-Zäöü]+|[0-9]+(?:,[0-9]+)?|\s+|./g, m => /^\s+$/.test(m) ? "" : /^[0-9]/.test(m) ? `<mn>${esc(m)}</mn>` : /^[a-zA-Zäöü]$/.test(m) ? `<mi>${esc(m)}</mi>` : /^(log|max|min|ln|sin|cos)$/.test(m) ? `<mi mathvariant="normal">${m}</mi>` : /^[a-zA-Zäöü]+$/.test(m) ? m.split("").map(ch => `<mi>${ch}</mi>`).join("") : /^[()|,]$/.test(m) ? `<mo lspace="0" rspace="${m === "," ? "0.2em" : "0"}" stretchy="false">${esc(m)}</mo>` : `<mo>${esc(m)}</mo>`);
  function group() { if (src[i] !== "{") { const c = src[i++]; return tok(c) } i++; const r = seq("}"); i++; return r }
  function seq(end) {
    const atoms = []; let buf = "";
    const flush = () => { if (buf) { atoms.push({ text: buf }); buf = "" } };
    while (i < src.length && src[i] !== end) {
      const c = src[i];
      if (src.startsWith("\\frac", i)) { flush(); i += 5; const n = group(), d = group(); atoms.push({ h: `<mfrac><mrow>${n}</mrow><mrow>${d}</mrow></mfrac>` }) }
      else if (src.startsWith("\\sqrt", i)) { flush(); i += 5; let deg = null; if (src[i] === "[") { const j = src.indexOf("]", i); deg = src.slice(i + 1, j); i = j + 1 }
        const body = group(); atoms.push({ h: deg ? `<mroot><mrow>${body}</mrow><mn>${esc(deg)}</mn></mroot>` : `<msqrt>${body}</msqrt>` }) }
      else if (c === "\\" && (src[i + 1] === "{" || src[i + 1] === "}")) { buf += src[i + 1]; i += 2 }
      else if (c === "\\") { const m = /^\\([a-zA-Z]+)/.exec(src.slice(i)); atoms.push({ h: (flush(), `<mi mathvariant="normal">${m[1]}</mi>`) }); i += m[0].length }
      else if (c === "{") { flush(); atoms.push({ h: `<mrow>${group()}</mrow>` }) }
      else if (c === "^" || c === "_") { flush(); i++; const arg = group(); const last = atoms.pop(); let base = "<mrow></mrow>";
        if (last && last.text) { if (last.text.length > 1) atoms.push({ text: last.text.slice(0, -1) }); base = `<mrow>${tok(last.text.slice(-1))}</mrow>` }
        else if (last) base = last.h;
        atoms.push({ h: c === "^" ? `<msup>${base}<mrow>${arg}</mrow></msup>` : `<msub>${base}<mrow>${arg}</mrow></msub>` }) }
      else { buf += c; i++ }
    }
    flush();
    return atoms.map(a => a.text ? tok(a.text) : a.h).join("");
  }
  return `<math displaystyle="true">${seq(null)}</math>`;
}
const md = s => String(s == null ? "" : s).split(/(\$[^$]+\$)/).map(part => /^\$[^$]+\$$/.test(part) ? mathml(part.slice(1, -1)) : esc(part).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")).join("");

/* Freie Antworten: Brüche, Dezimalkomma, Minuszeichen */
function parseNum(t) {
  t = String(t || "").trim().replace(/[−–]/g, "-").replace(/\s| /g, "").replace(/,/g, ".");
  if (!t) return null;
  let m = /^(-?)(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/.exec(t);
  if (m) { const d = parseFloat(m[3]); return d ? (m[1] ? -1 : 1) * parseFloat(m[2]) / d : null }
  m = /^-?\d*\.?\d+$/.exec(t); return m ? parseFloat(t) : null;
}
const isAns = a => a !== null && a !== undefined && a !== "";
function closeEnough(a, v) {
  const x = parseNum(a); if (x === null) return false;
  if (Math.abs(x - v) < 1e-9) return true;
  const m = /[.,](\d+)$/.exec(String(a).trim());            /* gerundete Dezimalzahl mit mindestens drei Nachkommastellen */
  return !!m && m[1].length >= 3 && Math.abs(x - v) <= 0.5 * Math.pow(10, -m[1].length) + 1e-12;
}
const correct = (it, a) => it.open ? closeEnough(a, it.val) : a === it.answer;
let S = null, tick = null;

function fmt(sec) { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0") }

/* ---------- Startseite ---------- */
function home() {
  clearInterval(tick); S = null;
  const run = store.get("run", null);
  const hist = store.get("hist", {});
  app.innerHTML = `<div class="wrap">
    <div class="hero"><span class="eyebrow">${esc(DATA.eyebrow || "Assessment Centre Frankfurt School · Training")}</span>
      <h1>${esc(DATA.label)}</h1>
      <p class="muted">${DATA.description ? md(DATA.description) : `${["", "Ein", "Zwei", "Drei", "Vier", "Fünf", "Sechs", "Sieben", "Acht"][DATA.tests.length] || DATA.tests.length} Übungstests mit der Bearbeitungszeit des echten Tests. Am Ende siehst du deine Punktzahl und zu jeder Aufgabe den Lösungsweg.`}</p>
      <div class="row">${DATA.back ? `<a class="btn" href="${esc(DATA.back.href)}" style="text-decoration:none;display:inline-flex;align-items:center">← ${esc(DATA.back.label)}</a>` : ""}<button class="btn warn" id="reset">Ergebnisse zurücksetzen</button></div></div>
    ${run ? `<div class="card" style="margin-bottom:16px;border-color:var(--mark)"><h3>Laufender Test: ${esc(DATA.tests[run.t].name)}</h3>
      <p class="muted" style="margin:0">${DATA.tests[run.t].minutes ? `Die Zeit läuft weiter, auch wenn die App geschlossen ist. Restzeit: <strong>${fmt((run.end - Date.now()) / 1000)}</strong>` : "Dieser Test hat kein Zeitlimit."}</p>
      <div class="row"><button class="btn primary" id="resume">Fortsetzen</button><button class="btn" id="drop">Verwerfen</button></div></div>` : ""}
    <div class="tests">${DATA.tests.map((t, i) => {
      const h = hist[i];
      return `<div class="card"><span class="eyebrow">${esc(t.level)}</span><h2>${esc(t.name)}</h2>
        <div class="meta">${t.items.length} Aufgaben · ${t.minutes ? t.minutes + " Minuten" : "ohne Zeitlimit"}</div>
        <div class="last">${h ? `Letztes Ergebnis: <strong>${h.score} von ${t.items.length}</strong><br><span class="muted">${esc(h.date)} · ${h.tries} ${h.tries === 1 ? "Durchgang" : "Durchgänge"}</span>` : `<span class="muted">Noch nicht bearbeitet</span>`}</div>
        <button class="btn primary" data-start="${i}">Test starten</button></div>`
    }).join("")}</div>
    <div class="rules"><h3>${esc(DATA.rules_title || "So läuft es wie im AC")}</h3><ul>${DATA.rules ? DATA.rules.map(r => `<li>${md(r)}</li>`).join("") : `
      <li>Die Uhr startet mit dem Test und lässt sich nicht anhalten. Bei 0:00 wird automatisch abgegeben.</li>
      <li>Gezählt wird die zuletzt angetippte Antwort. Über die Nummernleiste springst du zu jeder Aufgabe.</li>
      <li>Mit „Markieren“ kennzeichnest du Aufgaben für den zweiten Durchgang.</li>
      ${DATA.key === "math" ? `<li>Bei Aufgaben mit Antwortfeld trägst du das Ergebnis selbst ein: ganze Zahl, Bruch wie 5/4 oder Dezimalzahl wie 1,25. Beide Schreibweisen gelten als richtig; gerundete Dezimalzahlen nur mit mindestens drei Nachkommastellen. Ob das AC ebenso großzügig ist, sagt der Übungstest nicht.</li>` : `<li>Grafiken lassen sich durch Antippen vergrößern.</li>`}
      <li>In dieser App kosten falsche Antworten keine Punkte. Ob das im AC ebenso gilt, sagen weder Tutorial noch Probetests; lass deshalb keine Aufgabe leer, solange die Einladung nichts anderes sagt.</li>`}</ul></div></div>`;
  app.querySelectorAll("[data-start]").forEach(b => b.onclick = () => start(+b.dataset.start));
  app.querySelector("#reset").onclick = () => {
    const v = document.createElement("div"); v.className = "veil";
    v.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h2>Ergebnisse zurücksetzen?</h2>
      <p style="margin:0">Alle gespeicherten Ergebnisse und ein laufender Test dieser App werden gelöscht. Das lässt sich nicht rückgängig machen.</p>
      <div class="row"><button class="btn" id="no">Abbrechen</button><button class="btn primary" id="yes">Ja, zurücksetzen</button></div></div>`;
    document.body.appendChild(v);
    v.querySelector("#no").onclick = () => v.remove();
    v.querySelector("#yes").onclick = () => { store.del("hist"); store.del("run"); v.remove(); home() };
  };
  if (run) { app.querySelector("#resume").onclick = () => { S = run; test() }; app.querySelector("#drop").onclick = () => { store.del("run"); home() } }
}

function start(t) {
  const T = DATA.tests[t];
  const N = T.items.length;
  S = { t, cur: 0, ans: Array(N).fill(null), flag: Array(N).fill(false), begin: Date.now(), end: T.minutes ? Date.now() + T.minutes * 60000 : 8.64e15 };
  store.set("run", S); test();
}

/* ---------- Test ---------- */
function test() {
  const T = DATA.tests[S.t];
  app.innerHTML = `<div class="bar"><div class="in"><span class="title">${esc(T.name)} · ${esc(DATA.label)}</span>
    <span class="clock" id="clock" aria-live="off">--:--</span><button class="btn warn" id="submit">Abgeben</button></div></div>
    <div class="wrap" style="padding-top:0"><div class="strip" id="strip" style="--n:${T.items.length}"></div><div id="q"></div>
    <div class="nav"><button class="btn" id="prev">Zurück</button><button class="btn" id="flag">Markieren</button><button class="btn primary" id="next">Weiter</button></div></div>`;
  app.querySelector("#prev").onclick = () => go(S.cur - 1);
  app.querySelector("#next").onclick = () => S.cur === DATA.tests[S.t].items.length - 1 ? confirmSubmit() : go(S.cur + 1);
  app.querySelector("#flag").onclick = () => { S.flag[S.cur] = !S.flag[S.cur]; save(); paint() };
  app.querySelector("#submit").onclick = confirmSubmit;
  clearInterval(tick); tick = setInterval(clock, 500); clock(); paint();
}
function save() { store.set("run", S) }
function go(i) { if (i < 0 || i > DATA.tests[S.t].items.length - 1) return; S.cur = i; save(); paint(); window.scrollTo({ top: 0 }) }
function clock() {
  const left = (S.end - Date.now()) / 1000, el = document.getElementById("clock");
  if (!el) return;
  if (!DATA.tests[S.t].minutes) { el.textContent = fmt((Date.now() - S.begin) / 1000); return }
  el.textContent = fmt(left); el.classList.toggle("low", left < 300);
  if (left <= 0) finish(true);
}

function itemHTML(it, interactive, chosen) {
  let h = "";
  if (it.passage) h += `<div class="passage"><span class="eyebrow">${esc(it.passage.label)}</span><span class="t">${esc(it.passage.title)}</span>${it.passage.paras.map(p => `<p>${md(p)}</p>`).join("")}</div>`;
  (it.stem || []).forEach(p => h += `<p>${md(p)}</p>`);
  if (it.table) h += `<div class="tbl"><table><thead><tr>${it.table.head.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${it.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if (it.img) h += `<div class="fig m"><img src="${it.img}" alt="Abbildung zur Aufgabe ${it.num}"></div>`;
  if (it.question) h += `<p><strong>${md(it.question)}</strong></p>`;
  else if (DATA.key === "fig") h += `<p><strong>Welches Bild vervollständigt das Muster?</strong></p>`;
  if (it.statements) h += `<div class="stmts">${it.statements.map((s, k) => `<div class="stmt"><b>${k ? "II." : "I."}</b><span>${md(s)}</span></div>`).join("")}</div>`;
  if (it.img2) h += `<div class="fig o"><img src="${it.img2}" alt="Antwortmöglichkeiten zur Aufgabe ${it.num}"></div>`;
  if (interactive) {
    if (it.open) h += `<div class="free"><label class="muted" for="free">Deine Antwort: ganze Zahl, Bruch wie 5/4 oder Dezimalzahl wie 1,25. Periodische Ergebnisse besser als Bruch eingeben.</label>
      <input id="free" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${esc(chosen || "")}">
      <div class="keys"><button class="btn" data-key="−">−</button><button class="btn" data-key="/">/</button><button class="btn" data-key=",">,</button><button class="btn" data-key="del">⌫</button></div></div>`;
    else if (it.options) h += `<div class="opts">${it.options.map((o, k) => `<button class="opt${chosen === k ? " sel" : ""}" data-k="${k}"><span class="l">${L[k]}</span><span>${md(o)}</span></button>`).join("")}</div>`;
    else h += `<div class="opts grid${it.nopts}">${Array.from({ length: it.nopts }, (_, k) => `<button class="opt${chosen === k ? " sel" : ""}" data-k="${k}" aria-label="Antwort ${L[k]}"><span class="l">${L[k]}</span></button>`).join("")}</div>`;
  }
  return h;
}

function paint() {
  const T = DATA.tests[S.t], it = T.items[S.cur];
  document.getElementById("strip").innerHTML = T.items.map((_, i) =>
    `<button class="${isAns(S.ans[i]) ? "done" : ""} ${S.flag[i] ? "flag" : ""} ${i === S.cur ? "cur" : ""}" data-i="${i}" aria-label="Aufgabe ${i + 1}">${i + 1}</button>`).join("");
  document.querySelectorAll("#strip button").forEach(b => b.onclick = () => go(+b.dataset.i));
  document.getElementById("q").innerHTML = `<div class="qhead"><h2>Aufgabe ${S.cur + 1}</h2><span class="muted">${S.cur === 0 && T.intro ? "" : ""}${S.flag[S.cur] ? "markiert" : ""}</span></div>
    <div class="panel">${S.cur === 0 && T.intro && !/Bearbeitungszeit/.test(T.intro) ? `<p class="muted">${md(T.intro)}</p>` : ""}${itemHTML(it, true, S.ans[S.cur])}</div>`;
  document.querySelectorAll("#q .opt").forEach(b => b.onclick = () => { S.ans[S.cur] = +b.dataset.k; save(); paint() });
  const inp = document.getElementById("free");
  if (inp) {
    const upd = () => { S.ans[S.cur] = inp.value.trim() || null; save(); const sb = document.querySelector('#strip [data-i="' + S.cur + '"]'); if (sb) sb.classList.toggle("done", isAns(S.ans[S.cur])) };
    inp.oninput = upd;
    document.querySelectorAll("#q [data-key]").forEach(b => b.onclick = () => { const k = b.dataset.key; inp.value = k === "del" ? inp.value.slice(0, -1) : inp.value + k; upd() });
  }
  document.querySelectorAll("#q .fig img").forEach(img => img.onclick = () => zoom(img.src));
  const f = document.getElementById("flag"); f.classList.toggle("on", S.flag[S.cur]); f.textContent = S.flag[S.cur] ? "Markiert" : "Markieren";
  document.getElementById("prev").disabled = S.cur === 0;
  document.getElementById("next").textContent = S.cur === T.items.length - 1 ? "Abgeben" : "Weiter";
}

function zoom(src) {
  const z = document.createElement("div"); z.className = "zoom";
  z.innerHTML = `<button class="btn close">Schließen</button><img src="${src}" alt="Vergrößerte Abbildung">`;
  z.onclick = e => { if (e.target === z || e.target.classList.contains("close")) z.remove() };
  document.body.appendChild(z);
}

function confirmSubmit() {
  const open = S.ans.filter(a => !isAns(a)).length, fl = S.flag.filter(Boolean).length;
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h2>Test beenden?</h2>
    <p style="margin:0">${S.ans.length - open} von ${S.ans.length} Aufgaben beantwortet${fl ? `, ${fl} markiert` : ""}.${DATA.tests[S.t].minutes ? ` Restzeit ${fmt((S.end - Date.now()) / 1000)}.` : ""}</p>
    ${open ? `<p style="margin:0;color:var(--bad)">${open} ${open === 1 ? "Aufgabe ist" : "Aufgaben sind"} noch offen. Eine vorläufige Antwort ist besser als keine.</p>` : ""}
    <div class="row"><button class="btn" id="no">Nein, weiterarbeiten</button><button class="btn primary" id="yes">Ja, abgeben</button></div></div>`;
  document.body.appendChild(v);
  v.querySelector("#no").onclick = () => v.remove();
  v.querySelector("#yes").onclick = () => { v.remove(); finish(false) };
}

function finish(timeout) {
  clearInterval(tick);
  document.querySelectorAll(".veil,.zoom").forEach(x => x.remove());
  const T = DATA.tests[S.t];
  const used = T.minutes ? Math.min(T.minutes * 60, (Math.min(Date.now(), S.end) - S.begin) / 1000) : (Date.now() - S.begin) / 1000;
  const score = T.items.reduce((n, it, i) => n + (correct(it, S.ans[i]) ? 1 : 0), 0);
  const hist = store.get("hist", {}); const prev = hist[S.t];
  hist[S.t] = { score, date: new Date().toLocaleDateString("de-DE"), tries: (prev ? prev.tries : 0) + 1, best: Math.max(score, prev ? prev.best || prev.score : 0) };
  store.set("hist", hist); store.del("run");
  results({ t: S.t, ans: S.ans.slice(), used, score, timeout, best: hist[S.t].best });
}

/* ---------- Auswertung ---------- */
function results(R) {
  const T = DATA.tests[R.t];
  const st = T.items.map((it, i) => !isAns(R.ans[i]) ? "e" : correct(it, R.ans[i]) ? "r" : "f");
  const wrong = st.filter(s => s === "f").length, empty = st.filter(s => s === "e").length;
  const NN = T.items.length, pct = Math.round(R.score / NN * 100);
  app.innerHTML = `<div class="wrap">
    <div class="hero"><span class="eyebrow">Auswertung · ${esc(DATA.label)}</span><h1>${esc(T.name)}</h1>
      ${R.timeout ? `<p style="color:var(--bad)">Die Zeit ist abgelaufen; der Test wurde automatisch abgegeben.</p>` : ""}</div>
    <div class="score"><div class="big">${R.score}<small> / ${NN}</small></div>
      <div><strong>${pct} Prozent richtig</strong> · ${wrong} falsch · ${empty} leer<br>
      <span class="muted">Bearbeitungszeit ${fmt(R.used)}${T.minutes ? ` von ${T.minutes}:00` : ""} · bestes Ergebnis ${R.best} von ${NN}</span>
      <div class="bars" style="--n:${st.length}">${st.map(s => `<span class="${s}"></span>`).join("")}</div></div></div>
    <div class="row" style="margin-top:16px"><button class="btn" id="onlyf">Nur Fehler und leere zeigen</button><button class="btn" id="again">Test wiederholen</button><button class="btn primary" id="back">Zur Übersicht</button></div>
    <div class="list" id="list"></div></div>`;
  let only = false;
  const draw = () => {
    document.getElementById("list").innerHTML = T.items.map((it, i) => {
      if (only && st[i] === "r") return "";
      const a = R.ans[i];
      const lab = { r: "richtig", f: "falsch", e: "leer" }[st[i]];
      return `<div class="res"><button data-i="${i}" aria-expanded="false"><span class="tag ${st[i]}">${lab}</span><span><strong>Aufgabe ${i + 1}</strong> · deine Antwort ${!isAns(a) ? "–" : it.open ? esc(a) : L[a]} · richtig ${md(it.answer_label)}</span></button>
        <div class="body" hidden>${it.solimg ? `<div class="solimg"><img src="${it.solimg}" alt="Gelöste Matrix"></div>` : ""}
        ${(it.solution || []).map(p => `<p>${md(p)}</p>`).join("")}
        <details><summary class="muted">Aufgabe noch einmal ansehen</summary><div class="panel q" style="margin-top:10px">${itemHTML(it, false)}</div></details></div></div>`;
    }).join("");
    document.querySelectorAll("#list .res > button").forEach(b => b.onclick = () => {
      const body = b.nextElementSibling; body.hidden = !body.hidden; b.setAttribute("aria-expanded", String(!body.hidden));
    });
    document.querySelectorAll("#list .fig img").forEach(img => img.onclick = () => zoom(img.src));
  };
  draw();
  document.getElementById("onlyf").onclick = e => { only = !only; e.target.textContent = only ? "Alle Aufgaben zeigen" : "Nur Fehler und leere zeigen"; draw() };
  document.getElementById("again").onclick = () => start(R.t);
  document.getElementById("back").onclick = home;
  window.scrollTo({ top: 0 });
}

const running = store.get("run", null);
if (running && running.end > Date.now()) { S = running; test() }
else { if (running) { S = running; finish(true) } else home() }
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}) } catch (e) {}
</script>
